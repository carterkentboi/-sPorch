  if(has(t,/\b(fact|facts|history|origin|origins|trivia|learn|know)\b/)) return nextFact();
  if(has(t,/\b(joke|jokes|funny)\b/)) return say(JOKES[jokeIdx++%JOKES.length]+" Heh heh heh.");
  if(has(t,/\b(story|scary|spooky|creepy|tale|tell|another|more|next|read)\b/)) return randomStory();
  if(has(t,/\b(hi|hello|hey|sup|yo)\b/)) return say("Hello, little ghoul. Want a story, a fact, or a joke?"+maybeAsk(.5));
  if(has(t,/\b(who|name)\b/)) return say("I am the Turkey. I stand on your porch every November. You never noticed me move, did you?");
  if(has(t,/\b(help|what can)\b/)) return say(HELP);
  if(has(t,/\b(candy|treat|treats|pie|pies|dessert|stuffing)\b/)) return say("Sweet things are wonderful. But always check what is inside the pie... gobble gobble. Sometimes it's more pie."+maybeAsk(.4));
  if(has(t,/\b(thanks|thank)\b/)) return say("You are welcome, traveler. Sleep well. If you can.");
  if(has(t,/\b(lol|haha|hehe|lmao)\b/)) return say("I do not know why you are laughing but I am laughing too. Heh heh heh heh heh. ...Heh.");
  if(has(t,/\b(bored|boring)\b/)) return say("Bored? On Halloween? Say story. Or let me stare at you in silence for a minute. I'm very good at that.");
  if(has(t,/\b(scared|afraid|scary)\b/)) return say("Good. Fear is just excitement wearing a bedsheet.");
  say(DERANGED[Math.floor(Math.random()*DERANGED.length)]+maybeAsk(.35));
}

/* =====================================================

   1 min: hypnosis   3 min: shriek, then random haunting
   4 min: creepy doll (never stops, even with sound off)
   ===================================================== */
var lastActive=Date.now(), stage=0, nextHaunt=0, dollMode=false, dollN=0;
function noteActive(){
  lastActive=Date.now();
  if(stage>0){ stage=0; }

  document.getElementById('dark').className='';
}

function pulse(cls,ms){ document.body.classList.add(cls); setTimeout(function(){ document.body.classList.remove(cls); },ms); }

function hypnosis(){
  var txt="Heeeey... you've been sitting so very still. Look into my little black eyes... deeper... deeper... Your eyelids are getting heavy, like cold gravy... When I count to three you will crave mashed potatoes and forget what day it is... One... two... oh, you're still here. Good. That means it's working.";
  add(txt,'bot'); speak(txt,true,0.4,0.7);
  var sp=document.getElementById('spiral'); sp.className='on';
  setTimeout(function(){ sp.className=''; },9000);
}
function shriek(){
  add("AAAAAAAIIIIIIIEEEEEEEEE!!!",'bot','shriek');
  shriekSound();
  if(voiceOn && synth){ try{ micHush(); var u=new SpeechSynthesisUtterance("Aaaaaaaiiiiieeeeeee!"); u.pitch=2; u.rate=1.5; trackUtt(u,""); synth.speak(u);}catch(e){} }
  pulse('shake',1500);
  var fl=document.getElementById('flash'); fl.className='on'; setTimeout(function(){ fl.className=''; },1100);
  setTimeout(function(){ if(stage>=2){ var t="Sorry. I get like that when nobody talks to me. ...Are you still alive over there?"; add(t,'bot'); speak(t,true);} },3500);
}

setInterval(function(){
  if(!started) return;

  if(idle>180 && stage<2){ stage=2; shriek(); nextHaunt=now+25000; }

/* =====================================================
   VOICE INPUT (microphone). Tap the mic: he listens, you talk,
   he answers out loud, then listens again. Tap the mic while he
   is talking to make him stop and listen. Tap again to turn off.
   ===================================================== */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var micBtn=document.getElementById('mic'), micOn=false, listening=false, rec=null, micAborted=false, micHinted=false;
function speaking(){ return talking(); }
function duck(on){ try{ if(master) master.gain.setTargetAtTime(on?0.05:(musicOn?MUSIC_LEVEL:0), ac.currentTime, 0.1); }catch(e){} }
function setMicUI(){ micBtn.classList.toggle('armed',micOn); if(!micOn){ micBtn.classList.remove('live'); q.placeholder="Talk to the Turkey..."; } }
function startListen(){
  if(!SR || !micOn || listening || speaking() || !started) return;
  try{
    rec=new SR(); rec.lang='en-US'; rec.interimResults=true; rec.continuous=false; rec.maxAlternatives=1;
    var lastTxt='';
    micAborted=false;
    rec.onstart=function(){ listening=true; micBtn.classList.add('live'); q.placeholder="Listening... speak now"; duck(true); };
    rec.onresult=function(e){
      if(talking()){ lastTxt=''; q.value=''; micAborted=true; try{ rec.abort(); }catch(err){} return; }
      var txt='';
      for(var i=0;i<e.results.length;i++) txt+=e.results[i][0].transcript;
      lastTxt=txt; q.value=txt;
    };
    rec.onerror=function(e){
      if(e.error==='not-allowed' || e.error==='service-not-allowed'){
        micOn=false; setMicUI();
        add("I cannot hear you. The microphone is blocked. Allow microphone access for this page in your browser settings, then tap the mic again.",'bot');
      }
    };
    rec.onend=function(){
      listening=false; micBtn.classList.remove('live'); duck(false);
      if(micOn) q.placeholder="Talk to the Turkey...";
      var v=lastTxt.trim();
      if(!micAborted && v && !talking() && !isEcho(v)){ q.value=v; submitMsg(); } else { q.value=''; }
    };
    rec.start();
  }catch(e){ listening=false; }
}
micBtn.addEventListener('click',function(){
  noteActive();
  if(!SR){
    add("Your browser can't listen to voices. Try Chrome on Android or Safari on iPhone, on the https link.",'bot');
    return;
  }
  if(!micOn && !micHinted){
    micHinted=true;
    add("🎤 Voice chat is on. Just talk to me. I'll listen after I finish speaking. Tap the mic while I'm talking to make me stop and listen, or tap it again to turn the mic off.",'bot');
  }
  if(speaking()){ try{ synth.cancel(); }catch(e){} talkPending=0; quietUntil=Date.now()+500; micOn=true; setMicUI(); return; }
  micOn=!micOn; setMicUI();
  if(!micOn){ micAborted=true; try{ rec && rec.abort(); }catch(e){} }
  else startListen();
});
/* keeps the mic from hearing his own voice: pause while he talks, resume after */
setInterval(function(){
  if(!SR || !started) return;
  if(micOn && listening && speaking()){ micAborted=true; try{ rec.abort(); }catch(e){} }
  else if(micOn && !listening && !speaking()){ startListen(); }
},600);

function buildSearch(){
  var out='<rect class="f" x="0" y="0" width="300" height="400"/>';
  out+='<text class="x" x="150" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#b4501b" stroke="none" font-family="Georgia,serif">THE WORD SEARCH</text>';
  var seed=7, L='ABDEFGHIJMNOPQSTUVWXYZ', rows=11, cols=11, cs=24, ox=18, oy=58, r, c, ch, big, tx, ty;
  var word='CLARK';
  for(r=0;r<rows;r++){
    for(c=0;c<cols;c++){
      big=(r===5 && c>=3 && c<=7);
      seed=(seed*1103515245+12345)%2147483648;
      ch=big?word.charAt(c-3):L.charAt(Math.floor(seed/65536)%L.length);
      out+='<rect class="f" x="'+(ox+c*cs)+'" y="'+(oy+r*cs)+'" width="'+cs+'" height="'+cs+'" style="stroke-width:1"/>';
      tx=ox+c*cs+cs/2; ty=oy+r*cs+(big?cs*0.8:cs*0.69);
      out+='<text class="x" x="'+tx+'" y="'+ty+'" text-anchor="middle" font-family="Georgia,serif" stroke="none" '+(big?'font-size="23" font-weight="bold" fill="#b3261e"':'font-size="13" fill="#3b2a22"')+'>'+ch+'</text>';
    }
  }
  out+='<text class="x" x="150" y="352" text-anchor="middle" font-size="11" fill="#6a5040" stroke="none" font-family="Georgia,serif">Tap squares to circle words. CLARK is in the exact center.</text>';
  return out;
}

      var c=document.createElement('canvas'); c.width=900; c.height=1200;
