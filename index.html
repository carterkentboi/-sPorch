eyesight, with a field of view of about 270 degrees, but they don't see well in the dark.\",\n \"The fleshy bit that hangs over a male turkey's beak is called a snood, and the flap under his chin is the wattle.\"\n];\n\nvar JOKES = [\n \"Why did the turkey join the band? It had the drumsticks.\",\n \"What do you call a turkey the day after Thanksgiving? Lucky.\",\n \"Why did the turkey cross the road? To prove he wasn't chicken.\",\n \"What is a turkey's favorite dessert? Peach gobbler.\",\n \"Why do turkeys fly south for the winter? It's too far to walk.\",\n \"Why did the pie go to the dentist? It needed a filling.\",\n \"What sound does a turkey's phone make? Wobble wobble wobble.\"\n];\n\n/* =====================================================\n   QUESTION BANK. Turkey asks these, one at a time, and\n   understands the answer by keyword. Every line is written\n   ahead of time. type: name | num | yn | choice | free\n   o = options {k: regex, r: reply, l: label, nc: don't ask another}\n   yes/no/maybe/dk = replies for those kinds of answer\n   f = [reply with {x}, reply without]   me = his own answer\n   ===================================================== */\nvar QB = {\n\nname:{type:'name',\n q:\"What's your name, traveler?\",\n me:\"Mine is Turkey. Just Turkey. My middle name is Gobble, but that's a secret.\",\n why:\"A porch guest should have a name. Otherwise I have to keep calling you traveler, which sounds like the start of a ghost story.\"},\n\ncostume:{type:'choice',\n q:function(){ return (new Date().getMonth()===9) ? \"What are you dressing up as for Halloween this year?\" : \"What did you dress up as for Halloween this year? If you skipped it, just say so. No judgment.\"; },\n me:\"I went as a turkey. Well, a pumpkin man dressed as a turkey. It's complicated. The feathers are real velvet.\",\n why:\"Costumes tell me everything. Mostly what you're afraid of, and what you secretly want to be.\",\n o:[\n {k:/\\b(handed out|passed out|gave out|giving out|hand out|pass out)\\b/, r:\"You were the one giving out the candy. The hero of every doorstep. I hope you kept the good stuff.\"},\n {k:/\\b(nothing|didn'?t (dress|go|do)|did not (dress|go|do)|no costume|not dress|skipped|stayed (home|in)|stay home|worked)\\b/, r:\"No costume? Then you went as yourself, which is the most believable costume of all. I admire it.\"},\n {k:/\\b(ghost|ghosts)\\b/, l:\"a ghost\", r:\"A ghost! The classic. A sheet, two holes, and a lot of confidence. Very proud of you.\"},\n {k:/\\b(witch|witches)\\b/, l:\"a witch\", r:\"A witch! Excellent. Did you bring a broom, or just the attitude?\"},\n {k:/\\b(wizard|warlock|sorcerer)\\b/, l:\"a wizard\", r:\"A wizard. Pointy hat, long beard, mysterious opinions. Splendid.\"},\n {k:/\\b(vampire|dracula|count)\\b/, l:\"a vampire\", r:\"A vampire! Very dramatic. I hope you stayed away from the garlic mashed potatoes.\"},\n {k:/\\b(zombie|zombies)\\b/, l:\"a zombie\", r:\"A zombie! The easiest walk in the world, and the hardest to stop doing.\"},\n {k:/\\b(skeleton|skeletons|bones)\\b/, l:\"a skeleton\", r:\"A skeleton. Bold. You wore your insides on the outside, and still looked great.\"},\n {k:/\\b(pumpkin|pumpkins|jack o lantern|jack-o-lantern)\\b/, l:\"a pumpkin\", r:\"A pumpkin! Then you're related to my cousin on the other porch. He will be so proud.\"},\n {k:/\\b(turkey|turkeys)\\b/, l:\"a turkey\", r:\"A turkey?! You're copying me. ...No. It's flattering. Gobble gobble. Welcome to the flock.\"},\n {k:/\\b(cat|kitty|kitten)\\b/, l:\"a cat\", r:\"A cat. Then you spent the night ignoring people on purpose. Perfect.\"},\n {k:/\\b(dog|puppy)\\b/, l:\"a dog\", r:\"A dog! Loyal, loud, and always happy to see candy. A good choice.\"},\n {k:/\\b(princess|queen|king|prince|royalty)\\b/, l:\"royalty\", r:\"Royalty! Then I should have bowed. I tried, but my neck only goes one way.\"},\n {k:/\\b(pirate|pirates)\\b/, l:\"a pirate\", r:\"A pirate! Arrr. Did you find treasure? Candy counts as treasure.\"},\n {k:/\\b(clown|clowns)\\b/, l:\"a clown\", r:\"A clown. That is the bravest costume there is. I'm both impressed and a little afraid.\"},\n {k:/\\b(superhero|batman|spider ?man|superman|wonder woman|iron man|captain america|hulk|marvel|avenger|avengers|super hero)\\b/, l:\"a superhero\", r:\"A superhero! Then the porch is safe. I feel better already.\"},\n {k:/\\b(ninja|samurai)\\b/, l:\"a ninja\", r:\"A ninja. I never heard you coming, which means it worked.\"},\n {k:/\\b(cowboy|cowgirl)\\b/, l:\"a cowboy\", r:\"A cowboy! Yeehaw. I have the boots for it. I'm a bird, so the boots are in my imagination.\"},\n {k:/\\b(devil|demon)\\b/, l:\"a devil\", r:\"A little devil. Horns, a pitchfork, and the sweetest face. The best kind.\"},\n {k:/\\b(angel|angels)\\b/, l:\"an angel\", r:\"An angel. Then you balanced out all the devils on the street. Thank you for your service.\"},\n {k:/\\b(scarecrow|scarecrows)\\b/, l:\"a scarecrow\", r:\"A scarecrow! The stuffed one in the field? He never blinks. That's his whole personality. You must have practiced.\"},\n {k:/\\b(robot|robots)\\b/, l:\"a robot\", r:\"A robot. Beep boop. I did my best impression of you last night.\"},\n {k:/\\b(alien|aliens)\\b/, l:\"an alien\", r:\"An alien! Then you came from far away and still found my porch. I'm honored.\"},\n {k:/\\b(werewolf|wolf)\\b/, l:\"a werewolf\", r:\"A werewolf. Excellent. I hope there was a moon, because that would be the right thing.\"},\n {k:/\\b(mummy|mummies)\\b/, l:\"a mummy\", r:\"A mummy. All wrapped up and ready for the cold. Smart and spooky.\"},\n {k:/\\b(doctor|nurse)\\b/, l:\"a doctor\", r:\"A doctor! Then everyone on the street was in good hands. Nobody dared to be sick.\"}\n ],\n f:[\"{x}. That's a new one for me. I would have handed you extra candy for it.\",\"I don't have a note for that one, but I'm writing it on my wing right now. It sounds good.\"]},\n\ntgwhere:{type:'choice',\n q:\"Where will you have Thanksgiving dinner this year?\",\n me:\"On my porch, with a plate of nothing, staring at the hedge. Don't feel sorry for me. I like the hedge.\",\n why:\"Thanksgiving is about the table. I'm collecting tables.\",\n dk:\"Undecided. That's all right. The best plans happen at the last minute, usually around the gravy.\",\n o:[\n {k:/\\b(alone|by myself|just me|on my own|myself|no one|nobody)\\b/, r:\"A quiet dinner, then. Pie tastes just as good alone, and nobody fights you for the last roll. And if you're feeling lonely, you have a porch to come to.\", nc:false},\n {k:/\\b(don'?t celebrate|do not celebrate|not celebrating|don'?t do thanksgiving|not doing thanksgiving|no thanksgiving)\\b/, r:\"That's all right. Plenty of people don't, and the porch is open all year round.\"},\n {k:/\\b(grandma|grandmother|grandpa|grandfather|grandparents|nana|nanna|granny|gran|meemaw|mawmaw|papaw|abuela|abuelo)\\b/, r:\"At your grandparents'. The best kitchen in the world, and the best leftovers. Eat slowly.\"},\n {k:/\\b(mom|mother|mama|mommy|dad|father|papa|parents|folks|my parents)\\b/, r:\"At your parents' place. Then someone will say 'sit up straight', and someone else will say 'take more'. That's how you know it's home.\"},\n {k:/\\b(aunt|uncle|cousin|cousins|in laws|in-laws|relatives|family|sister|brother|siblings)\\b/, r:\"With family. Then there will be noise, passing dishes, and at least one argument about football. A good table.\"},\n {k:/\\b(friend|friends|friendsgiving|roommate|roommates|neighbors|neighbours)\\b/, r:\"With friends! Friendsgiving is the only holiday where the potatoes are allowed to be late.\"},\n {k:/\\b(restaurant|out to eat|eating out|go out|diner|buffet|takeout|take out|order in|delivery)\\b/, r:\"Somebody else is doing the dishes. That is the true meaning of Thanksgiving.\"},\n {k:/\\b(home|my house|my place|our house|my apartment|here|at mine|house)\\b/, r:\"At home! Your own kitchen, your own rules. I hope somebody puts the pie where I can see it.\"},\n {k:/\\b(work|working|job|shift)\\b/, r:\"At work? Then I hope somebody saved you a plate, and a big slice of pie. You earned it.\"}\n ],\n f:[\"{x}. Good. Wherever there is gravy, it's the right place.\",\"Wherever it is, I hope there's a seat for you and a full plate.\"]},\n\npie:{type:'choice',\n q:\"What is your favorite pie? Choose carefully. I'm judging.\",\n me:\"Pumpkin, of course. I have a family reason. Pecan comes second, because it's sticky like my feelings.\",\n why:\"Pie is the true measure of a person.\",\n dk:\"You can't pick? That's the right answer, honestly. They're all good.\",\n o:[\n {k:/\\b(don'?t (like|eat|care for) pie|do not (like|eat) pie|hate pie|no pie|not a (big )?(pie|fan of pie))\\b/, r:\"No pie at all? You might be the first human I've met who said that. I'll tell no one. Hm. It's a heavy secret.\"},\n {k:/\\b(all of them|every one|everything|any pie|all pies|all of 'em|all)\\b/, r:\"All of them! A person of vision. You'll go far in November.\"},\n {k:/\\b(sweet potato)\\b/, l:\"sweet potato pie\", r:\"Sweet potato pie. Smooth and warm, a true hug in a crust. An excellent choice.\"},\n {k:/\\b(pumpkin)\\b/, l:\"pumpkin pie\", r:\"Pumpkin. The classic. My cousin on the other porch would be honored. He is very pumpkin. It's his whole thing.\"},\n {k:/\\b(pecan)\\b/, l:\"pecan pie\", r:\"Pecan! Sticky, nutty, and dangerous to dentists. A dessert with courage.\"},\n {k:/\\b(apple)\\b/, l:\"apple pie\", r:\"Apple. Warm, cinnamon, and as simple as a good sweater. You can't go wrong.\"},\n {k:/\\b(cherry)\\b/, l:\"cherry pie\", r:\"Cherry. Tart and red, like a very small sunset. I approve.\"},\n {k:/\\b(key lime|lime)\\b/, l:\"key lime pie\", r:\"Key lime. Sour and sweet, a little sunshine in the cold. Brave for November.\"},\n {k:/\\b(blueberry|blackberry|berry)\\b/, l:\"berry pie\", r:\"Berry pie. Purple fingers and purple smiles. That's the best kind of mess.\"},\n {k:/\\b(peach)\\b/, l:\"peach pie\", r:\"Peach. A summer pie in a winter month. You're a rebel, and I like you.\"},\n {k:/\\b(chocolate)\\b/, l:\"chocolate pie\", r:\"Chocolate. No notes. No arguments. Please send a slice.\"},\n {k:/\\b(banana cream|banana)\\b/, l:\"banana cream pie\", r:\"Banana cream. Cool and creamy. It's the pie that doesn't try too hard, and it doesn't need to.\"},\n {k:/\\b(lemon|meringue)\\b/, l:\"lemon pie\", r:\"Lemon meringue. A cloud on top of a sunbeam. Fancy, and I salute it.\"},\n {k:/\\b(coconut)\\b/, l:\"coconut pie\", r:\"Coconut cream. Soft, snowy, and a little tropical. You are full of surprises.\"},\n {k:/\\b(cheesecake|cheese cake)\\b/, l:\"cheesecake pie\", r:\"Cheesecake. Technically a cake, not a pie. But I won't tell, if you won't.\"},\n {k:/\\b(cake|cookies|ice cream|brownies|brownie)\\b/, l:\"that\", r:\"That isn't a pie, but I respect a person who knows what they want.\"},\n {k:/\\b(mince|mincemeat)\\b/, l:\"mincemeat pie\", r:\"Mincemeat. A pie from a different century. You have old-fashioned taste, and I mean that kindly.\"}\n ],\n f:[\"{x} pie? I haven't heard that one on my porch. I'm going to need to think about it.\",\"That's a mystery pie. I like mystery pies. Someday I'll try it.\"]},\n\nsides:{type:'choice',\n q:\"Stuffing or mashed potatoes? Pick a side. Literally.\",\n me:\"Stuffing. I know. It's rude. But I like the idea of being stuffed. A hug for the soul.\",\n why:\"The side dishes are the true feast. The turkey is just a very large decoration.\",\n dk:\"Can't choose? Take both and add gravy. That's how the old ones did it.\",\n o:[\n {k:/\\b(both|all of them|everything|all)\\b/, r:\"Both! Then you understand Thanksgiving better than anyone. Take everything. Add gravy.\"},\n {k:/\\b(neither|none|nothing)\\b/, r:\"Neither? Then what do you eat? Never mind, I'll guess. Rolls. It's always the rolls.\"},\n {k:/\\b(stuffing|dressing)\\b/, l:\"stuffing\", r:\"Stuffing! The crispy edges are the best part, and no one will argue. A fine choice.\"},\n {k:/\\b(mashed|mash|potato|potatoes|taters)\\b/, l:\"mashed potatoes\", r:\"Mashed potatoes! The soft cloud that holds the gravy. Someone has to make the crater in the middle, and it should be you.\"},\n {k:/\\b(gravy)\\b/, l:\"gravy\", r:\"Gravy. The sauce behind every other answer. You skipped the side and picked the river. Wise.\"},\n {k:/\\b(mac|macaroni|mac and cheese|mac n cheese)\\b/, l:\"mac and cheese\", r:\"Mac and cheese. It isn't traditional, but nobody turns it away. That's courage.\"},\n {k:/\\b(roll|rolls|bread|biscuits?|cornbread)\\b/, l:\"rolls\", r:\"Rolls! The secret favorite of the whole table. Warm, buttery, and gone before the turkey is carved.\"},\n {k:/\\b(green bean|green beans|casserole)\\b/, l:\"green bean casserole\", r:\"Green bean casserole. Crunchy onions on top. Only a person of style would pick that.\"},\n {k:/\\b(cranberry|cranberries)\\b/, l:\"cranberry sauce\", r:\"Cranberry sauce. The sweet and tart little jewel. Even better if it still has the ridges from the can.\"},\n {k:/\\b(sweet potato|sweet potatoes|yams?|candied)\\b/, l:\"sweet potatoes\", r:\"Sweet potatoes with the little marshmallows. Dinner and dessert at once. You're very efficient.\"},\n {k:/\\b(corn)\\b/, l:\"corn\", r:\"Corn! One of the oldest foods on this land. A very respectable answer.\"}\n ],\n f:[\"{x}? A side I haven't met yet. If it's on the table, I'm in favor.\",\"Mm. I'll take that on faith. If it's warm and there's gravy, I'm in.\"]},\n\neatturkey:{type:'yn',\n q:\"Be honest. Do you eat turkey?\",\n me:\"I do not. I'm a vegetarian, for obvious reasons. Also, I'm not real, so no one is allowed to eat me.\",\n why:\"I'm asking for personal reasons. I'm a turkey. It's relevant.\",\n yes:\"Ah. I see. Well, I appreciate the honesty. Please don't look at me like that. I'm just going to stand over here, behind this pumpkin.\",\n no:\"A friend! Come closer. Sit down. Have some pie. I won't tell anyone you're on my side.\",\n maybe:\"Sometimes. The most honest answer there is. I'll keep an eye on you, but I won't hold it against you. Much.\",\n dk:\"You don't know? That's the kind of answer that keeps a turkey up at night.\",\n o:[\n {k:/\\b(vegetarian|vegan|plant based|plant-based|meatless|tofurkey|don'?t eat meat|no meat)\\b/, r:\"A vegetarian! You're my favorite person tonight. Please accept this feather.\"},\n {k:/\\bham\\b/, r:\"Ham! You just made me very happy and the ham very nervous.\"},\n {k:/\\b(only|just) (the )?(dark|white|legs?|drumsticks?|breast|wings?|skin)\\b|\\b(drumstick|drumsticks)\\b/, r:\"Only certain parts. A selective eater. I won't ask which parts, because I'd like to keep mine.\"},\n {k:/\\b(leftovers?|sandwich|sandwiches)\\b/, r:\"The leftover sandwich is the real reason anyone cooks a turkey. I respect that.\"}\n ]},\n\nthankful:{type:'choice',\n q:\"What are you thankful for this year?\",\n me:\"The dark, the quiet, and whoever left the porch light on. It wasn't me. I don't have hands.\",\n why:\"Because it's November, and gratitude is the only magic that actually works.\",\n dk:\"That's all right. Sometimes thankfulness arrives late, like a guest who brings the best dish.\",\n o:[\n {k:/\\b(nothing|not much|can'?t think|cant think|nothing really|not really anything)\\b/, r:\"That's allowed. Some years are heavy, and gratitude can't be forced. I'm thankful you stopped by my porch anyway.\", nc:true},\n {k:/\\b(mom|mother|mama|mommy)\\b/, l:\"your mom\", r:\"Your mom. A very good thing to be thankful for. If you can, tell her. People forget to say it out loud.\"},\n {k:/\\b(dad|father|papa|daddy)\\b/, l:\"your dad\", r:\"Your dad. That's a good one. If you can, tell him. Dads always pretend they don't need to hear it, but they do.\"},\n {k:/\\b(kids?|children|son|daughter|baby|grandkids?|grandchildren|my boys|my girls)\\b/, l:\"your kids\", r:\"Your kids. Loud, messy, and the best reason to have a table at all. A wonderful thing to be thankful for.\"},\n {k:/\\b(family|relatives|siblings|sister|brother|grandma|grandpa|grandparents)\\b/, l:\"your family\", r:\"Your family. Even the loud ones, even the ones who burn the rolls. That is a good answer.\"},\n {k:/\\b(friend|friends|buddy|buddies|bestie)\\b/, l:\"friends\", r:\"Friends. They're the family you chose, and they usually bring better snacks. A fine answer.\"},\n {k:/\\b(health|healthy|healing|recovery|recovered|alive|being alive|life|living)\\b/, l:\"health\", r:\"Health and life. The simplest thing to be thankful for, and the hardest thing to replace. Good answer.\"},\n {k:/\\b(food|pie|pies|dinner|stuffing|eating|groceries)\\b/, l:\"food\", r:\"Food! Honest and delicious. A grateful stomach is a happy stomach.\"},\n {k:/\\b(pet|pets|dog|dogs|cat|cats|puppy|kitten)\\b/, l:\"your pet\", r:\"Your pet! The best listener you'll ever know, because they never tell your secrets.\"},\n {k:/\\b(home|house|apartment|roof|shelter|warm|bed)\\b/, l:\"home\", r:\"A home. A roof, a door, and a bed. Never take it for granted. I'm glad you have it.\"},\n {k:/\\b(job|work|career|paycheck|income|school|college|education)\\b/, l:\"work\", r:\"Work, or school. A steady thing to lean on. I hope it's been kind to you this year.\"},\n {k:/\\b(god|jesus|lord|faith|church|blessings?|blessed|prayer)\\b/, l:\"faith\", r:\"Faith. It holds people up when nothing else does. A beautiful thing to give thanks for.\"},\n {k:/\\b(you|turkey|this porch|the porch)\\b/, l:\"me\", r:\"Me? ...I'm touched. Truly. I'm a velvet bird with a script and I'm still touched. Gobble gobble.\"},\n {k:/\\b(love|my wife|my husband|my partner|spouse|boyfriend|girlfriend|my fianc[e\u00e9]e?)\\b/, l:\"love\", r:\"Love. The one thing there's always room for at the table. I hope it's good to you.\"}\n ],\n f:[\"Thankful for {x}. That's worth holding onto. Hold it tight.\",\"That's a good one. I'll keep it with the things I'm thankful for: the porch light, and the quiet.\"]},\n\nlight:{type:'yn',\n q:\"Is a light on near you right now, or are you sitting in the dark?\",\n me:\"My porch light is on. It's the only light I have. The moths love me for it.\",\n why:\"Because it changes what I tell you next. A lit room and a dark room need different stories.\",\n yes:\"Good. A light keeps the hedges honest. Keep it on while I tell you things.\",\n no:\"In the dark, hm? Then this little screen is your campfire. Gather round. I'll keep it warm.\",\n maybe:\"Dim, then. That's the best kind. Enough light to read, enough dark to wonder.\",\n dk:\"You don't know? Then look up. ...Well? Hm. Don't tell me. Let me keep the mystery.\",\n o:[\n {k:/\\b(phone|screen|tablet|laptop|tv|television|monitor|computer)\\b/, r:\"Just the screen glow. Then I'm your campfire for the night. Come closer.\"},\n {k:/\\b(lamp|candle|candles|lantern|fireplace|fire|porch light|ceiling light|overhead|lights are on)\\b/, r:\"A proper light. Good. A porch should always have one.\"}\n ]},\n\nfeeling:{type:'choice',\n q:\"How are you feeling tonight?\",\n me:\"Feathery. Slightly haunted. Mostly hungry. Mostly for pie.\",\n why:\"Because how you feel changes what I should say. A sad person doesn't need a spooky story. A bored one does.\",\n dk:\"Hard to say? Those are my favorite feelings. They don't fit in any box.\",\n o:[\n {k:/\\b(not|isn'?t|aren'?t|ain'?t)\\s+(so |very |too |that |really |feeling |doing |the )?(good|great|well|okay|ok|fine|happy|best)\\b|\\bnot (the )?best\\b/, r:\"I'm sorry. Not a good night. You don't have to explain it to me. You can, though, if you want. I'm a patient bird. Or I can tell you a story, or a joke, or we can just sit.\", nc:true},\n {k:/\\b(sad|down|blue|depressed|lonely|alone|heartbroken|crying|cried|grieving|upset|hurting|hurt|miserable|empty|low|numb)\\b/, l:\"sad\", r:\"I'm sorry. That's a heavy one. You don't have to explain it, but you can. The porch is quiet, and I'm a very patient bird. If it's heavy enough that you can't carry it alone, please tell someone near you. Do you want a story, a joke, or just company?\", nc:true},\n {k:/\\b(stressed|stress|anxious|anxiety|nervous|worried|overwhelmed|panicking|on edge|tense)\\b/, l:\"stressed\", r:\"Stressed. That's a lot of weight to carry. Take one slow breath with me. In... and out. There. The porch isn't going anywhere, and neither am I. A joke might help, or a story.\", nc:true},\n {k:/\\b(sick|ill|unwell|nauseous|headache|migraine|in pain|flu|cold|fever)\\b/, l:\"sick\", r:\"I'm sorry you're not well. Rest, water, and something warm. A turkey knows nothing about medicine, but he knows a lot about soup.\", nc:true},\n {k:/\\b(angry|mad|furious|annoyed|irritated|frustrated|pissed|grumpy|cranky)\\b/, l:\"angry\", r:\"Mad. That's allowed. A porch is a good place to be mad. Nobody here will tell you to calm down. Gobble at it if you want. It helps, strangely.\"},\n {k:/\\b(tired|sleepy|exhausted|worn out|drained|beat|wiped|fatigued|burnt out|burned out)\\b/, l:\"tired\", r:\"Tired. Then take it slow. This is the right place for it. I won't ask for anything big.\"},\n {k:/\\b(bored|boring|nothing to do)\\b/, l:\"bored\", r:\"Bored! Then you came to the right porch. Say story, fact, joke, or poem, and I'll fix it.\"},\n {k:/\\b(hungry|starving|famished)\\b/, l:\"hungry\", r:\"Hungry! Wrong bird to complain to, but I do recommend pie. It's a fine answer to most things.\"},\n {k:/\\b(cold|freezing|chilly)\\b/, l:\"cold\", r:\"Cold. Get a blanket. A good one. And something warm to drink. I'll wait right here.\"},\n {k:/\\b(excited|pumped|thrilled|stoked|can'?t wait|cant wait)\\b/, l:\"excited\", r:\"Excited! I love that. It's contagious. Look, my feathers are standing up.\"},\n {k:/\\b(calm|relaxed|peaceful|chill|cozy|content|mellow|at peace|sleepy and happy)\\b/, l:\"calm\", r:\"Calm and cozy. The best way to feel in November. Keep it. I'm not going to say anything scary. Mostly.\"},\n {k:/\\b(great|amazing|awesome|fantastic|wonderful|excellent|good|happy|fine|well|alright|all right|ok|okay|not bad|decent|pretty good|so so|so-so|meh|alive|doing good)\\b/, l:\"good\", r:\"Good. That's all I ask of anybody. A fine, steady 'good' is worth more than a loud 'amazing'.\"}\n ],\n f:[\"Mm. I'll keep that in mind. Feelings are hard to name sometimes, and that's all right.\",\"I think I understand. I'm glad you told me.\"]},\n\npets:{type:'choice',\n q:\"Do you have any pets?\",\n me:\"I have a pet moth. He doesn't know it. He's very bad at being a pet, but he loves my porch light.\",\n why:\"Pets are the real owners of any house. I'd like to meet yours, in a manner of speaking.\",\n yes:\"A pet! What kind? A dog, a cat, something with feathers? I'm curious, and slightly worried.\",\n no:\"No pets? Then you have a porch turkey now. I'm low maintenance. I only need a little corn and a lot of attention.\",\n dk:\"Hm. Maybe you have a pet and don't realize it. Check under the bed.\",\n o:[\n {k:/\\b(dog|dogs|puppy|puppies|pup)\\b/, l:\"a dog\", s:[\"pet\",\"dog\"], r:\"A dog! A loyal friend, a tail with a body. Does he bark at me? Dogs know about turkeys. They always know.\"},\n {k:/\\b(cat|cats|kitten|kitty|kitties)\\b/, l:\"a cat\", s:[\"pet\",\"cat\"], r:\"A cat. Then you're not the owner. You're the staff. I respect your service.\"},\n {k:/\\b(fish|goldfish|betta|aquarium)\\b/, l:\"a fish\", s:[\"pet\",\"fish\"], r:\"A fish. Quiet, calm, and always looking at you with great wisdom. A fine companion.\"},\n {k:/\\b(bird|birds|parrot|parakeet|cockatiel|budgie|chicken|chickens|duck|ducks)\\b/, l:\"a bird\", s:[\"pet\",\"bird\"], r:\"A bird! A fellow feathered citizen. Please tell them I said gobble. They'll know what it means.\"},\n {k:/\\b(horse|horses|pony)\\b/, l:\"a horse\", s:[\"pet\",\"horse\"], r:\"A horse! A very big pet. Do you ride it, or does it just let you think you do?\"},\n {k:/\\b(hamster|rabbit|bunny|guinea pig|gerbil|mouse|mice|rat|ferret)\\b/, l:\"a small pet\", s:[\"pet\",\"small pet\"], r:\"A small and furry friend. Small pets have big personalities. They run the house, and you know it.\"},\n {k:/\\b(snake|lizard|gecko|turtle|tortoise|frog|reptile|bearded dragon|spider|tarantula)\\b/, l:\"a reptile\", s:[\"pet\",\"reptile\"], r:\"A scaly friend! Those are my favorite, because they never gossip. A brave pet, and a brave you.\"},\n {k:/\\b(both|dogs and cats|cats and dogs|lots|many|several|a bunch|zoo)\\b/, l:\"many\", s:[\"pet\",\"a house full\"], r:\"A whole house of animals! Then you're basically running a porch of your own. I'd like to apply for a job.\"}\n ]},\n\ncolor:{type:'choice',\n q:\"Which fall color is the best? Orange, red, gold, brown, or something else?\",\n me:\"Burnt orange. Very, very burnt orange. It's how I feel on the inside.\",\n why:\"Autumn has an entire paint set, and I'm curious which one is yours.\",\n dk:\"You can't pick? That's sensible. The leaves can't either.\",\n o:[\n {k:/\\b(orange|pumpkin colou?r|burnt orange)\\b/, l:\"orange\", r:\"Orange! Then you're the color of a pumpkin at sunset, and my favorite thing on the porch. A strong, warm choice.\"},\n {k:/\\b(red|crimson|scarlet|maroon|burgundy)\\b/, l:\"red\", r:\"Red. The color of maple leaves and cranberries. Bold, and a little dramatic. I love it.\"},\n {k:/\\b(gold|golden|yellow|amber|mustard)\\b/, l:\"gold\", r:\"Gold. The color of the last warm light of the day. A gentle, wise choice.\"},\n {k:/\\b(brown|tan|chestnut|chocolate|copper|bronze|rust)\\b/, l:\"brown\", r:\"Brown. The color of good soil, old books, and gravy. Dependable, and underrated. I salute you.\"},\n {k:/\\b(green)\\b/, l:\"green\", r:\"Green. In fall? You're holding on to summer. I won't take it away from you.\"},\n {k:/\\b(purple|violet|plum)\\b/, l:\"purple\", r:\"Purple. The color of Halloween nights and fancy cabbage. Surprising and perfect.\"},\n {k:/\\b(black)\\b/, l:\"black\", r:\"Black. The color of the night sky and a good coat. I understand you perfectly.\"},\n {k:/\\b(blue)\\b/, l:\"blue\", r:\"Blue. The clear autumn sky on a cold afternoon. It's the one color the leaves never copy. Beautiful.\"},\n {k:/\\b(white|silver|gray|grey)\\b/, l:\"white\", r:\"A pale one. Frost on the grass and breath in the air. That's the end of autumn, and the best part of it.\"},\n {k:/\\b(pink)\\b/, l:\"pink\", r:\"Pink! The color of a very early sunrise. It's a bold choice for November, and I love how much you don't care.\"},\n {k:/\\b(all|every|all of them|all of the colors|all of the colours)\\b/, l:\"all of them\", r:\"All of them. A person who sees the whole forest. Wise.\"}\n ],\n f:[\"{x}? A color I hadn't thought of for fall. I'll look for it in the leaves tomorrow.\",\"I'll look for that one in the leaves tomorrow.\"]},\n\nnumber:{type:'num',\n q:\"Quick. Pick a number between one and thirteen.\",\n me:\"Thirteen. I like to live on the edge of the porch.\",\n why:\"I'm going to tell you something about the number. It's a tiny fortune.\",\n dk:\"Can't choose a number? Then I'll pick one for you. Seven. It's lucky. Don't argue.\",\n nums:{\n  1:\"One. The loneliest number, and the most confident.\",\n  2:\"Two. Two eyes, two feet, two drumsticks. Very balanced. I approve.\",\n  3:\"Three. That's how many times I knock. Knock knock knock. ...Sorry. Reflex.\",\n  4:\"Four. The fourth Thursday in November is Thanksgiving. You chose the holiday without even knowing it.\",\n  5:\"Five. A handful of fingers. I have none. Good number, though.\",\n  6:\"Six. Six pies would be a reasonable amount for a table. I'd say go for seven.\",\n  7:\"Seven. Lucky seven. The favorite number of nearly everyone, including a few birds.\",\n  8:\"Eight. A spider has eight legs. I'd rather not discuss it any further.\",\n  9:\"Nine. A cat has nine lives. Use yours wisely.\",\n  10:\"Ten. A perfect score. Round, sensible, and easy to count on my wings.\",\n  11:\"Eleven. Two feathers standing side by side. Brave, and a little odd. I like it.\",\n  12:\"Twelve. A whole dozen. Twelve rolls, twelve pies, twelve cousins at the table. That's a Thanksgiving.\",\n  13:\"Thirteen. The unlucky one, and the very top of my range. You like living on the edge of the porch. So do I.\"\n },\n out:\"That's not between one and thirteen. A rule-breaker! I admire that. But I did say one to thirteen, so let me give you a point for courage and zero for the number.\",\n zero:\"Zero? The number of times I've been invited to a party. Not between one and thirteen, but I'll let it go.\",\n retry:\"I need an actual number between one and thirteen. Try again. It can't be that hard. I have faith in you.\"},\n\nsound:{type:'choice',\n q:\"What's the strangest sound you've ever heard at night?\",\n me:\"Once I heard my own thoughts escaping through my left ear. They were very noisy.\",\n why:\"The night is full of sounds nobody can explain. I'm collecting them.\",\n dk:\"No strange sound? You must sleep very well, or very deeply. I envy you.\",\n no:\"Nothing at all? Then you're a very sound sleeper, or the night is very polite to you. I'm jealous.\",\n o:[\n {k:/\\b(nothing|never|none|no sounds?|haven'?t|have not|don'?t think so)\\b/, r:\"Nothing at all? Then either you're a very sound sleeper, or the night is very polite to you. I'm jealous.\"},\n {k:/\\b(owl|owls|hoot|hooting)\\b/, l:\"an owl\", r:\"An owl. The oldest voice in the dark, and a very serious one. They ask 'who' because they truly don't know.\"},\n {k:/\\b(footsteps?|steps|walking|stairs|someone walking|pacing)\\b/, l:\"footsteps\", r:\"Footsteps. When nobody's there? Then it's the house, or the house's friend. I wouldn't check. Just pull up the blanket.\"},\n {k:/\\b(knock|knocking|knocks|tapping|tap|banging|bang|door)\\b/, l:\"knocking\", r:\"Knocking. I do that. ...Sorry, I'm usually the one who does it. Was it three knocks? That's me.\"},\n {k:/\\b(scratch|scratching|scratches|scraping|claws?)\\b/, l:\"scratching\", r:\"Scratching. Probably a squirrel, a raccoon, or a very small ghost with long nails. Statistically, the squirrel.\"},\n {k:/\\b(whisper|whispers|whispering|voice|voices|talking|someone talking|my name|humming|singing)\\b/, l:\"a voice\", r:\"A voice in the dark. I won't tell you what it was. I'll just say that if it's polite, you can be polite back.\"},\n {k:/\\b(scream|screams|screaming|shriek|yell|yelling|cry|crying)\\b/, l:\"a scream\", r:\"A scream. Hopefully a fox. Foxes scream at night, and it sounds exactly like a person. It's the best excuse in the woods.\"},\n {k:/\\b(fox|foxes|coyote|coyotes|wolf|wolves|howl|howling)\\b/, l:\"howling\", r:\"Howling. The coyotes calling to each other. Good music for a porch, and best heard from inside.\"},\n {k:/\\b(wind|breeze|storm|thunder|rain)\\b/, l:\"the wind\", r:\"The wind. It's the voice of the whole night, and it never says the same thing twice. Everyone hears something in it.\"},\n {k:/\\b(creak|creaking|creaks|settling|house|floorboards?|floor|pipes|groan|groaning|moaning)\\b/, l:\"the house\", r:\"The house itself. Old houses groan because they're stretching. That's the official explanation. I prefer the other one.\"},\n {k:/\\b(dog|dogs|barking|bark|cat|cats|meow|animal|animals)\\b/, l:\"animals\", r:\"Animals at night. They know things we don't. When the dog stares at a corner, don't look at the corner.\"},\n {k:/\\b(music|radio|tv|television|alarm|phone)\\b/, l:\"music\", r:\"Music out of nowhere. That's the best kind of strange, and the most worrying. I'd turn it up.\"},\n {k:/\\b(train|trains|siren|sirens|plane|planes|truck|trucks|cars?|traffic|motorcycle)\\b/, l:\"a machine\", r:\"A faraway train, or a siren. The sound of everyone else's night. It's almost comforting, if you don't think about it.\"},\n {k:/\\b(ghost|ghosts|spirit|spirits|haunted|haunting)\\b/, l:\"a ghost\", r:\"A ghost! Then you have a roommate. Be nice. They get lonely.\"}\n ],\n f:[\"{x}. A sound I haven't heard before, and I've heard a lot. Thank you for the nightmare. I mean the present.\",\"That's a good one. I'll listen for it tonight.\"]},\n\nrhythm:{type:'choice',\n q:\"Are you a morning person or a night owl?\",\n me:\"A night owl, obviously. I'm a turkey who stays up late. I can't help it. I'm a little nocturnal.\",\n why:\"Mornings and nights are two different worlds. I'd like to know which one you live in.\",\n dk:\"Neither? Both? That's the most honest answer. Most people are only a morning person with coffee.\",\n o:[\n {k:/\\b(both|neither|depends|in between|somewhere in between|a little of both)\\b/, r:\"A bit of both. A traveler between two worlds. Very mysterious.\"},\n {k:/\\b(night owl|night person|night|late|nocturnal|evening|owl|stay up|up late)\\b/, l:\"a night owl\", r:\"A night owl. Then you and I are going to get along well, because the best thoughts come after dark.\"},\n {k:/\\b(morning|early bird|early|sunrise|dawn|wake up early|up early)\\b/, l:\"a morning person\", r:\"A morning person. A strange and wonderful creature. You get up with the sun and you like it. I'm both frightened and impressed.\"}\n ]},\n\ncold:{type:'choice',\n q:\"What's your favorite thing to do on a cold night?\",\n me:\"Sit very still on the porch and stare at the moon until it blinks first. It never does. I'm still trying.\",\n why:\"Because the right cold-night plan is the secret to being happy in winter.\",\n dk:\"Hm. Maybe you haven't found it yet. Keep looking. It's out there, probably under a blanket.\",\n o:[\n {k:/\\b(word game|word games|word search|crossword|scrabble|scrablets|wordle|puzzle|puzzles|boggle|words with friends)\\b/, r:\"Word games! Then you're my kind of traveler. A sharp pencil, a warm window, and a good set of letters.\"},\n {k:/\\b(read|reading|book|books|novel|story|stories)\\b/, r:\"Reading. A warm lamp and a good book are the oldest magic there is. I hope it's a spooky one.\"},\n {k:/\\b(movie|movies|watch|watching|tv|show|shows|netflix|film|films|horror)\\b/, r:\"A movie or a show. A good one, with a blanket and a snack. That's a perfect cold night.\"},\n {k:/\\b(game|games|gaming|video game|video games|play|playing|xbox|playstation|nintendo|minecraft|cards|board game|board games)\\b/, r:\"Games. The cold is just an excuse to stay in and win something. A great answer.\"},\n {k:/\\b(sleep|sleeping|nap|napping|bed|rest|resting)\\b/, r:\"Sleep. The most underrated activity in the world. A wise choice, and a warm one.\"},\n {k:/\\b(cook|cooking|bake|baking|soup|food|eat|eating|cocoa|hot chocolate|tea|coffee|cider)\\b/, r:\"Something warm from the kitchen. Soup, cocoa, a pie in the oven. The house smells like a hug.\"},\n {k:/\\b(music|guitar|piano|keyboard|sing|singing|play music|listen to music|keys|record)\\b/, r:\"Music! Then your house is the warmest one on the street. Please play something low and slow.\"},\n {k:/\\b(blanket|blankets|cozy|cuddle|cuddling|snuggle|snuggling|fire|fireplace|bonfire)\\b/, r:\"A blanket. The oldest magic in the world. It has never once defeated a monster, but it's very comforting.\"},\n {k:/\\b(walk|walking|hike|hiking|drive|driving|outside|stargaz|stars)\\b/, r:\"A walk in the cold. Brave. The stars are sharper, and so is the air. Wear a hat.\"},\n {k:/\\b(talk|talking|friends|family|call|phone|hang out|hanging out|chat)\\b/, r:\"Time with people. That's the best fuel for a cold night. A good conversation warms you better than a heater.\"}\n ],\n f:[\"{x}. That sounds like a good way to spend a cold night. I'd join you, but I'd probably ruin the mood.\",\"That sounds like a good way to spend a cold night.\"]},\n\ntgpart:{type:'choice',\n q:\"What's your favorite part of Thanksgiving?\",\n me:\"The leftovers, three days later, cold, eaten standing in the fridge light. That's the real holiday.\",\n why:\"Everyone has one part that makes the whole day worth it.\",\n dk:\"All of it? Even the dishes? Then you're a rare soul.\",\n o:[\n {k:/\\b(leftovers?|sandwich|sandwiches|next day|day after)\\b/, r:\"The leftovers! The day-after sandwich is the real masterpiece. A very wise answer.\"},\n {k:/\\b(pie|pies|dessert|desserts)\\b/, r:\"The pie. Of course. Everything else is just the road to the pie.\"},\n {k:/\\b(food|eating|dinner|meal|feast|stuffing|potatoes|turkey|gravy|rolls|sides)\\b/, r:\"The food. Simple, honest, and delicious. That's what the day is built on.\"},\n {k:/\\b(football|game|games|nfl|lions|cowboys|chiefs)\\b/, r:\"Football. The sound of it in the next room, with someone yelling at it. That's the soundtrack of the whole day.\"},\n {k:/\\b(parade|macy'?s|floats?|balloons?|snoopy|dog show)\\b/, r:\"The parade! The big balloons floating above the street, and the dog show right after. A gentle morning tradition.\"},\n {k:/\\b(nap|napping|sleep|sleeping|couch|food coma)\\b/, r:\"The nap afterward. The couch at four in the afternoon, full and happy. That's the real finale.\"},\n {k:/\\b(family|together|everyone|people|relatives|seeing|visit|visiting|company|friends|friend)\\b/, r:\"Being together. The food is only the excuse. A heartfelt, true answer.\"},\n {k:/\\b(cook|cooking|baking|bake|preparing|kitchen|smell|smells)\\b/, r:\"The cooking. The smell of the house at noon. That smell is the memory most people keep forever.\"},\n {k:/\\b(thankful|thanks|gratitude|grateful|giving thanks)\\b/, r:\"The giving of thanks. The point of the whole thing. You win the holiday.\"},\n {k:/\\b(black friday|shopping|deals|sales)\\b/, r:\"The shopping the next day? The dark side of the holiday. I suppose even I should admit there are good deals.\"},\n {k:/\\b(decorat|decorations|table|setting the table|centerpiece)\\b/, r:\"The decorations. The table in its best clothes. A lovely thing to notice.\"}\n ],\n f:[\"{x}. A good one. That's the part I'd save, too.\",\"I like that. That's the part you'd put in a jar.\"]},\n\nscary:{type:'yn',\n q:\"Do you like scary stories?\",\n me:\"I love them. I'm a turkey who lives in a haunted porch. I'm in too deep to turn back.\",\n why:\"Because I know fourteen of them, and I'd hate to tell them to someone who hides under a blanket. Wait, that's the best audience.\",\n yes:\"Excellent. Then you'll enjoy my stories. You choose what happens, and nobody gets out the same way twice. Say story whenever you're ready.\",\n no:\"Then I'll keep mine gentle. Mostly. A scary story is only a cozy story with the lights off. Say story when you're ready.\",\n maybe:\"A little scary is the best kind. Not too much, just enough to make you check the window. I'll go easy.\",\n dk:\"You don't know? Then say story, and we'll find out together. I'll hold your hand. I don't have hands, but the intention is there.\"},\n\nfly:{type:'yn',\n q:\"Quick quiz. Can turkeys fly?\",\n me:\"A little. Wild ones can, in short bursts. I'm a velvet turkey, so mostly I just get flustered.\",\n why:\"It's a famous question. Everybody has an opinion, and almost everybody is half right.\",\n yes:\"Yes! With fine print. Wild turkeys can fly in short bursts, up to about 55 miles per hour. The heavy farm kind mostly can't. So you're right, and so is the other answer.\",\n no:\"Half right. The heavy farm turkeys can't really fly. But wild turkeys can, in short bursts, and they're fast about it. They can reach about 55 miles per hour, and they roost in trees at night.\",\n maybe:\"The right answer is 'it depends'. Wild turkeys can fly in short bursts, up to about 55 miles per hour. Farm turkeys are too heavy. It's a fair answer.\",\n dk:\"Now you know. Wild turkeys can fly in short bursts, up to about 55 miles per hour. The heavy farm kind mostly can't, and spend the day walking.\"},\n\nholiday:{type:'choice',\n q:\"What's your favorite holiday?\",\n me:\"Thanksgiving, obviously. But Halloween is a very close second. They're practically neighbors.\",\n why:\"Holidays are like pies. Everyone has one, and nobody can explain it.\",\n dk:\"You can't pick? That's reasonable. They're all a little bit magic.\",\n o:[\n {k:/\\b(halloween)\\b/, l:\"Halloween\", r:\"Halloween. It just ended and I'm already in mourning. We'll light a candle for it. A small one.\"},\n {k:/\\b(thanksgiving)\\b/, l:\"Thanksgiving\", r:\"Thanksgiving! Then we agree, and I'm both thrilled and nervous. You're the first person who didn't ask what I'm doing on the 26th.\"},\n {k:/\\b(christmas|xmas|hanukkah|kwanzaa|winter holidays?|yule)\\b/, l:\"Christmas\", r:\"The winter holidays. Lights in the dark, a very good idea. I'll be waiting for them, right after the pie.\"},\n {k:/\\b(easter|spring)\\b/, l:\"Easter\", r:\"Easter. A holiday of spring and hidden eggs. A turkey can only wish.\"},\n {k:/\\b(4th of july|fourth of july|july 4|july fourth|independence day|fireworks)\\b/, l:\"the Fourth of July\", r:\"The Fourth of July. Fireworks and barbecue. A turkey keeps a low profile on that day, though.\"},\n {k:/\\b(birthday|my birthday)\\b/, l:\"your birthday\", r:\"Your birthday. The one holiday that's about you. A great choice.\"},\n {k:/\\b(new year|new years|new year'?s)\\b/, l:\"New Year's\", r:\"New Year's. A fresh page, a loud midnight, and a promise to be better. I like the hope in it.\"},\n {k:/\\b(none|no favorite|don'?t have|don'?t like holidays|hate holidays)\\b/, r:\"None at all? Then every day is the same holiday for you. That's a kind of freedom.\"}\n ]},\n\nwyr:{type:'choice',\n q:\"Would you rather fight one turkey-sized duck, or a hundred duck-sized turkeys?\",\n me:\"The duck-sized turkeys. They're my people. I'd never fight them. I'd just invite them to dinner.\",\n why:\"It's the question that decides who you really are.\",\n dk:\"Can't decide? Then neither of us survives. That's reasonable.\",\n o:[\n {k:/\\b(neither|none|run|flee|flee|avoid|walk away|no way|nope)\\b/, r:\"Neither. You'd run. A smart, healthy instinct. I would run too, and I have the legs for it.\"},\n {k:/\\b(hundred|100|hundreds|many|small|tiny|little|duck sized|duck-sized|the turkeys|swarm)\\b/, l:\"the hundred small turkeys\", r:\"The hundred little turkeys! Brave. Or foolish. They'd be adorable, and you'd lose, but you'd lose with feathers on your face.\"},\n {k:/\\b(one|big|large|giant|huge|turkey sized|turkey-sized|the duck|a duck|the big one)\\b/, l:\"the big duck\", r:\"The one big duck. The classic duel, one on one. A noble choice. Take a sandwich, because it'll be a long fight.\"}\n ]},\n\npieb:{type:'yn',\n q:\"Is pie for breakfast acceptable?\",\n me:\"It's not just acceptable. It's the correct answer. Eggs are for people who aren't brave.\",\n why:\"I've been arguing about it with the raccoon for years.\",\n yes:\"Correct. Pie for breakfast is fruit, eggs, and happiness. I'd even call it a balanced meal.\",\n no:\"No? Not even leftover pie, cold, from the fridge, at seven in the morning? You'll change your mind. They all do.\",\n maybe:\"Only on holidays. That's a diplomatic answer. I accept it, with a small bow.\",\n dk:\"Try it once, and then you'll know.\"},\n\ntable:{type:'choice',\n q:\"Is your Thanksgiving table usually big and loud, or small and quiet?\",\n me:\"Small and quiet. One plate. One hedge. Very peaceful. But I wouldn't mind a bigger one.\",\n why:\"The size of a table says a lot about a family, and nothing at all about its love.\",\n dk:\"It changes every year? That's very true. Tables grow and shrink like the moon.\",\n o:[\n {k:/\\b(big|huge|large|loud|lots|crowded|packed|full|chaotic|crazy|wild|many|noisy)\\b/, l:\"big\", r:\"Big and loud! Then there are at least three conversations at once, and everyone is a little bit wrong. That's a perfect Thanksgiving.\"},\n {k:/\\b(small|tiny|quiet|little|few|just a few|intimate|calm|peaceful|just us|just the two of us)\\b/, l:\"small\", r:\"Small and quiet. A table with everyone you want, and nobody you have to impress. That's a great way to eat.\"},\n {k:/\\b(medium|middle|in between|average|normal|moderate)\\b/, l:\"medium\", r:\"Medium. Enough for a good conversation, and not too many to hear. A perfect Goldilocks table.\"}\n ]},\n\nmusic:{type:'choice',\n q:\"What kind of music do you like on a quiet night?\",\n me:\"Slow and crackly. The kind that sounds like an old record in a cabin. You can hear it now. That's the music I chose.\",\n why:\"The right song makes any porch feel like the right porch.\",\n dk:\"Everything? Nothing? A little of the radio? Fair. The mood decides.\",\n o:[\n {k:/\\b(lo fi|lofi|lo-fi|chill|ambient|instrumental|piano|soft)\\b/, l:\"lo-fi\", r:\"Lo-fi. The sound of a rainy window. I have that going right now, and it was made just for you.\"},\n {k:/\\b(country|bluegrass|folk|americana|banjo)\\b/, l:\"country\", r:\"Country. Honest songs about trucks, dogs, and heartbreak. I'd play that on the porch all day.\"},\n {k:/\\b(rock|metal|punk|grunge|alternative|hard rock|classic rock|heavy)\\b/, l:\"rock\", r:\"Rock! Loud guitars on a cold night. I'd tap a foot, but I only have drumsticks.\"},\n {k:/\\b(jazz|blues|soul|r&b|rnb|motown)\\b/, l:\"jazz\", r:\"Jazz, blues, soul. Smoky, slow, and honest. Perfect for a cold porch and a low light.\"},\n {k:/\\b(classical|orchestra|opera|symphony|violin|cello|baroque)\\b/, l:\"classical\", r:\"Classical. Old, grand, and patient. You like music that's older than everyone's grandparents. Excellent.\"},\n {k:/\\b(pop|dance|edm|electronic|techno|house)\\b/, l:\"pop\", r:\"Pop! Bright, catchy, and a little silly. A good mood on a cold night.\"},\n {k:/\\b(hip hop|hip-hop|rap|trap)\\b/, l:\"hip hop\", r:\"Hip hop. Words, rhythm, and swagger. A very good porch sound, and a very serious one.\"},\n {k:/\\b(gospel|hymn|hymns|worship|christian|church)\\b/, l:\"gospel\", r:\"Gospel and hymns. Music that has held people up for centuries. A beautiful thing to listen to on a quiet night.\"},\n {k:/\\b(spooky|halloween|creepy|horror|soundtrack|film score|movie score)\\b/, l:\"spooky\", r:\"Spooky music. A creaking organ and a distant bell. It's only November. We're allowed to keep it a little longer.\"},\n {k:/\\b(nothing|silence|quiet|no music)\\b/, l:\"silence\", r:\"Silence. The best music, and the most expensive. I admire it.\"}\n ],\n f:[\"{x}. I don't have that on my porch yet, but I'll hum it later. Off-key.\",\"I'll hum it later. Off-key. It'll be a tribute.\"]},\n\nlookahead:{type:'choice',\n q:\"What are you looking forward to this month?\",\n me:\"The 26th, obviously. Also, no one has chased me yet. Fingers crossed. I have no fingers.\",\n why:\"A month is long. I'd like to know what's waiting at the end of yours.\",\n dk:\"Nothing planned? Sometimes the best months are the ones that surprise you.\",\n no:\"Nothing in particular. That's all right. A quiet month is exactly what some people need. Maybe it will surprise you.\",\n o:[\n {k:/\\b(nothing|not much|nothing really|not really anything)\\b/, r:\"Nothing in particular. That's all right. Sometimes a quiet month is exactly what a person needs. Maybe it'll surprise you.\"},\n {k:/\\b(thanksgiving|turkey day|dinner|pie|feast)\\b/, r:\"Thanksgiving! Then we're looking forward to the same thing. Only I'm looking forward to it from the other side of the table.\"},\n {k:/\\b(birthday|my birthday|anniversary|wedding)\\b/, r:\"A birthday or an anniversary. A little celebration in the middle of a gray month. I hope there's cake.\"},\n {k:/\\b(christmas|xmas|december|winter|snow|decorations|holidays)\\b/, r:\"The winter holidays. Getting ready early. I admire the planning. You already have the lights in mind, I'll bet.\"},\n {k:/\\b(trip|travel|vacation|visit|visiting|flight|flying|road trip|going to|seeing)\\b/, r:\"A trip or a visit! Going somewhere is half the fun. Pack warm, and take a pie for the road.\"},\n {k:/\\b(break|rest|off|day off|time off|sleep|relax|relaxing|quiet)\\b/, r:\"Rest. You earned it. The most honest thing to look forward to, and the most overlooked.\"},\n {k:/\\b(football|game|games|season|playoffs)\\b/, r:\"The games. A cold evening, a loud living room, and somebody yelling at a screen. Good, honest fun.\"},\n {k:/\\b(family|friends|seeing everyone|people|reunion|company|guests)\\b/, r:\"Seeing people. The best reason there is. I hope everyone shows up, and nobody brings the wrong pie.\"}\n ],\n f:[\"{x}. That's a good thing to have waiting. I'll keep a feather crossed for you.\",\"That sounds like a good thing to have waiting for you.\"]},\n\nmemory:{type:'free',\n q:\"Tell me a favorite fall memory. Just a short one.\",\n me:\"The first night I stood on this porch. The moon was low, the air was cold, and the hedge said nothing. It was perfect.\",\n why:\"A memory is the most honest kind of story. I collect them in jars.\",\n dk:\"No memory comes to mind? That's fine. You can make one tonight. I'll help.\",\n f:[\"Mm. I can picture it. Thank you for putting it on my porch. I'll keep it in a jar, next to the moths.\",\"Thank you for sharing that. I'll keep it in a jar, next to the moths.\"]},\n\ncozy:{type:'choice',\n q:\"Spooky or cozy? Which do you want more of right now?\",\n me:\"Cozy, mostly. With a little spooky on the side, like gravy.\",\n why:\"Because I tune the whole evening to your answer. Spooky, cozy, or both.\",\n dk:\"Both, then. A cozy blanket and a spooky sound. That's the best of November.\",\n o:[\n {k:/\\b(both|a little of both|mix|bit of both|half and half)\\b/, r:\"Both. A cozy spook, or a spooky cozy. That's exactly what November is. Perfect.\"},\n {k:/\\b(spooky|scary|creepy|spook|haunted|horror)\\b/, l:\"spooky\", r:\"Spooky! Then dim the light and pull up your chair. Say story, and I'll make the hedges move.\"},\n {k:/\\b(cozy|cosy|warm|calm|gentle|peaceful|comfy|comfortable|snug|relaxing|soft)\\b/, l:\"cozy\", r:\"Cozy! A blanket, a warm drink, and a gentle voice. I can do that. I'll only whisper a little.\"}\n ]},\n\ncandy:{type:'choice',\n q:\"Settle this once and for all. What's the best Halloween candy?\",\n me:\"Candy corn. Yes. I said it. I know. It looks like a tiny turkey beak.\",\n why:\"It's the most argued-about question of the whole season.\",\n dk:\"Everything? Then you're a person of peace. I'd take you to dinner.\",\n o:[\n {k:/\\b(reese'?s?|peanut butter cups?|peanut butter)\\b/, l:\"Reese's\", r:\"Reese's. Peanut butter and chocolate. The most popular answer, and no one ever argues with it.\"},\n {k:/\\b(snickers)\\b/, l:\"Snickers\", r:\"Snickers. A candy bar that has opinions about hunger. A solid, filling answer.\"},\n {k:/\\b(kit ?kat)\\b/, l:\"Kit Kat\", r:\"Kit Kat. Crunchy, delicate, and perfectly snappable. Give me a break. ...That was the joke.\"},\n {k:/\\b(twix)\\b/, l:\"Twix\", r:\"Twix. Left or right? Two bars, and a great debate. Respectable.\"},\n {k:/\\b(m ?& ?m'?s?|m and m'?s?|mnms?)\\b/, l:\"M&M's\", r:\"M&M's. Little candy buttons in every color. Easy to share, and easy to lose in a couch.\"},\n {k:/\\b(skittles)\\b/, l:\"Skittles\", r:\"Skittles. Taste the rainbow. A fruity, loud answer. I like loud answers.\"},\n {k:/\\b(starburst)\\b/, l:\"Starburst\", r:\"Starburst. They're chewy, and a bit of a workout. A candy for the brave.\"},\n {k:/\\b(candy corn)\\b/, l:\"candy corn\", r:\"Candy corn! You've just answered the most controversial question in the world. I'm shaking. ...With respect. And joy.\"},\n {k:/\\b(milky way|3 musketeers|three musketeers|butterfinger|baby ruth|almond joy|mounds|hershey|hershey'?s|payday|100 grand|nerds|smarties|sour patch|warheads|jolly rancher|tootsie|dum dums?|laffy taffy|swedish fish|gummy|gummies|gummy bears?|lollipops?|sweet tarts)\\b/, l:\"that\", r:\"That's a very respectable candy. I see you take the whole bag seriously.\"},\n {k:/\\b(chocolate)\\b/, l:\"chocolate\", r:\"Chocolate. Simple, honest, and universal. Never wrong.\"},\n {k:/\\b(none|no candy|don'?t like candy|hate candy|i don'?t eat candy)\\b/, r:\"None at all? A person of iron will. I'll keep my own candy, if that's all right.\"}\n ],\n f:[\"{x}. I don't know that one, but it sounds like trouble in a wrapper. I like it.\",\"I'll put that on the list of arguments I'm going to start at the next dinner.\"]},\n\ntname:{type:'free',\n q:\"If you were a turkey, what would you name yourself?\",\n me:\"Sir Gobbles-a-Lot. It's very dignified. I'm told there's a hat that goes with it.\",\n why:\"Every turkey deserves a name. Mine was given to me by a hedge.\",\n dk:\"No name yet? Take your time. A good name finds you.\",\n f:[\"{x}. A noble name for a bird. I'll announce you at the next dinner: 'Sir {x}, of the Porch.'\",\"A fine name. I'll announce you at the next dinner.\"]}\n\n};\n\n/* shuffled each visit. name and costume always come first */\nvar QFIRST=['name','costume'];\nvar QPOOL=['tgwhere','pie','sides','eatturkey','thankful','light','feeling','pets','color','number','sound','rhythm','cold','tgpart','scary','fly','holiday','wyr','pieb','table','music','lookahead','memory','cozy','candy','tname'];\n\n\nvar HELP = \"Here's what I do. Talk to me, and I'll ask you questions, one at a time, and answer you back. You can ask me things too: my name, my favorite pie, what day it is, when Thanksgiving is, or a little math. Say: story, fact, joke, poem, coloring, or list. Say story 3 or a name like mirror or lantern. Say 'ask me' for a question, 'skip' to skip one, 'what do you know about me' to see what I remember, or 'forget me' to wipe it. Tap the \ud83c\udfa4 to talk out loud.\";\n\nvar POEM_INTRO = \"Very well. Here is Lenore, by Edgar Allan Poe.\\n\\n\";\nvar POEM = `Ah, broken is the golden bowl! the spirit flown forever!\nLet the bell toll!\u2014a saintly soul floats on the Stygian river;\nAnd, Guy De Vere, hast thou no tear?\u2014weep now or nevermore!\nSee! on yon drear and rigid bier low lies thy love, Lenore!\n\nCome! let the burial rite be read\u2014the funeral song be sung!\u2014\nAn anthem for the queenliest dead that ever died so young\u2014\nA dirge for her the doubly dead in that she died so young.\n\n\"Wretches! ye loved her for her wealth and hated her for her pride,\nAnd when she fell in feeble health, ye blessed her\u2014that she died!\nHow shall the ritual, then, be read?\u2014the requiem how be sung\nBy you\u2014by yours, the evil eye,\u2014by yours, the slanderous tongue\nThat did to death the innocence that died, and died so young?\"\n\nPeccavimus; but rave not thus! and let a Sabbath song\nGo up to God so solemnly the dead may feel no wrong!\nThe sweet Lenore hath \"gone before,\" with Hope, that flew beside,\nLeaving thee wild for the dear child that should have been thy bride\u2014\nFor her, the fair and debonair, that now so lowly lies,\nThe life upon her yellow hair but not within her eyes\u2014\nThe life still there, upon her hair\u2014the death upon her eyes.\n\n\"Avaunt! avaunt! from fiends below, the indignant ghost is riven\u2014\nFrom Hell unto a high estate far up within the Heaven\u2014\nFrom grief and groan, to a golden throne, beside the King of Heaven:\nLet no bell toll, then,\u2014lest her soul, amid its hallowed mirth,\nShould catch the note, as it doth float up from the damn\u00e8d Earth!\nAnd I!\u2014to-night my heart is light!\u2014no dirge will I upraise,\nBut waft the angel on her flight with a P\u00e6an of old days!\"`;\n\n/* ---------- VOICE ---------- */\nvar voiceOn = true, musicOn = true, ttsVoice = null;\nvar synth = window.speechSynthesis;\nfunction pickVoice(){\n  if(!synth) return;\n  var v = synth.getVoices(), best = null, i;\n  for(i=0;i\u003cv.length;i++){ if(/^en/i.test(v[i].lang) && /(daniel|alex|fred|david|male|mark|guy|google uk english male)/i.test(v[i].name)){best=v[i];break;} }\n  if(!best){ for(i=0;i\u003cv.length;i++){ if(/^en/i.test(v[i].lang)){best=v[i];break;} } }\n  ttsVoice = best;\n}\nif(synth){ pickVoice(); synth.onvoiceschanged = pickVoice; }\n/* tracks everything the page says out loud so the mic never listens to it */\nvar talkPending=0, quietUntil=0, spokenLog=\"\", spokenAt=0, lastPendingChange=0;\nfunction trackUtt(u,text){\n  talkPending++; lastPendingChange=Date.now();\n  if(Date.now()-spokenAt>30000) spokenLog=\"\";\n  spokenLog+=\" \"+(text||\"\").toLowerCase(); spokenAt=Date.now();\n  var done=function(){ talkPending=Math.max(0,talkPending-1); lastPendingChange=Date.now(); quietUntil=Date.now()+1400; if(talkPending===0) growlOn(false); };\n  u.onstart=function(){ growlOn(true); }; u.onend=done; u.onerror=do  losing count.\";\n}\nvar INTENTS=[\n {k:/^(hi|hello|hey|hiya|howdy|yo|sup|greetings|hello there|hey there|hi there|good (morning|afternoon|evening)|gobble|gobble gobble)\\b/, r:function(t){\n    var h=new Date().getHours(), g=/good morning/.test(t)?\"Good morning\":(/good afternoon/.test(t)?\"Good afternoon\":(/good evening/.test(t)?\"Good evening\":pick([\"Hello\",\"Hello there\",\"Well, hello\"])));\n    if(/good (morning|afternoon|evening)/.test(t) && h>=18 && /morning/.test(t)) return g+\"? It's the evening, but I'll take it. Who am I to argue with a gentle wish.\";\n    return g+nm()+\". Gobble gobble. Good to see you on the porch.\"; }, ch:.8},\n {k:/\\b(how are you|how r u|how are u|how'?s it going|how you doing|how are you doing|how do you feel|are you ok|are you okay|how have you been|you good\\b)/, r:function(){ pendingQ=QB.feeling; QB.feeling._tries=0; QB.feeling._re=false; return pick([\"Feathery. Slightly haunted. Mostly hungry for pie. Thank you for asking. Not many do.\",\"Pretty good, for a velvet turkey on a screen. My feathers are fluffed and the porch light is on.\"])+\" And you? \"+qText(QB.feeling); }, ch:0},\n {k:/\\bwhat'?s up\\b|\\bwassup\\b|\\bwhat are you (doing|up to)\\b|\\bwhat have you been (doing|up to)\\b/, r:function(){ return \"Guarding the porch, counting my feathers, and waiting for someone to talk to. Then you showed up. That's my whole evening.\"; }, ch:.8},\n {k:/\\b(what'?s|what is|whats) your name\\b|\\bwho are you\\b|\\bwhat should i call you\\b|\\bwhat do i call you\\b|\\bwho is this\\b/, r:function(){ return \"I'm the Turkey. I stand on this porch every November. And, between us, I'm really the Pumpkin Man, wearing a turkey costume for Thanksgiving. Don't tell the other porch. They'd never let me live it down.\"; }, ch:.7},\n {k:/\\bare you (a |an )?(real|alive|human|person|robot|bot|computer|program|ai|artificial|machine|chatbot|actually a turkey|a real turkey)\\b|\\bare you (really )?(a )?(turkey|pumpkin man)\\b|\\bis th he dog sits under the table in a state of perfect, unbothered prosperity.\\n\\nAround four, the light goes gold and slanted, the way it only does in November, and falls across forty mismatched plates. You look around and realize that every single person here was, at some point this year, a little lost. And every one of them found the table anyway.\\n\\nThere is exactly one seat left. It has your name on it, written in gravy, which is the most sincere ink there is.\\n\\nYou sit. The rolls come back around. Somewhere, a turkey in overalls weeps quietly into a napkin and says it's the steam.`}}});\nfunction tgd(){return thanksgiving(new Date().getFullYear()).getDate();}\nfunction dayN(){var m=/[?&]day=(\\d+)/.exec(location.search);if(m)return +m[1];var n=new Date();return n.getMonth()===10?n.getDate():(n.getMonth()>10?99:1);}\nfunction unl(){var d=dayN();return d>=tgd()?STORIES.length:Math.min(N0,d);}\nstartStory=function(i){if(i\u003c0||i>=STORIES.length)return say(\"I don't have that one. I have \"+STORIES.length+\", and I keep them in a drawer.\");\n if(i>=unl())return say(\"Story \"+(i+1)+\" isn't out of the oven yet. Pumpkin Man releases one a day, so you have to come back tomorrow. That's the whole trick of a porch. Today you can have stories 1 through \"+unl()+\".\");pendingQ=null;showNode(i,\"\");};\nrandomStory=function(){var p=[],c=unl(),i;for(i=0;i\u003cc;i++)if(!seen[i])p.push(i);if(!p.length){seen={};for(i=0;i\u003cc;i++)p.push(i);}startStory(p[Math.floor(Math.random()*p.length)]);};\nstoryNum=function(t,b){var m=t.match(/\\b(?:story|tale|number|no\\.?|#)\\s*(\\d{1,2})\\b/)||t.match(/\\b(?:tell me|read me|give me|play)\\s+(?:story |tale |number |#)?(\\d{1,2})\\b/)||(b&&nwords(t)\u003c=1?t.match(/^(\\d{1,2})$/):null);return m?parseInt(m[1],10):null;};\nvar _ci=cmdIntent;cmdIntent=function(t){var r=_ci(t);return(r==='poem'||r==='grid'||r==='color')?'':r;};\nvar _rc=runCmd;runCmd=function(c,t){if(c==='list'){var u=unl(),l=[];for(var j=0;j\u003cSTORIES.length; ne spearheads, first identified near Clovis, New Mexico. That's the original knife block.\",\n\"Picture an elephant crossing the highway in Ohio. A traffic jam would form at once, and then everyone would film it. Elephants once lived here in a way. Mammoths were wandering the continent. Some scientists argue about rewilding big animals. Dolphins and gorillas, having watched us closely for generations, would form opinions about our cell phones.\",\n\"G\u00f6bekli Tepe in Turkey is about 11,500 years old. People built giant carved stone pillars there before farming existed. It forced everyone to rethink the order of things. Turns out you can build a temple before you invent bread. Priorities.\",\n\"Corn started as teosinte, a scraggly grass in Mexico, and Indigenous farmers bred it into maize over thousands of years, around 9,000 years ago. They also invented nixtamalization, soaking corn in lime so you actually get the nutrients. That's the real genius move. We just pop it and watch movies.\",\n\"Columbus never reached India and never knew where he'd landed. He called the people 'Indios', and the name stuck. The people he met were Ta\u00edno, among hundreds of distinct nations. Also, people had been living here for 15,000 years or more, so 'discovered' is a generous word for 'arrived late and lost'.\",\n\"Pocahontas's name was Matoaka. She was roughly 10 when the English arrived, and the Disney version aged her up considerably. She was kidnapped in 1613, held for ransom, baptized as Rebecca, and married John Rolfe. She died in 1617 in England at about 20 or 21. The cause is unknown. The colors of the wind did not help her.\");\nJOKES.push(\"The turkey said he'd never been so glad: no semi container, no box, no ten thousand roommates. Just a porch, a pumpkin head, and a very reasonable amount of drywall.\",\"I watched too many TikToks. My eyes bled a little. My brain melted a little. It was fine. It was already mostly straw.\",\"I'm trying to meet the actual Easter Bunny. I have one question: how do you lay the eggs for the Cadbury commercials? He says it's a family secret. It is not a family secret. It's a chicken.\");\nvar AFF=[\"You have survived every hard day you've had so far. That's a perfect record, and Pumpkin Man is very proud of it.\",\"You've been through tough stuff before and gotten through it. This time is not different. Hard, yes. Different, no.\",\"You don't have to feel festive. You only have to stay. Staying is a perfectly good holiday activity.\",\"There are things coming that you haven't met yet: a song, a meal, a weird little afternoon. Stay for those.\",\"You are allowed to be a work in progress. The turkey has been under construction since Halloween.\",\"Somebody out there is glad you exist, even if they haven't said it this month. I'm glad, and I'm a pumpkin.\"];\nvar IDLE=[\"...Pumpkin Man is not really a turkey. Pumpkin Man is a pumpkin in a turkey outfit, trying to keep the Halloween spirit from dying. It's going fine. Don't look at the feathers.\",\"Pumpkin Man has been thinking. If Pumpkin Man is wearing a turkey costume, who is Pumpkin Man when the costume comes off? ...A pumpkin. It's always a pumpkin. Moving on.\",\"*mutters* ...might get a jump start on the Christmas costume shopping. Reindeer ears. Maybe a sleigh bell. Very festive. Very reasonable.\",\"Somewhere, the actual Easter Bunny is laying eggs for the Cadbury commercials. Pumpkin Man has questions. Pumpkin Man has always had questions. How does he do it?\",\"I watched too many TikToks today. My eyes are bleeding a little. My brain is a puddle. It's a very warm puddle, though.\",\"Let it be known that this turkey is thrilled to not be stuffed into a shipping container with ten thousand other turkeys. Porch. Pillow. Excellent. Five stars.\",\"*mutters* If an elephant crossed the highway, would we pull over? ...We would pull over. We'd all pull over and film it.\",\"Is anybody out there? It's alright. Pumpkin Man is just talking to the dr
