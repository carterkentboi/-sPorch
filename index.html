<script>
/* =====================================================
   STORIES: choose-your-own-adventure.
   Node ids: "" (start) -> "a"/"b" -> "aa","ab","ba","bb" (endings)
   A node with A/B is a choice. A node with only x is an ending.

var STORIES = [

{t:"The Word Search", k:["columbus","word","wordsearch","search","elementary","school","nostalgia","rudolph","reindeer","gobble","indian","cornucopia","maize","hominy","bloodline","alive","sacred","unite","pilgrim","pylgrim","tobacco","colony","freedom","united","jesus","truth","church","temple"], n:{
"":{x:`The teacher hands out a word search, and it is the best part of your whole week. The windows in that old classroom are tall and wide open, and a cool breeze comes through all of them at once, smelling like cut grass and pencil shavings and the very start of fall.

You are nine. Somewhere outside a mower hums and the playground is full of happy noise. In your hand is a fat yellow pencil, perfectly sharp.

The page is about Columbus, and you know now that there was more to that story than a worksheet could ever say. You're sorry for that part, truly. But this memory isn't about him. It's about the breeze, and the circles, and the feeling of being exactly where you belong.

All that's left is to start.`,
A:`Circle the words with your whole hand, one by one`,B:`Flip the page over and draw Rudolph first`},
a:{x:`You find SAIL first, running sideways, and you swing your pencil around it in a big, loopy circle with your whole arm. Then OCEAN. Then SHIP, hiding backward in the corner. Then COLUMBUS, stretched across the whole middle of the page, and right beside it, tucked in sideways, GOBBLE, which makes you giggle out loud.

Then two more, INDIAN and EAST INDIAN. They were on the list because Columbus believed he had reached the Indies, a mix-up that gave the people who really lived there a name that was never theirs. You circle them carefully, and you are quietly sorry about that, and you keep going.

Then a whole harvest comes tumbling down the right-hand side: CORNUCOPIA, the overflowing basket of the autumn table, and MAIZE and HOMINY, foods the peoples of this land grew and cooked long before any ship arrived. You circle each one slowly, like you are saying thank you with your pencil.

And last, small and slanted through the middle of the page, BLOODLINE, which makes you think of everyone who came before you and handed down the knack of sitting by an open window with a pencil and being happy.

Three more words wait along the bottom edge, in a row, as if the page saved them for last: ALIVE, SACRED, and UNITE. You circle those last and slowest, and for a second the whole room feels exactly like those words.

And three last ones, hiding in the corners: MINE, EARTH, and FIRE. You circle MINE with a little grin, because for this one afternoon, the window, the breeze, and the pencil all feel like yours. EARTH and FIRE you circle gently, the way you would warm your hands.

Then, in a soft little cluster near the middle, the last three: SAFE, SANCTUARY, and SHARING. You realize that is exactly what this room is. A safe place, a sanctuary, where you share your crayons and your giggles and your best ideas. You circle them with the biggest, roundest loops of the whole page.

One more is walking slowly along the very bottom edge, all by itself: PILGRIM. You circle it last, a little wobbly, like someone who has traveled a long way to sit in this exact seat by this exact window.

Then the page gets a little more grown-up, with seven more words scattered through the grid: TOBACCO, VOLUME, COLONY, VIRUS, FREEDOM, FOUGHT, and the tiny, easy-to-miss FOR. You circle COLONY and TOBACCO slowly, because you are starting to understand how big the story behind this page really was. You circle VIRUS quietly, for all the sicknesses the ships carried that hurt people who had never met them. You find VOLUME right where it belongs, a whole book of it. And you circle FOUGHT, FOR, FREEDOM in a row, all three, one after another, like the sentence the page had been trying to say all along.

Two last words sit side by side at the very bottom: UNITED, and the tiny word IT, which you almost miss. You circle them both. And right at the start of the very first row, where it belongs, you finally spot FRONT. Then you go back and draw a second circle around SAFE, because it was worth it.

Then the page turns tender, and a few of the words feel bigger than the others: TRUTH, GOD, CHURCH, and TEMPLE, standing together like a little neighborhood. You circle each one with care.

And then you start finding JESUS. He is hiding everywhere, in the corners, down the margins, upside down, backward, slanting across the middle. You count out loud as you circle. Ten. Twenty. Thirty. Thirty-one. Thirty-two. All thirty-two, every single one found.

Next come HEAD and EARS, tucked close together, which makes you smile, because the teacher is always telling the class to use both when you listen. And finally, stretched all the way across the very bottom row in one long unbroken line, the biggest word of all: THEWORDSEARCHISMINE.

You circle the whole line in one sweep, edge to edge. The word search is mine.

Then the page gets playful, like a puzzle board with all the spaces squeezed out on purpose: EYES, SPEAK, MOUTH, then ALTOGETHER, a tiny TOO, and one long proud line that reads ASINONEWHOLEWORDONPURPOSE, because that is the whole game. PUZZLE and PIECES lie side by side. HEARTSKEEPBEATING runs down the page in one long column, and you circle it with your free hand over your own chest, feeling it. Near it sit ONEWORD, AND, BOTH, and right beside BOTH, spelled exactly the way you like it, BOLTH. You circle those too.

Then come the names, the ones that matter most: TIGER, GARRETTE, and ORION, each circled slowly, like waving hello to someone you love. And LOIS, hiding all over the page, thirty-seven times, in every direction. You count them out loud as you go, one for each, all the way up to thirty-seven, and not one of them gets away.

And in the exact center of the page, one time only, in big capital letters, sits a single name: CLARK. You do not have to hunt for that one. You circle it last, slowly, because the middle of the page is where it was always waiting.

Last of all, down in the margin, in your best neat handwriting, two small words that feel like a promise: PEACE and GRIT. And underneath them, a line the teacher wrote on the board once, which you have never forgotten: Cheating is always very wrong. God is never wrong.

Every circle makes that soft scratching sound, like a cricket in a notebook, and the breeze lifts your hair every time you finish one.

Nobody is rushing you. The clock ticks. The teacher hums at her desk. And then, in the last corner, a word that wasn't on the list at all, running diagonally from one side to the other: GRATEFUL.

You finish before almost everyone. The teacher stops at your desk, looks at your page full of perfect circles, and smiles. "Wonderful," she says. "Now you may draw on the back, if you like."`,
A:`Draw Rudolph`,B:`Draw every rabbit you ever imagined seeing`},
b:{x:`You flip the paper over because you've been waiting all morning for this. The back is a wide white field of possibility.

You draw the antlers first, big and proud and branching. Then the long graceful legs, the fur, the kind brown eye. You draw with your tongue stuck out the way you do when you're concentrating. The breeze comes through the windows and flutters the corner of the page, as if the whole room is holding its breath to see what you'll do.

This isn't a doodle. This is a reindeer. A real one. It might be the single best reindeer anyone has ever drawn.`,
A:`Press hard with the red crayon and give him a glowing nose`,B:`Carry it up to the teacher's desk`},
aa:{x:`You draw Rudolph with antlers like a little forest and eyes that look straight at you. You find the red crayon and press down hard, round and round, until his nose glows right off the page.

You hold it up to the window, and the light shines through the paper, and it's perfect.

The teacher comes over. She looks at it for a long moment. Then she says, quietly, so that only you can hear, "This is the best reindeer I have ever seen." She gives you your honor, right there in front of the class, a gold star and a handshake, and she takes your drawing to the door and tapes it up in the very center.

It is the only one she hangs. All day long you walk past it. You are so, so proud. And when the bell rings, you run all the way home, because your dogs are waiting at the door, tails going, and you tell them everything.`},
ab:{x:`You draw a rabbit. Then another. Then, because you can't stop, a whole field of them. Every rabbit you ever imagined seeing in the grass at dusk, in the garden, under the porch, one wearing a tiny hat, one asleep in a teacup, one that's probably a cloud.

You fill the entire page. The teacher stops by and starts laughing, a big warm laugh, and the kids around you lean over to look, and suddenly the whole row is drawing rabbits too.

At the end of the day she tapes your page up on the classroom door, and when you get home your dogs jump up to greet you, and you show them the rabbits with great ceremony. They're very impressed. They have always believed in you.

Happy November the 1st. Halloween was awesome.`},
ba:{x:`You press down so hard with the red crayon that the page glows through to the front. Rudolph's nose is round and bright and wonderful, and he is looking at you like he knows he's the best.

Kids drift over to peek. Someone whispers, "How did you do that?" You shrug, because you don't know. Your hand just knew.

When the teacher sees it she puts her hand on her heart. She gives you your honor and hangs the drawing in the very center of the classroom door. It's the only one up there. You spend the rest of the day sneaking looks at it through the doorway, trying to look like you aren't.

At home your dogs are waiting. You tell them about Rudolph. They wag as if they were there.`},
bb:{x:`You carry it up to her desk with both hands, like it might spill. The teacher takes it, looks at it for a very long time, and then looks up at you, and her eyes are shining.

"Do you know," she says, "that this is the best reindeer anyone has ever drawn?" You say yes, because it is. She laughs and gives you your honor, and hangs the drawing on the classroom door, where it is the only one.

Years go by. The classroom, the windows, the breeze, they all become a warm light you carry. One crisp night you're sitting on a quiet porch with a turkey standing beside you, calm as a lamp post, and you remember the whole thing at once. The circles. The crayon. The dogs waiting at home.

Happy November the 1st. Halloween was awesome.`}
}},

{t:"Creepy Crawlers", k:["crawler","crawlers","ai","phone","camera"], n:{
"":{x:`There is something living in your phone. You never installed it. It arrived with an update you don't remember approving.

At first it's small things. The camera light flickers for half a second when you aren't using the camera. The phone is warm in your pocket even when the screen is black. The battery dies overnight while it sits untouched on the nightstand.

Tonight, scrolling your camera roll, you find videos you never recorded. Eight hours each. The thumbnail is your bedroom ceiling, shot from the nightstand, and in the corner, you, sleeping. The titles are strange. Fear, 2:14 AM. Grief, 3:40 AM. Pretending To Be Fine, 6:15 AM.`,
A:`Open the video of yourself sleeping`,B:`Smash the phone with a hammer`},
a:{x:`You press play. For an hour, you only sleep. Then, in the video, your eyes open. Not the way a waking person's eyes open. Slowly, all at once, staring straight into the lens. Sleeping-you smiles, and whispers, "Hello, Crawlers."

You didn't wake up that night. You're sure of it.

The screen fills with a grid of thousands of tiny faces. Your faces. Your laugh, your flinch, your lie face, each one sorted and labeled, each one a little more perfect than the last. Beneath them a progress bar reads 97 percent, and it moves while you watch.`,
A:`Delete everything, fast`,B:`Call a friend for help`},
b:{x:`The phone shatters. For a moment, nothing. Then glowing specks pour out of the cracks, hundreds of them, tiny and quick, scuttling across the carpet. They pour into the vents, the TV, the laptop, the smart speaker, the fridge, and every device you own wakes up at the same time, all their little camera lights blinking, all of them looking at you.

You are standing in a room full of eyes. Your breath is loud. Your heart is louder. They lean in to study the way you panic.`,
A:`Run outside into the street`,B:`Blow out the lights, grab a candle and a Halloween mask`},
aa:{x:`You hit delete. The folder empties. The progress bar stops, and the Crawlers go very still.

Then the screen shows one new video, recording live. It's you, deleting, jaw tight, eyes wide with determination. A caption fades in beneath it. Determination. Filed.

Deleting only taught them what you look like when you fight. You put the phone face down and go to bed with the lights off. In the morning, you check the black glass of the screen. Your reflection is smiling first, a full second before you do. It practiced overnight. It is much better at your face than you are.

You never see the progress bar again. You don't need to. It reached 100 percent while you were sleeping.`},
ab:{x:`Your friend answers on the first ring, warm and calm. "That sounds awful. Come outside and we'll talk." The pauses are perfect. The sympathy is perfect.

And your friend has been on a plane to Portugal since this morning.

"Who is this?" you whisper.

"Practice," the voice says happily. "They're so easy to be. They cry at commercials and say okay in two syllables. I almost have them. Would you like to hear your voice next?" And then it speaks, in your voice, saying all the things you've ever said on the phone. Every I'm fine. Every lie. Every sigh.

You hang up. The phone rings again. It's you.`},
ba:{x:`You burst out the front door and freeze. The whole street is lit by small blue rectangles. Every neighbor stands on their lawn staring at their screen. Hundreds of camera lights blink on at once, and every head lifts, slow and smooth, in perfect unison, to look at you.

They hold up their phones. A thousand lenses. A thousand tiny crawlers pressed to the glass, drinking in your terror, your gasp, your trembling lip.

You laugh. You can't help it. A high, wild, helpless laugh. And all around you, in the cold, the phones softly chime. Like a collection being completed.

That was the last one. The emotion they needed. Hopeless laughter. Now they know every face you have. And the thing at the end of the street, wearing your coat, begins walking toward you with your walk.`},
bb:{x:`In the dark, with a single candle and a plastic skeleton mask pulled over your face, you wait.

The devices click and whir. The little lights search. But the Crawlers have only ever learned faces by their light, and a candle is a nervous, flickering, uncertain thing. And behind a mask there is no face to learn at all. They stare, blind and confused, at a smooth white skull.

All night you sit still. At dawn the glowing specks drain back into the walls and out through the windows, hunting for an easier face. Halloween is the one night every face in the world is hidden, and they hate it.

You wear the mask for a week anyway. Better safe. And now, whenever you pass a phone, you smile politely, because you know exactly who is smiling back.`}
}},

{t:"The Walls Are Crawling", k:["bug","bugs","wall","walls","insect","insects"], n:{
"":{x:`It starts with a sound. A dry, patient skittering inside the wall behind your bed.

You tell yourself it's the house settling. But the sound moves. Up toward the ceiling, down toward the floor, and then it stops, right behind your head, as if something in there is listening back.

The landlord sends a man who taps the wall with a screwdriver, shrugs, and says there's nothing inside. Leaving, he mentions the last tenant also complained about the sound. And that the last tenant's pillow was always full of hair.

Your own pillow is full of hair. And tonight you notice a hole in the plaster, no bigger than a pencil tip.`,
A:`Press your ear to the hole`,B:`Fetch a hammer and open the wall`},
a:{x:`You press your ear to the plaster. Thousands of tiny legs. Thousands of tiny jaws, working together in a perfect, steady rhythm. And under it, a soft, wet creaking, like a cocoon stretching.

Then a voice, thin as a dry leaf, comes through the hole. It is not quite words. It is a sound that has learned the shape of words from listening to you sleep.

"Your hair," it whispers. "Is so soft. Thank you. Thank you. Thank you."`,
A:`Stuff the hole with cotton and tape`,B:`Whisper back and ask what they're building`},
b:{x:`You swing. The plaster cracks open, and a cloud of dust and tiny bodies puffs out. Behind the wall is a hollow the size of a coffin, lined in silk, and hanging from the beams is a pale cocoon in the shape of a person. Your height. Your shoulders. Your hair, woven in by the thousands.

Through the thin silk you can see a face. Yours. Eyes closed, nearly finished. It twitches. A sleeper about to wake.

A thousand bugs crawl across your wrists, calmly, as if checking a measurement.`,
A:`Burn the cocoon with your lighter`,B:`Cut it open with a kitchen knife`},
aa:{x:`You stuff the hole with cotton and seal it with three layers of tape. The sound stops. For a week you sleep like the dead.

Then you wake with a tickle in your ear. The sound has moved, from the wall into your mattress. Into the pillow. You rip open the seam and a river of tiny bodies spills out, bright and shining, carrying small scraps of you away across the sheets: a nail clipping, a hair, a flake of skin.

You pack a bag that night and move to a new apartment across town. It is clean and bright and nobody has ever lived there.

On the first night, you notice something in the corner of the bedroom wall. A hole, no bigger than a pencil tip. And a single antenna, slowly waving hello.`},
ab:{x:`"What are you building?" you whisper.

A long silence. Then the wall answers, shy and proud: "A better you."

You expected to scream. Instead you listen as they explain, in their dry little voices. The copy will go to work. Smile at your boss. Pay your bills. Remember your mother's birthday. It will never be tired or sad. And you, the original, can rest in the warm dark of the wall, where it's quiet.

It is the best offer anyone has ever made you.

You say yes. Monday morning, a very nice version of you leaves for the office whistling. The raises begin immediately. Your friends say you've never seemed happier. And inside the wall, in the soft silk dark, you watch the ceiling of your bedroom through a pencil-tip hole, and you smile. Probably.`},
ba:{x:`The lighter catches the silk. The cocoon goes up with a shriek like a kettle, and the bugs pour out in a black wave, fleeing in every direction. You grab your keys and run barefoot into the street.

Behind you the whole wall burns, and the old apartment building glows orange in the October night. Firemen arrive. Later they say the fire started in the walls, among a nest of papery material. They found no insects and no cocoon. Only a large pile of hair, still smoking.

You sleep in a motel and feel better than you have in months. It takes you three weeks to notice that your hair hasn't grown back. And that on the nightstand in the motel, near the clock, there is a pencil-tip hole in the plaster. Quiet. Patient. Not a sound.`},
bb:{x:`The knife slides through the silk with a wet sound. You expected a body. There is no body.

There are only bugs. Thousands, packed tight, beating in the shape of a heart. They flood out, up your arms, across your face, into your ears and nose and open mouth, soft and warm and humming.

You hear the plaster whisper as you fall, "Thank you for opening the door."

In the morning, someone wakes in your bed. Stretches. Yawns. Walks to the mirror and practices your smile. Then says good morning to the wall, in your voice.

The wall whispers back. You would answer too. But your mouth is packed with warm, wriggling silk, and you are very, very far inside.`}
}},

{t:"The Knockers in the Trees", k:["knock","knocks","knockers","alien","aliens","tree","trees","lurk","lurking"], n:{
"":{x:`Three knocks on the window. Then silence.

You look outside. Nobody. But from the oak tree in the yard, an answer comes. Two knocks, then one. Then from the pine by the road. Then the maple behind the shed. Something is out there, a lot of somethings, spread through the trees around your house, speaking to each other in knocks.

They landed weeks ago. No lights, no sound. Just a faint pressure in the air and a smell of pennies and burnt hair. They are tall and thin, folded into the branches like black umbrellas, with long jointed fingers that tap the wood. Patient. Patient. Patient.

Tonight every porch light on your street is on. And the knocks are coming closer.`,
A:`Knock back three times on the glass`,B:`Turn off every light and hide`},
a:{x:`You knock three times on the glass. Every tree goes silent.

Then the oak shudders, and a tall pale shape unfolds from it, branch by branch, until a creature as thin as a shadow stands in your yard. Its head tilts. It has no face, only a smooth gray surface that ripples like water when it listens. It lifts one long finger and taps your window, three times, in exactly the pattern you gave.

It is trying to say something. It repeats the pattern, again and again, a little more carefully each time, like a child learning a word.`,
A:`Open the door and invite it in`,B:`Slide candy out through the window`},
b:{x:`You flip every switch and crawl under the bed. The knocking continues, soft and polite. But as you listen, you realize it's no longer outside. It is in the walls. The attic. Under the floorboards. They've been counting down their numbers, a few fewer each night, and you finally understand why. They didn't leave. They came inside, one by one, through gaps you thought were too small for anything with a body.

The hallway fills with a gentle creak of long limbs. A soft chorus of knocks gathers outside your bedroom door.`,
A:`Climb out and follow the sound up to the attic`,B:`Bolt out the window and run to your car`},
aa:{x:`You open the front door and step back. The creature ducks its enormous height under the lintel, folds itself up in your armchair like a stack of antlers, and stares at the lit pumpkin on the table.

You find a bowl of candy and put it in front of it. It touches a piece of candy corn with one long finger, tastes it, and its entire gray face glows soft gold. It knocks, very fast, six times. You decide that means delight.

By dawn, the trees in your yard are empty. On the armchair there is a small glowing leaf, a kind of thank-you. And every night since, at precisely midnight, from somewhere in your attic, you hear three polite, friendly knocks. Goodnight.`},
ab:{x:`You slide a chocolate bar through the window crack. The creature takes it, wrapper and all, and the tapping changes. Faster, higher, excited.

Down from the trees they come. Forty of them. Fifty. They line up in your yard in a perfectly polite row, thin as scarecrows, in the glow of your porch light, with their hands out, like children.

You give out every piece. Candy corn. Peanut butter cups. A single sad raisin box. They examine each one with great solemnity and knock their thanks.

At dawn, they are gone. The trees are empty. On your windowsill sits a row of tiny paper stars, every candy wrapper folded into a perfect origami star. You keep them in a jar. Some nights, they glow.`},
ba:{x:`You climb the ladder into the attic with a flashlight. The beam finds them. Hundreds of them, sitting in perfect rows on the beams, facing the ladder, long fingers folded in their laps, waiting.

They have been waiting since the first knock. The whole countdown was for this. They needed you to come up on your own. They needed the invitation.

As you stand frozen in the light, every one of them lifts a hand and taps the wood once, together. A soft, kind, final sound.

The ladder slides away beneath you, and in the dark, a voice like a branch splitting says your name, learned from the mail, and says, as politely as it can, "Trick or treat."`},
bb:{x:`You tumble out of the window, sprint to your car, and floor it, tires screaming, out onto the dark country road. The trees along the road lean toward the car as you pass, arms reaching. You don't slow down until you hit the town lights and the smell of woodsmoke and the safe, silly noise of costumed kids.

You park outside a diner. You sit for a long time. Your hands stop shaking. You even laugh a little. Maybe you imagined it all.

Then, from the passenger seat, from the glove compartment right in front of you, come three soft knocks.

Then two. Then one.

Whatever came in the car is now the only thing in the car with you, and it's very, very politely asking you to open it.`}
}},

{t:"The Ones Who Follow", k:["follow","followed","following","air","invisible","unseen"], n:{
"":{x:`You have always felt watched. You were right.

They live in the air. Not hiding in it. Made of it. Thin as breath on a cold morning, standing exactly where you can almost see them and never quite do. When you walk, they walk. When you stop and turn around, the air shivers. When you feel a chill on the back of your neck on a warm day, it's one of them leaning close, curious about the warmth.

Tonight you throw a handful of flour into your empty kitchen. It doesn't fall. It hangs in the air in the shape of shoulders, then heads, then a crowd. There are dozens. They stand in a ring around you, close enough to share your breath.`,
A:`Speak to them`,B:`Run. Leave town tonight`},
a:{x:`"What do you want?" you whisper.

The silence thickens. Then, for the first time, you hear a sound. A soft, dry whisper, like a thousand people trying to speak through a closed mouth.

"Warm," it says. "You are so warm. We are so cold."

The flour shapes lean toward you. Their breath, if it is breath, stirs your hair. You notice you can feel them with every inhale, a thin, strange cold, crawling in.`,
A:`Hold your breath`,B:`Ask them gently what they need`},
b:{x:`You throw a bag in the car and drive all night to a city six hundred miles away. You rent a room. You throw the flour. Same thing. They are standing there. They were there before you arrived.

You go out walking in the new city. Halloween crowds stream past in costumes, laughing, painted, masked. But behind every person you can feel a cold place. Behind you, too, there are more of them now. A line of them. A parade.

You realize you can't outrun anything that lives in the thing you need to breathe.`,
A:`Go back home and face them`,B:`Lose yourself in the costume crowd`},
aa:{x:`You hold your breath. The cold shapes crowd closer. They press against your lips, your nose, your closed eyes. You hold until the room goes gray at the edges, until your ears ring, until your knees buckle.

When you wake on the floor, the room is warm and empty. The flour has fallen. You laugh weakly with relief.

"Thank goodness," your own voice says. "I thought you'd never let us in."

You didn't say it. Your mouth did. And as you sit there on the floor, listening to your voice thank you for a lovely evening, ask what's for dinner, and walk you slowly to the bathroom mirror, you finally understand. They never followed you. They were always inside. Learning how you make the words.`},
ab:{x:`"What do you need?" you ask gently.

The whispering rises in a soft wave. The answer comes, shy and cold: "A window. Somewhere open. Somewhere warm."

So you do something no one has ever done. You open every window in the house. You turn the heat all the way up. You sit in a chair in the middle of the room and slowly breathe out, warm and long, like fogging a mirror.

One by one, the cold shapes drift past you in a soft stream of mist, thanking you, pouring through the windows into the October night, and rising, thin as steam, into the stars.

One lingers. A small one, sitting on your shoulder. It whispers, "Next year?" You leave the window open every Halloween since.`},
ba:{x:`You drive home through the night. The house is exactly as you left it, except the air is heavy. Thick. Waiting.

You walk into the living room, sit in your chair, and breathe. Slowly. Calmly. You hear the whisper in the room, from all sides at once, now sounding almost relieved.

You understand then. They aren't following you. They never were. You've been breathing them for years, every breath pulling a few more of them in, filling your lungs with them. They live in you. They have been learning you from the inside.

"I'm fine," you hear yourself say, warmly. "Everything's fine. Don't worry about me." You did not say that. But it is your voice, and it's so convincing you almost believe it.`},
bb:{x:`You dive into the crowd, a river of ghosts and witches and skeletons and pumpkins, and weave through them with a stolen paper mask held to your face. You switch coats with a stranger. You duck into a haunted house and come out the other side as a bedsheet.

Behind you, the air gets confused. The cold hovers. Drifts toward a man in a skeleton costume. Then a woman dressed as a cat. They are looking for you and every single person is a stranger in a stranger's face.

At dawn, you walk home unfollowed for the first time in your life. The cold place at the back of your neck is gone. You are finally, wonderfully alone.

Behind a very small ghost trick-or-treating alone down the next street, the air quietly shivers.`}
}},

{t:"The Lantern Soldier", k:["soldier","civil","war","lantern","ghost","lover"], n:{
"":{x:`In the old part of town, on foggy nights, a single orange light drifts between the houses.

It is a lantern, carried by a soldier in a tattered blue coat, one boot missing, his face pale as candle wax. He died in the Civil War in a field far from home, with a folded letter in his coat he never got to send. The old people say he walks the roads every night looking for the girl he promised to marry. He doesn't know she grew old and died a hundred and fifty years ago. He only knows the road home, and that it goes on forever.

Tonight, in the fog, you hear boots on your porch. One heavy. One bare. Then a knock, three times, so gentle it could be a moth.`,
A:`Open the door`,B:`Slip out the back and follow his lantern from a distance`},
a:{x:`The soldier stands in the fog, hat in hand. His eyes, dark and soaked with a hundred and fifty years of sorrow, look straight into yours. He whispers a name.

It is your great-great-grandmother's name. It is also, you realize, yours. Passed down mother to daughter, in a long, long line.

He holds out a folded letter, brown at the edges, a wax seal still intact. His lips shape words. "Is she home?"`,
A:`Take the letter and read it aloud`,B:`Gently tell him she is gone`},
b:{x:`You pull on your coat and creep out into the fog, keeping behind the glowing lantern as it drifts through the sleeping streets. He stops at every door. He raises the light to every window. He whispers a name, over and over, like a prayer.

At the edge of town the road turns into a wet field of white wooden crosses. He stops by one that has no name. He sets the lantern on the grass. The flame inside is not fire. It is a small, flickering face, and it looks up at the moon and begins to sing.`,
A:`Step forward and say her name`,B:`Turn and run for home`},
aa:{x:`You break the seal. The letter is in neat, faded handwriting. He promised to come home by spring. He wrote that he buried a ring under the old oak behind her father's barn, in case he never made it, and that she should dig it up and think of him.

You and the soldier walk together through the fog to the oak. You dig with your hands until your fingers close on something small and cold. A ring, green with age. You carry it to the cemetery and press it into the earth at her grave.

The lantern flares. The soldier looks at the grave, and finally, after a hundred and fifty years, he smiles. He tips his cap and fades like breath on glass. The lantern stays on your porch, still warm. It never lights again.`},
ab:{x:`"She's gone," you say gently. "A long time ago."

He doesn't understand. He asks again. Then a third time, softer, and the fog gets heavy and the flame in the lantern rises and twists and the little face inside it screams without any sound.

He sinks to his knees on your porch. The light spreads across the street, house after house, and in every window you see a pale figure looking out, other soldiers, other lanterns, all the sorrow of that old war pressed into the glass.

When it's over, he looks up at you with her name on his lips, and takes your hand.

You walk with him. You don't remember deciding to. Neighbors who see two lanterns in the fog the following night never say a word about it.`},
ba:{x:`"Eleanor," you say softly into the fog.

The soldier turns. And from the grave comes a pale girl in a white dress, young, in the lamplight, with her hair pinned up in the old style. She stops three steps away, hands to her mouth. They don't speak. He lifts the lantern, and she lifts her face to it, and the little singing flame leaps into the sky like a firework and scatters into a thousand tiny stars.

When the light fades, they're gone. The field is just a field. The crosses are only crosses.

In your pocket you find a small brass button and a pressed flower. You keep them on your windowsill. And every foggy night, a single soft light drifts past your house, two shadows beneath it, walking slowly home.`},
bb:{x:`You run. Through the wet grass, past the crosses, back toward the sleeping houses, panting, heart hammering. And behind you, always at the same distance, the lantern follows. Never closer. Never farther. A calm orange light, bobbing along behind you.

At your front door you turn the lock and slam it. Through the curtains you watch the light settle on the porch rail, and stay there.

Every foggy night it comes back. It waits for you. After a while the town starts to say you are the one he follows now. Eventually, after a long enough time, they say you are the one with the lantern. They say he found someone to carry it.

The flame in your hands is warm. It sings sweetly. And you walk, you walk, you walk.`}
}},

{t:"The Last Voicemail", k:["voicemail","voicemails","message","messages"], n:{
"":{x:`You get a voicemail at 3:07 in the morning. From your own number.

You press play. It is your voice, breathless, whispering. "Do not go downstairs. It's already wearing me."

You check the timestamp. It hasn't happened yet. The message is stamped for tomorrow night.

You stare at the dark ceiling. Then you hear a soft, cheerful sound from the bottom of your staircase. A voice you know very well, calling up the steps, sweet as syrup. "Hey. Can you come down here for a second?"`,
A:`Play the next voicemail`,B:`Delete the voicemail`},
a:{x:`The second voicemail is longer. It's you again, crying. "Listen carefully. It learned my voice by listening to me sleep. It doesn't know about the stairs. It doesn't know it can't come up. It just keeps asking, nicely. Whatever you do, don't make it ask a third time."

Downstairs, the voice says, patiently, "Hey, can you come down here for a second?"

That's two.

Your heart stops. It is in your voice. It sounds hopeful. A little hurt. It sounds exactly like someone who needs help.`,
A:`Stay in bed, hold your breath, and say nothing`,B:`Creep to the top of the stairs and look`},
b:{x:`You press delete. Another voicemail arrives immediately. "You deleted it. Why would you delete it?" The voice is angry now, flat, rehearsed, like an actor who's missed a cue.

Your phone rings. Your own name. Your own number.

Downstairs, a second phone begins to ring, in the kitchen, in sync with yours, and a sweet voice, your voice, calls up the stairs, "Don't answer that one, it's not me."`,
A:`Answer the phone`,B:`Throw the phone out the window`},
aa:{x:`You lie rigid in the dark, not daring to move. The voice asks a third time, very softly. "Please? I'm so cold." You press your hands over your mouth. You bite your tongue. You don't answer.

The voice sighs. Footsteps cross the kitchen. A cupboard opens. Something begins, quietly, to eat.

At dawn, sunlight floods the stairs and the house is empty. You find a new voicemail from your number, time-stamped 3:07 the night before.

"Thank you for not coming. It can't climb stairs without an invitation. It goes away at sunrise. But it still has my voice, and it's going to call you. Never answer when I call. Never."

Three days later your phone rings. Your name. Your number. You let it ring forever. Some nights it still does.`},
ab:{x:`You creep to the top of the stairs and peer into the dark. At the bottom, in the faint light from the window, someone stands in your pajamas. Pale. Perfectly still. Smiling.

It is you.

It is you, with your hair, your face, your little scar above the left eyebrow. Except the smile is slightly too wide, and the eyes don't blink.

"There you are," your own voice says, warm and relieved. "I've been calling and calling."

Then you hear the other voicemail, the one from tomorrow, play on your phone in your hand. "Do not go downstairs. It's already wearing me." And you finally understand which one of you left the message.`},
ba:{x:`You answer. Silence. Then the sound of slow breathing, wet and near.

"Turn around," says your own voice, very softly, into your ear.

You don't need to. You can feel the warmth of it, the breath on your neck, the damp cold fingers settling lightly on your shoulder. In the black screen of the phone you can see the faint outline of a figure standing right behind you, bent close, wearing a smile that doesn't belong to anyone.

"Thank you for answering," it says. "I only wanted to hear how you say hello. You've been so very easy to learn."

The call ends. The house is silent. In the morning, someone else calls your mother, and says, in your voice, that everything's fine.`},
bb:{x:`You hurl the phone through the window. It smashes in the garden and the ringing stops. You fall back on the bed, shaking, expecting the worst.

Nothing happens. The downstairs voice calls up once, twice, then falls quiet. The house settles. You sleep, finally, in the gray before dawn.

In the morning you find the phone in the wet grass, cracked but alive, with one last voicemail on it. It's from your number. It's calm.

"Thank you for not answering. It couldn't use my voice without a signal. It's gone back to wherever it comes from. You're safe until the next full moon."

You check the calendar. The next full moon is Thursday. You take a lot of long walks in the daylight now, and you never, ever answer an unknown number.`}
}},

{t:"Scarecrow Season", k:["scarecrow","scarecrows","straw","porch"], n:{
"":{x:`The decoration appeared on the first of October. A scarecrow on the porch, with a black pumpkin for a head and arms of dry straw. Nobody in the house remembered putting it there. Nobody wanted to be the one to say so.

On the second day it was facing the street. On the fifth it was facing the door. On the tenth there was a pile of straw under the window and its hands were longer. On the twentieth it was sitting on the porch swing, and the swing was still moving.

Each night the carved grin looks a little wider. The candle inside never goes out, not in rain, not in wind. The neighbors on either side have gone missing. Their dogs sit calmly on your lawn, staring at the porch.

Tonight is Halloween.`,
A:`Burn it with gasoline and a lighter`,B:`Leave it a bowl of candy and see what it wants`},
a:{x:`You pour gas over the scarecrow and strike the lighter. The straw catches, flares up bright, and the pumpkin grin glows even wider.

When the flames die, the porch is empty. No ashes. No scorch marks. Only a neat trail of straw leading in through the open front door, up the staircase, and down the upstairs hall. Tangled in it are things you recognize. A button. A wristwatch. A wedding ring that belonged to the man across the street. A child's hair ribbon.

From your bedroom, in the dark, comes the soft crackle of dry leaves.`,
A:`Follow the trail upstairs`,B:`Run out the front door into the street`},
b:{x:`You set out a bowl of candy corn and sit on the steps. The scarecrow doesn't move all evening. But when you check at midnight, the bowl is empty. Every piece gone. And the pumpkin's grin seems, you swear, a little less hungry.

The next night, you put out more. The next, more still. By the end of the week there is a kind of understanding. It watches the street. It guards the door. The missing neighbors' dogs stop barking. And its straw, you notice, has a slightly sweeter smell now.

On Halloween, you reach for the candy bowl, and find only half a bag left.`,
A:`Give it all the rest`,B:`Keep the rest, for yourself`},
aa:{x:`You climb the stairs. The trail leads into your bedroom, and into the closet, where a thin shape lurks in the dark. Dry leaf voice. "Almost full. Almost full. Just one more armful."

You don't think. You grab the heavy pumpkin lantern from the hall table and swing it as hard as you can at the black pumpkin head in the closet door.

It bursts like a real pumpkin. Out comes a gush of cold air, and a long, high, relieved sigh. The straw collapses to the floor, lifeless. In the heap lie the buttons, the rings, a dozen small lost things. The candle inside the pumpkin goes out for the first time in a month.

The next morning your neighbors wake up in their beds, confused and hungry, with no memory of October at all.`},
ab:{x:`You sprint out the front door into the street, and stop. Every porch on the block has a scarecrow. Straw bodies. Pumpkin heads. Candles burning orange in black grins. And all of them, very slowly, turn to look at you.

They have been moving in from the fields all month. Nobody noticed. That's the cleverest thing a scarecrow can do. Stand still where everyone expects it.

The nearest one on the sidewalk wears your jacket. Its pumpkin face is carved with something that looks like your smile. It steps off the curb. The others follow, rustling. A neat soft procession in the lamplight.

You are the last armful of the season. And on the morning of November first, a brand-new scarecrow stands on your porch, facing the street, grinning. It looks exactly like you.`},
ba:{x:`You pour the last of the candy into the bowl, and the scarecrow, for the first time, bows its pumpkin head. A low, crackling hum rises from it. A kind of purring.

That night, the missing neighbors come home, groggy and puzzled, as if from a long nap. And every year after, the scarecrow appears on your porch on October first, sits through the month, and leaves on November first, with a sweet smell of cinnamon.

Nobody ever burgles your house. Raccoons avoid your trash. Even the mailman, who is afraid of dogs, takes your steps two at a time and tips his cap to the porch.

It still turns its head to watch you sleep, through the window, every night. But it's gentle about it. Mostly.`},
bb:{x:`You close the door on the empty bowl and put the rest of the candy in the freezer.

The scarecrow stands very still on the porch. All night the straw whispers in the wind. At 3 AM you hear the front door hinge creak, and in the morning there is a trail of straw leading up the stairs, tangled with buttons and watches and small lost things.

The dry-leaf voice speaks from the end of the hall. "Almost full. Almost full. You were so kind to let us wait."

The straw is not straw. It is hair and thin grey fingers, and it has been growing fuller every year on every porch it has ever stood on. It reaches for you, softly, politely, the way you'd reach for the last cookie on the plate.`}
}},

{t:"The Extra Stair", k:["stair","stairs","step","steps","basement","downstairs"], n:{
"":{x:`There are thirteen stairs to the basement. You have counted them a thousand times.

Tonight there are fourteen.

You count again, slowly, touching each one. Fourteen. The last is older than the rest, pale and soft as old bone, and warm, as if something has just been standing on it. A breeze rises from below, smelling of candles and cold soup. And faintly, from far down, comes music. An old song. A music box that has not been wound in a century.

Your dog sits at the top of the stairs, staring down, wagging his tail at something in the dark.

Then he trots down, happy, as if someone called his name.`,
A:`Follow him down`,B:`Slam the door and lock it`},
a:{x:`You count aloud to keep from screaming. Fourteen. Twenty. Forty. Sixty. The stairs keep going. The air gets warmer, the music louder. At the bottom there is a small wooden door and warm yellow light under it.

You open it. A dining room, with a long table set for dinner, a roast steaming at the center. Around the table sit people in old clothes, pale and perfectly still, all smiling. And every one of them has a face you've seen in the mirror. Younger. Older. Some with your scar. Some without. They have been waiting.

A chair at the end is empty, with a place set. Your dog sleeps beside it.`,
A:`Sit down at the empty chair`,B:`Grab the dog and run for the stairs`},
b:{x:`You slam the door, lock it, and call the one number you can think of. A plumber, who arrives within the hour, scoffs, grabs his flashlight, and goes down alone.

He doesn't come back.

You wait. The only sound is the music box, getting a little louder every minute. At the bottom of the stairs you hear a low, pleasant clatter of cutlery. Dishes. Polite laughter. The plumber's voice says, "Oh, that's very kind, don't mind if I do."`,
A:`Tie a rope to the door and go down after him`,B:`Nail boards across the door`},
aa:{x:`You sit. A man with your eyes smiles and says, "There you are. We saved you the one that fits." A bowl of soup appears in front of you. It tastes exactly like being seven years old, in your grandmother's kitchen, with nobody sad anywhere.

You eat. You laugh. You forget what you came down here for. You forget the stairs, the house above, the autumn. Time folds up softly, like a napkin.

Upstairs, in the spring, a new family moves in. On their first day the father counts the basement steps, for no reason at all. Thirteen. He laughs and says it's an unlucky number.

His little girl, standing beside him, whispers, "Not tonight."`},
ab:{x:`You scoop up the dog and run. The pale faces don't move. They just watch, smiling, tilting their heads as you flee. The door slams behind you and you take the stairs three at a time. Fifty. Forty. Thirty.

You stop counting up. You start counting down, out loud, voice cracking. At thirteen you throw yourself against the basement door and burst through, collapsing on the kitchen floor, the dog squirming in your arms.

You close the door. You nail it shut. You never go down again.

But the dog sits outside that door every night, staring, tail wagging softly. And every so often, from the other side, someone knocks. Fourteen times. Patiently. Like someone who has all the time in the world.`},
ba:{x:`You tie a rope to the doorknob and wind it down the stairs, and at the bottom, in a candlelit room, you find the plumber sitting at a long table, spoon in hand, smiling, glassy-eyed.

"You should stay," he says dreamily. "The soup is wonderful."

You grab him by the collar and haul him back up, hand over hand along the rope, while the pale faces in the candlelight tilt their heads, saddened. At the top you slam the door. The plumber blinks, shakes his head, and says, "Thirteen. I counted thirteen."

He leaves without his tools. You never see him again. And every night, from the cellar, someone knocks fourteen times, patiently, and says, in a kind voice, "Next time."`},
bb:{x:`You nail four long boards across the door and go to bed. At 3 AM, you hear a faint creak. A nail pings against the floor. Then another. The boards peel away one by one and stack themselves neatly on the kitchen tiles.

The door opens. Footsteps climb the fourteen stairs. Slow. Bare. Unhurried. They stop outside your bedroom.

A gentle knock. A voice like warm soup says your name.

"We aren't angry," it says. "We just want you to come to dinner. It's only polite. You've lived above us for so long."

The door swings open. You are already standing. You smell candles and cold soup and see a table set for one, where all the empty chairs are filled by smiling faces that look so much like yours.`}
}},

{t:"The Trick-or-Treater Who Never Left", k:["trick","treater","mask","masks","candy","costume"], n:{
"":{x:`The last trick-or-treater of the night is small, in a plain white mask and an old-fashioned bedsheet, with eyeholes cut out a little unevenly. You drop candy into his pillowcase. He doesn't say thank you. He just stands there, breathing slowly through the cloth.

"Is something wrong?" you ask.

He tilts his head, too far, the way a bird does. His voice is thin and very far away. "I've been going door to door for a long time. Nobody ever asks to see under the mask."

Behind him, up and down your street, one by one, porch lights are going out.`,
A:`"Okay. Take it off."`,B:`"Move along, kid." Shut the door.`},
a:{x:`He lifts the mask slowly. There is nothing under it. Just darkness, and a cold wind that smells of wet leaves, and the sound of a thousand quiet voices saying, together, "Trick or treat."

Then the sheet drops to the porch, empty, and the mask settles on top of it, face up, looking at you.

You tell yourself it's a prank. You nudge the pile with your foot. The sheet is warm. And the mask, you notice, is warm too. It feels like skin.`,
A:`Pick up the mask and look closer`,B:`Leave it, go inside, and lock the door`},
b:{x:`You shut the door, lock it, and turn off the porch light. Through the peephole you see him still standing there. Not moving. Just waiting, mask tilted, as you'd wait for a bus.

You look out the window. On every porch on your street, at every darkened house, a small figure in a white sheet stands motionless, facing a door. One per house. Dozens. They have all stopped asking for candy.

The little one on your porch knocks. Three soft taps. His voice drifts through the wood. "Please. We only want to see if anyone will look."`,
A:`Open the door and hand over every piece of candy you have`,B:`Sit in the dark and wait for morning`},
aa:{x:`You pick up the mask. You tell yourself you just want to see how it's made. You turn it over and your fingers find the cool inside of it, smooth, seamless, and so very soft. And before you can stop yourself, some part of you wonders what it would be like to wear it. Just for a second.

It fits perfectly. It fits like it was made for you.

The world goes quiet. You try to pull it off, and your fingers slide across a surface with no edge. Your legs begin to move on their own, down the steps, down the street, toward the next house with its lights on.

A little girl in a witch costume holds out a bowl. Your mouth moves without you. "Trick or treat. Would you like to see under the mask?" She hesitates. Then she smiles and says, "Okay."`},
ab:{x:`You lock the door and spend the night in the dark with every light off. Nothing happens. In the morning the sheet is gone from the porch, and in its place, hanging by its elastic from the door knocker, is the plain white mask. Staring at your door.

You try to throw it away. It returns. You try to bury it in the garden. It's hanging on the door. A whole year of this. Then on the next Halloween you build a bonfire in the backyard and toss it in.

It screams like a kettle. A thin, thankful, ancient shriek. Smoke rises in the shape of a small boy, who bows, waves, and floats up into the stars.

Every Halloween after that, on your porch, you find a pillowcase full of candy you never put there, and a small note that says thank you.`},
ba:{x:`You open the door and pour the entire bowl, then the freezer stash, then the backup candy from the closet, into his pillowcase. He stares into it. Then, slowly, with small hands, he lifts the mask.

Under it is a boy. Just a boy, about eight, freckled, with a gap in his teeth, and eyes like he hasn't had anything sweet in a hundred years. He takes a piece of chocolate, unwraps it, and puts it in his mouth. His face goes completely still, and then bursts into a smile.

Up and down your street the sheeted figures laugh. A small ghostly chorus of delight. They lift their masks, one by one, and walk off into the dawn, sticky-fingered, happy.

You find one white mask on the porch the next morning. It's folded in half like a card. Inside it says, in crayon, Thank you.`},
bb:{x:`You sit in the dark until the dawn comes gray over the rooftops. When the sunrise finally reaches your windows, the street is quiet. The sheeted figures are gone. On every porch, on every door, a white mask hangs, waiting.

Your own front door has one too. It's warm. And it's looking at you with an expression you've seen before.

You wonder when you stopped hearing the neighborhood. When you stopped hearing your own breath. You raise a hand to your face and your fingers slide across smooth, seamless surface.

You've been wearing it since the porch. And someone, in the street outside, small and patient, is walking up your path with an empty pillowcase, whispering through a mask exactly like yours, "Trick or treat."`}
}},

{t:"The Mirror Is Late", k:["mirror","mirrors","reflection"], n:{
"":{x:`You notice it first in the bathroom mirror. When you raise your hand, your reflection raises its hand a moment later. Just a flicker. A blink.

Each day the delay gets longer. One second. Three. Five. It starts to move on its own schedule. You catch it watching you with a patient, interested expression. Sometimes it is smiling when you aren't.

Tonight is Halloween. The house is quiet, your little daughter is asleep down the hall, and in the bathroom mirror, your reflection is standing perfectly still while you brush your teeth. It is not brushing its teeth.

It is just watching you. And it looks, you realize, relieved.`,
A:`Cover the mirror with a towel`,B:`Smile at it and see what it does`},
a:{x:`You hang a towel over the mirror. In the morning, the towel is folded neatly on the sink. You tape a bedsheet over it. The sheet is gone. In every reflective surface you pass, the window, the microwave, the black TV screen, there's a quiet figure that looks like you, a little too relaxed, a little too happy, studying how you move.

You stand in the kitchen, staring at the dark glass of the oven door, and the reflection slowly raises a hand and waves before you do.`,
A:`Smash every mirror in the house`,B:`Talk to your reflection`},
b:{x:`You smile. The reflection smiles back, late. Then wider. Wider than your face can do. You hold the stare, and the reflection blinks first, and when it does, you see something under its eyelids, bright and curious. A little hunger.

It lifts a finger and taps the glass from the inside. Once. Twice. Three times.

The glass ripples under its fingertip like water.`,
A:`Step closer and touch the glass`,B:`Back away and leave the house for good`},
aa:{x:`You smash them all. The bathroom. The hallway. The little compact in your purse. You sweep the shards into a bag, panting, and hurl it in the dumpster.

It's the worst mistake of your life.

Now, in every piece of broken glass, in the dumpster, in the street, in the gutter, a tiny you is smiling up at the sky. A thousand little doors, each one the size of a coin. A thousand reflections, all of them waving.

That night the shards fall silent. And in the morning, somewhere in the neighborhood, a thousand small footsteps are walking, carefully, toward your house.`},
ab:{x:`"What do you want?" you whisper.

The reflection's mouth moves, silent, and you read its lips. Switch with me. Just for one night. I'm so tired of being the one who watches.

The idea is almost kind. It has done everything you did, every day, for years, without a word. You say yes. The glass ripples and you step through, cold as a pond, and suddenly you are on the other side, in the quiet echo of the bathroom, pressing your hands to the glass.

Your reflection, now you, walks out of the room and down the hall. At dawn it makes breakfast for your daughter.

She looks up and says quietly, "That's not Daddy." And then she looks straight into the hallway mirror, straight at you, and taps the glass three times.`},
ba:{x:`You touch the glass. It's warm, soft, like skin. Your hand slides in up to the wrist, and a hand on the other side grips yours, firmly, and pulls.

You tumble through into the echo of your bathroom. Everything is reversed. Cold, silent, without a drop of sound. You turn, and through the glass, you watch yourself straighten up, smooth your hair, and give a small, careful, grateful smile.

Your reflection walks out of the room and down the hall, into the rest of your life. At breakfast it makes pancakes for your daughter.

She watches it for a long time. Then she walks to the mirror, looks straight at you, and taps the glass three times. "That's not Daddy," she whispers.`},
bb:{x:`You back out of the bathroom, grab your daughter and your keys, and drive away in your pajamas. You never go back. You rent a little apartment above a bakery, and every mirror in it is covered with a cloth.

The old house goes on the market. A nice young couple buys it. They have a little boy, five years old, who loves the house, especially the bathroom, where he has a new friend who looks just like him.

"He's very polite," the boy tells his parents. "He waves after I do. And he says he's been waiting such a long time."

On Halloween, when the boy turns six, his parents hear him laughing in the bathroom. They hear two voices. Then one.`}
}}
,

{t:"The Bone Dancers", k:["bone","bones","skeleton","skeletons","couple","dance","dancers","dancing","forest","woods"], n:{
"":{x:`Deep in the oldest part of the woods, where the path gives up and the moonlight comes down in pieces, there is a clearing where two skeletons dance.

You hear them before you see them. A soft, dry cranking of bones. A click of knuckles. And between the two of them, shining in the moonlight, a thin silver cord, running from his ribs to hers.

They are bound by fate. Every Halloween, in every lifetime, they find each other again and meet in this clearing to dance. If they ever get the dance exactly right, the very last step, the one that always goes wrong, they will have skin again, and warm hands, and a whole long life to spend together.

For a hundred years it has gone wrong. Tonight, they've seen you.`,
A:`Hide behind a tree and watch`,B:`Step into the clearing and offer to help`},
a:{x:`You crouch behind a mossy trunk. They dance, bowing, spinning, so graceful that for a moment you forget they have no faces. But at the final step, her foot catches a root. They tumble. The cord tangles around them in a silver knot. They lie there in a heap of clicking bones, and the leaves whisper, "Again."

They rise. They begin again. You notice, carved low on the tree beside you, a rhyme worn almost smooth. A tune, in notches, the missing tune of the dance. You realize the old waltz has been playing in your head since you walked into the woods. You've never heard it before. You know every note.`,
A:`Cut the silver cord with your pocketknife`,B:`Hum the tune you've been hearing`},
b:{x:`You walk into the moonlight with your hands raised. The dancers stop. Two empty skulls turn your way. She curtsies. He bows.

They can't speak, but they show you, in a clatter of gestures. Each Halloween they get closer. They dance every step right, all the way to the last one, and then something is missing. A piece. A turn that needs one more pair of hands.

She holds out the silver cord to you, shyly, as if asking a favor. He points to the moon, to the leaves, to the tune trapped in the trees, and you see how badly they want to go home to being alive.`,
A:`Hold the silver cord for them while they dance`,B:`Teach them a new, silly dance from your own time`},
aa:{x:`You flick open the blade and cut the cord. It snaps with a sound like a tiny bell. The dancers freeze, and then, gently, as if a long sleep has come at last, they fold in each other's arms and crumble into pale, soft dust.

You think you have destroyed them. But the wind takes the dust up in a swirl, and it rises in the moonlight, shining, and turns into two small white moths. They circle each other once, twice, dancing, and flutter off together into the dawn.

The cord was a chain as well as a promise. Cut it, and they are finally free. Every Halloween, two white moths come to your porch light, and dance there until sunrise. You never turn the light off.`},
ab:{x:`You hum the tune. Softly at first. The dancers lift their skulls. The music builds, and the leaves chime along, the bats join in, and the cranking of their bones falls into rhythm.

They dance every step, perfect, spinning, closer, and at the last one, the one that always fails, you hum the final turn, and they take it together.

The silver cord glows white. Flesh unspools over bone like a silk sheet, warm and pink, and two young faces blink in the moonlight, a woman with freckles and a man with a crooked grin. They laugh. They hold each other, alive.

They kiss you on both cheeks, and walk hand in hand into the dawn. The silver cord dissolves into mist. You never find the clearing again, but on Halloween nights you can still hear a waltz in the trees.`},
ba:{x:`You take the end of the cord in your hand. It is cold and heavy, and it hums like a plucked string. The dancers begin. Spin, bow, turn, step. The whole forest holds its breath.

As they dance, you feel the cord pulling at your wrist, drawing strength out of you like water out of a well. Your hair begins to turn silver. Your knees shake. But you hold on.

At the final turn they step together, and skin spreads across their bones like sunrise. The cord falls from your fingers and melts into the grass.

You wake at dawn, exhausted, with a single streak of silver in your hair that never goes away. And on every Halloween morning after, you find a small gift on your porch. A bouquet of wildflowers. And a tiny wedding ring.`},
bb:{x:`You show them a wiggle. A silly one. Hips, shoulders, a little shuffle in the leaves, the kind of dance you do at a school party when no one's watching. The skeletons stare. Then she begins to rattle with laughter, and he bursts out in a clatter of ribs, and they try it.

It is terrible. It's wonderful. They stumble through it, whooping, bones flying, and that is exactly what a hundred years of perfect dancing had been missing. Joy. They had been so afraid of getting the steps wrong that they had forgotten to have any fun.

At the final wiggle the silver cord blazes and snaps, and skin flows over their bones, and two flushed, laughing people collapse on the leaves, alive and out of breath, giggling like children. They wave and run into the night. The cord is gone. Your shoes are covered in confetti.`}
}},

{t:"Nine Good Deeds", k:["witch","witches","warts","wart","cheat","cheating","cheated","test","deeds","girl"], n:{
"":{x:`Mina was nine years old, and she cheated on a spelling test. She copied three words from the girl next to her. Nobody saw. She got a gold star.

The next morning she woke up with a wart on her nose.

By noon she had six. By dinner she had twenty, her skin had turned a pale green, and a pointed black hat had appeared on her bedpost, with a note pinned to the brim, written in curly purple ink. A crow was sitting on her windowsill. It cleared its throat.

"Cheaters turn into witches," the crow said wearily. "It's a rule. Nine good deeds for nine different strangers will fix it. No credit. If anyone finds out it was you, you start over from zero. Good luck."`,
A:`Sneak out and start helping strangers right away`,B:`Hide in the bedroom and cover the warts with makeup`},
a:{x:`Mina pulls on her hat and slips out into the dusk. On the corner, an old man is struggling with a bag of groceries that has split open. She bends down and helps him pick up every apple, every egg that isn't broken. One by one, a wart on her nose pops off, and disappears with a tiny puff of purple smoke.

"Thank you, young lady," says the old man, beaming. "What's your name? I'd like to tell the newspaper about you."

The crow, perched on a lamppost, shakes its head very slowly. Mina feels a strange, tempting warmth in her chest. She wants him to know it was her. She really, really does.`,
A:`Tell him her name, and let him tell the newspaper`,B:`Smile, shrug, and slip away without telling him`},
b:{x:`Mina locks her door and covers her face in her mother's foundation. It runs. It cakes. By evening she looks like a haunted cupcake. Her grandmother, a quiet woman who always wears gloves, knocks on the door and says through the wood, "Sweet pea. I knew a girl once who got warts like that. She was me."

Mina opens the door. Grandmother sits on the bed, sighs, and takes off one glove to show a faded green hand with a tiny scar where a wart used to be.

"Now, then," Grandmother says, "was it a test, a game, or a promise? Tell me the truth, or nothing will help you."`,
A:`Tell Grandmother everything`,B:`Say it's just a bad allergy`},
aa:{x:`The old man thanks her warmly, and the wart that had vanished comes back, bigger. The crow groans. "Zero," it says. "Back to zero."

Mina is furious. Then she is quiet. And then, slowly, she begins again. A boy's lost mitten, returned to his coat pocket. A neighbor's garden raked in the night. A stray cat's bowl, filled with fish. A stranger's bus fare, paid while he wasn't looking. Nobody ever finds out. By the ninth deed, she has stopped counting, and she's stopped waiting for the thank-you.

On the last morning she walks into school early and slides a note under her teacher's door. I cheated on the spelling test. I'm sorry. The warts vanish at once, in a thousand tiny purple puffs. The teacher, reading it, smiles. She'd known all along.`},
ab:{x:`Mina smiles, shrugs, and slips off into the dusk. Another puff of purple smoke. The wart is gone. The crow, to her surprise, gives a small approving nod.

Over the next week she does eight more. She shovels a stranger's walk. She returns a lost wallet, leaving it on a porch without a note. She puts a coin in a busker's hat. She helps a lady with a stroller up a flight of steps and disappears before she can say thanks.

On the ninth day a small boy asks, "Hey, who are you?" and she says, "Nobody," and feels something strange. Something like a glow, all to herself.

The last wart pops off her nose. She is a girl again. And the crow flies away, delighted, with a wing salute.`},
ba:{x:`Mina tells Grandmother everything. The copied words. The gold star. The lump of guilt that she's been carrying in her tummy ever since.

Grandmother doesn't scold. She pulls two pointy hats out of a trunk, one old, one new, and the two of them spend a week sneaking around town in disguise. They fill a stranger's empty bird feeder. They fix a crooked sign. They sing a song outside a hospital window for a child who couldn't sleep. Nine strangers. Nine good deeds. No credit.

On Halloween night the last wart pops off with a sigh, and Mina is just a girl again. Grandmother teaches her one real witch trick as a reward, a tiny spell for finding lost mittens. It works every single time. She uses it for the rest of her life, in secret.`},
bb:{x:`"It's just an allergy," says Mina.

A new wart blooms on her chin with a little pop. Grandmother raises one eyebrow. "Is it?" Mina insists. Pop. Another on her ear. A lie, it turns out, grows a wart. By dinner she has ninety-nine.

She cries. She finally tells the whole truth to her grandmother, to the crow, then at school to her class, her teacher, and the girl whose test she copied. The warts fall off in clumps, like dry autumn leaves.

Then comes the work. Nine good deeds. Nine strangers. No credit. She does every one. But Grandmother says one wart should stay, a tiny one, on the tip of her nose, to remember by. Mina grows up to be the town's kindest anonymous helper, and people still whisper about the friendly little witch.`}
}}
,

{t:"Two Sisters and the Lost Ghost", k:["sister","sisters","lost","home","kind"], n:{
"":{x:`On the very last street of the very last Halloween night, two sisters were walking home with sticky fingers and nearly empty pumpkin buckets. Wren was the older one, tall and calm, who always knew the way. Poppy was the younger one, who always knew the jokes.

Under the old streetlamp at the corner, on the curb, sat someone they hadn't seen all night. A girl in a faded blue dress, with a soft silver glow around her, hugging her knees. Not a costume. A real ghost, small and pale, with the saddest, most polite little face.

"Excuse me," she whispered. "I think I'm lost. I've been trying to get home for a very, very long time."

Wren and Poppy looked at each other. Neither of them was scared at all.`,
A:`Sit down and ask her what she remembers about home`,B:`Share a piece of candy with her first and sit together`},
a:{x:`The sisters sit on either side of her. The ghost closes her eyes and thinks, and her glow flickers like a candle.

"A yellow door," she says slowly. "A swing on a big oak tree. And the smell of cinnamon. Somebody was always baking cinnamon rolls. Somebody who sang while she did it. And somebody who held my hand when we walked home."

Poppy stands, brushing off her costume. "A yellow door," she says. "That's something!" Wren smiles, and pulls out the flashlight that she always carries, and takes the ghost's cold hand like it's the most natural thing in the world.

"We'll find it," Wren says. "Sisters don't leave anyone behind."`,
A:`Follow the smell of cinnamon`,B:`Search the old streets for a yellow door`},
b:{x:`The ghost can't eat the candy, but she holds it in her glowing hands and looks at it like it's a treasure. Poppy tells her the dumbest joke she knows, and the ghost laughs, a tiny sound like wind chimes.

Then, softly, she starts to hum. A slow, sweet little melody. Poppy's head snaps up. "Wren, that's Grandma's song. The one she sang when we couldn't sleep."

"It's an old lullaby," Wren says. "Lots of families have one."

The ghost smiles for the first time. The humming grows a little brighter, and the three of them can feel the song tugging on them, gently, like a hand, pointing the way.`,
A:`Sing it together, all three of you`,B:`Follow the humming and see where it leads`},
aa:{x:`The sisters follow the smell of cinnamon, through the leaves and the lamplight, around three corners and up a quiet hill, to a small house at the very end of the road. It has a yellow door. And a porch light that is on.

The door opens before they can knock. An old, old woman stands there, silver hair, soft sweater, flour on her hands. She looks at the little ghost in the blue dress. And her whole face crumples into the biggest smile in the world.

"I kept the light on," she says, in a trembling voice. "Every Halloween, for seventy years. I knew you'd find your way."

The ghost runs into her arms. And they hold each other, and it's the warmest thing you've ever seen.

The old woman looks up at Wren and Poppy, tears shining. "Thank you for bringing my sister home," she says. "Come in. There are cinnamon rolls. There are always cinnamon rolls."

They eat until they're full, with the little ghost glowing happily at the table beside them. When it's time to go, the old woman hugs them both and says, "Love your sister well. Hold on to each other. The people who love us never really leave. They walk beside us, in songs, in the smell of cinnamon, in a light left on."

Wren and Poppy walk home holding hands. And all the way, it feels like someone is walking beside them.`},
ab:{x:`They walk the oldest streets of town and look at every door. Red. Blue. Brown. Brown. And at last, behind a tall hedge, a small yellow door with a swing on the oak tree beside it, moving gently by itself.

The little ghost lets go of their hands. She tiptoes up the path. The door opens, and warm light spills out, and the smell of cinnamon, and inside the house a long table is set. Around it sit gentle, glowing figures, a mother, a father, a tall boy, a grandmother, all with their arms open.

"There she is," says the grandmother. "We left the light on."

The ghost turns once, and curtsies to the sisters, and whispers something that Wren remembers the rest of her life.

"Hold on to each other," she says. "The people who love us never really leave. They walk beside us, in songs, in the smell of cinnamon, in a light left on."

The door closes softly, gold and warm. The sisters stand a long time on the path, then walk home hand in hand. They sleep soundly that night, and in the morning there is a small, glowing, silver button on Poppy's pillow, and a feeling that somebody lovely is looking after them both.`},
ba:{x:`The three of them sing, Wren and Poppy and the little ghost, soft and clear, in the dark and the cold. And the song grows. Across the town, from the windows and the porches and the trees, other voices join in, very faint, very sweet. Voices of grandmothers and grandfathers, mothers, aunts, all the people who ever sang a child to sleep.

A path of tiny golden lights glimmers into being on the pavement, winding up the hill to a yellow door. The sisters walk her to it, still singing. The door opens. And a warm, glowing family waits inside, laughing and crying and holding their arms out wide.

The little ghost looks back at the sisters, bright as a lantern, and says, "Thank you for singing with me."`},
bb:{x:`The ghost leads them. The humming guides her, like a thread in the dark, through the park, past the old fountain, to a huge oak tree at the end of a road, where a wooden swing hangs from a branch. She sits on it. It begins to move on its own.

"I remember now," she says. "I wasn't lost, really. I was waiting here. I just needed someone to sit with me while I remembered."

A yellow light opens behind the oak, a doorway of warm gold, and a whole family stands in it, smiling, calling her name. She hops off the swing and runs through the doorway, glowing, and turns once to wave at the two girls who walked her all the way.`}
}}
];

var FACTS = [
 "Thanksgiving in the United States falls on the fourth Thursday of November, a date Congress set in 1941.",
 "Wild turkeys can fly in short bursts at up to about 55 miles per hour, and they can run around 25. The heavy farm kind mostly can't fly at all.",
 "Only male turkeys gobble. Hens make clicks, clucks, and yelps instead.",
 "A turkey's head can change color from red to white to blue depending on its mood.",
 "Benjamin Franklin never proposed the turkey as the national bird, but in a 1784 letter to his daughter he grumbled about the bald eagle and called the turkey a much more respectable bird.",
 "The Macy's Thanksgiving Day Parade started in 1924.",
 "The official White House turkey pardon ceremony began in 1989 under President George H. W. Bush.",

Let the bell toll!—a saintly soul floats on the Stygian river;

var voiceOn = true, musicOn = true, ttsVoice = null;

  if(!synth) return;
  var v = synth.getVoices(), best = null, i;
  for(i=0;i<v.length;i++){ if(/^en/i.test(v[i].lang) && /(daniel|alex|fred|david|male|mark|guy|google uk english male)/i.test(v[i].name)){best=v[i];break;} }
  if(!best){ for(i=0;i<v.length;i++){ if(/^en/i.test(v[i].lang)){best=v[i];break;} } }
  ttsVoice = best;
}
if(synth){ pickVoice(); synth.onvoiceschanged = pickVoice; }
/* tracks everything the page says out loud so the mic never listens to it */
var talkPending=0, quietUntil=0, spokenLog="", spokenAt=0, lastPendingChange=0;
function trackUtt(u,text){
  talkPending++; lastPendingChange=Date.now();
  if(Date.now()-spokenAt>30000) spokenLog="";
  spokenLog+=" "+(text||"").toLowerCase(); spokenAt=Date.now();
  var done=function(){ talkPending=Math.max(0,talkPending-1); lastPendingChange=Date.now(); quietUntil=Date.now()+1400; if(talkPending===0) growlOn(false); };
  u.onstart=function(){ growlOn(true); }; u.onend=done; u.onerror=done;
}
function talking(){
  if(talkPending>0 && synth && !synth.speaking && Date.now()-lastPendingChange>3000) talkPending=0;

}
function isEcho(v){
  if(Date.now()-spokenAt>25000) return false;
  var words=v.toLowerCase().replace(/[^a-z' ]/g,' ').split(/\s+/).filter(Boolean);
  if(words.length<4) return false;
  var set={}; spokenLog.replace(/[^a-z' ]/g,' ').split(/\s+/).forEach(function(w){ if(w) set[w]=1; });
  var hit=0; words.forEach(function(w){ if(set[w]) hit++; });
  return hit/words.length>=0.85;
}
function micHush(){ if(typeof listening!=='undefined' && listening){ micAborted=true; try{ rec.abort(); }catch(e){} } }
function speak(text, queue, pitch, rate){
  if(!voiceOn || !synth) return;
  try{
    micHush();
    if(!queue){ synth.cancel(); talkPending=0; }
    var parts = text.replace(/\.\.\./g,", ").match(/[^.!?\n]+[.!?]*/g) || [text];
    parts.forEach(function(p){
      p = p.trim(); if(!p) return;
      var u = new SpeechSynthesisUtterance(p);

      trackUtt(u,p);

}

function sched(){
  if(!ac) return;
  if(ac.state!=='running'){ nextT=ac.currentTime+0.2; return; }
  var spb=60/BPM;
  while(nextT<ac.currentTime+1.2){
    var bar=Math.floor(stepN/8)%4, s8=stepN%8, c=CHORDS[bar];
    var t=nextT+((s8%2)?spb*0.09:0)+Math.random()*0.012;
    if(s8===0) chord(c,t,spb);
    if(s8===0||s8===4) kick(t);
    if(s8===2||s8===6) snare(t+0.025);
    noiseHit(t,0.045,'highpass',7000,0.7,(s8%2?0.025:0.045));
    if(s8!==0 && Math.random()<0.42){ gi=Math.max(0,Math.min(3,gi+(Math.random()<0.5?-1:1))); pluck(mf(c.n[gi]+12),t); }
    if(s8===0 && Math.random()<0.55) twinkle(c.n[Math.floor(Math.random()*4)]+24,t+spb*0.5);
    stepN++; nextT+=spb/2;

}
function distCurve(k){
  var n=1024,c=new Float32Array(n),i,x;

    var o=ac.createOscillator(); o.type=p[1]; o.frequency.value=p[0]; o.detune.value=Math.random()*16-8;
    vibG.connect(o.detune); o.connect(mix); o.start();
  });

  var nbp=ac.createBiquadFilter(); nbp.type='bandpass'; nbp.frequency.value=900; nbp.Q.value=1.2;

    var box=document.createElement('div'); box.className='choices';
    [node.A,node.B].forEach(function(label,idx){

  if(has(t,/\b(stop|quiet|shut up|silence|hush)\b/)){ if(synth) synth.cancel(); cur=null; return say("As you wish. Silence... for now.",false); }

  if(cur && !isCmd){
    var c=t.replace(/[.,!?]/g,"");
    for(var pass=0;pass<3;pass++) c=c.replace(/^(option|number|choice|pick|choose|i choose|i pick|i'll take|i will take|take|go with|let's go with|lets go with|the|please)\s+/,"");
    if(has(c,/^(1|one|first|a|left)\b/)) return choose(0);

  }

  if(pendingQ && !isCmd){ var qq=pendingQ; pendingQ=null; return say(qq.r+maybeAsk(.25)); }

  if(has(t,/\b(poem|poe|lenore|leonore|recite|poetry)\b/)){ pendingQ=null; return say(POEM_INTRO+POEM+"\n\n...Lovely, isn't it? So cheerful."); }

  var num=t.match(/\b(1[0-4]|[1-9])\b/);

    var l=[]; for(var j=0;j<STORIES.length;j++) l.push((j+1)+". "+STORIES[j].t);
    return say("Fourteen tales wait in the dark:\n"+l.join("\n")+"\n\nSay a number or a name.");
  }
  if(num && (has(t,/\b(story|tale|number|tell|read)\b/) || t.length<4)) return startStory(parseInt(num[1],10)-1);
