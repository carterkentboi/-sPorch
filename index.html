you|your birthday|when were you born|creator|carter)\\b/.test(t)){return say(\"Pumpkin Man's birthday is October 31st, 2026, early morning, after the sun came up. His creator, Carter, was so tired she forgot the exact time. She pushed straw into overalls, carved a pumpkin face, blew magic dust on him, made a wish, and poof, a voice. He's positively mystified by the whole thing.\");}\n _r(input);\n};\nvar cs=document.getElementById('chips');Array.prototype.slice.call(cs.children).forEach(function(b){if(/Poe|Coloring/.test(b.textContent))b.remove();});\n[[\"\ud83d\udc9b Affirmation\",\"affirmation\"],[\"\ud83d\udcdd Gratitude journal\",\"gratitude\"],[\"\u23f0 Time & date\",\"what time is it\"],[\"\u270f\ufe0f Margaret draws\",\"margaret draw\"],[\"\ud83d\udce5 Export journal\",\"export journal\"]].forEach(function(c){var b=document.createElement('button');b.type='button';b.textContent=c[0];b.onclick=function(){noteActive();add(c[0].replace(/^\\S+\\s/,''),'me');setTimeout(function(){reply(c[1]);},300);};cs.appendChild(b);});\nvar cv=document.getElementById('dcv'),cx=cv.getContext('2d'),dc=\"#c0392b\",dn=false,mt=null;\n[\"#c0392b\",\"#e0641f\",\"#f2b84b\",\"#2e7d32\",\"#1e88e5\",\"#5e35b1\",\"#212121\"].forEach(function(c){var b=document.createElement('button');b.type='button';b.className='sw';b.style.background=c;b.onclick=function(){dc=c;};document.getElementById('dpal').appendChild(b);});\nfunction clr(){cx.fillStyle=\"#fffdf5\";cx.fillRect(0,0,340,300);}clr();\nfunction pos(e){var r=cv.getBoundingClientRect();return[(e.clientX-r.left)*340/r.width,(e.clientY-r.top)*300/r.height];}\ncv.onpointerdown=function(e){dn=true;var p=pos(e);cx.beginPath();cx.moveTo(p[0],p[1]);};\ncv.onpointermove=function(e){if(!dn)return;var p=pos(e);cx.strokeStyle=dc;cx.lineWidth=4;cx.lineCap=\"round\";cx.lineTo(p[0],p[1]);cx.stroke();};\nwindow.addEventListener('pointerup',function(){dn=false;});\nfunction W(v){return v+(Math.random()-.5)*8;}\nfunction ln(a,b,c,d,col){cx.strokeStyle=col;cx.lineWidth=4;cx.beginPath();cx.moveTo(W(a),W(b));cx.lineTo(W(c),W(d));cx.stroke();}\nfunction ci(x,y,r,col){cx.strokeStyle=col;cx.lineWidth=4;cx.beginPath();cx.ellipse(W(x),W(y),r,r*(.8+Math.random()*.4),0,0,7);cx.stroke();}\nvar SC=[[\"This is you. You're the big one. I gave you extra arms.\",function(){ci(170,120,40,\"#e0641f\");ln(170,160,170,230,\"#212121\");ln(170,185,120,160,\"#212121\");ln(170,185,230,150,\"#212121\");ln(170,185,100,200,\"#212121\");ln(170,230,140,280,\"#212121\");ln(170,230,200,280,\"#212121\");}],\n[\"This is the porch. This is Pumpkin Man. He's the orange part.\",function(){ln(30,230,310,230,\"#5e35b1\");ci(150,170,45,\"#e0641f\");ln(150,125,150,105,\"#2e7d32\");ln(100,200,60,260,\"#212121\");}],\n[\"This is the snowman. He doesn't exist yet. I drew him anyway.\",function(){ci(170,230,50,\"#1e88e5\");ci(170,160,35,\"#1e88e5\");ci(170,110,24,\"#1e88e5\");ln(170,110,205,115,\"#e0641f\");}],\n[\"This is a very large turkey. It is also the sun. Both can be true.\",function(){ci(170,150,60,\"#f2b84b\");for(var i=0;i\u003c8;i++){var a=i*.785;ln(170+Math.cos(a)*70,150+Math.sin(a)*70,170+Math.cos(a)*100,150+Math.sin(a)*100,\"#c0392b\");}}]];\ndocument.getElementById('dMar').onclick=function(){clr();var s=pick(SC);document.getElementById('dcap').textContent=\"Margaret: \"+s[0];s[1]();};\ndocument.getElementById('dClr').onclick=clr;\ndocument.getElementById('dX').onclick=function(){document.getElementById('drawModal').style.display='none';};\ndocument.getElementById('dSave').onclick=function(){cv.toBlob(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='margaret-drawing.png';document.body.appendChild(a);a.click();a.remove();});};\nwindow.openDraw=function(){document.getElementById('drawModal').style.display='flex';};\n})();\n\u003c/script>\n\u003cscript>\n(function(){\nSTORIES.length=0;seen={};\nfunction S(t,x){STORIES.push({t:t,k:t.toLowerCase().split(/\\W+/).filter(function(w){return w.length>3;}),n:{\"\":{x:x}}});}\nfunction C(t,x,A,B,a,b){STORIES.push({t:t+\" (you choose)\",k:t.toLowerCase().split(/\\W+/).filter(function(w){return w.length>3;}),n:{\"\":{x:x,A:A,B:B},\"a\":{x:a},\"b\":{x:b}}});}\nS(\"Margaret and the Sock Drawer\",`Margaret says this really happened, and Margaret has never lied, only exaggerated with confidence.\\n\\nOne morning she decided the sock drawer was a small, dark country, and that she was its rightful queen. She climbed in. She wore a sock as a cape. She declared a law: all socks must be warm, and all feet must be happy.\\n\\nPumpkin Man found her an hour later, ruling happily over forty socks. He bowed. She knighted him with a mitten. Then they had tea, which is pretend, because neither of them has a stomach.\\n\\nThe moral, Margaret says, is that you can be a queen of something small and it still counts. Pumpkin Man says the moral is to stop hiding his good socks. Both can be right.`);\nS(\"The Badger Who Hosted Dinner\",`Once there was a badger named Ferdinand who decided to host Thanksgiving, even though his burrow fit exactly one badger and a large spoon.\\n\\nHe invited a fox, a hedgehog, two moles, and a very nervous owl. Everyone arrived at once. The burrow filled with elbows. The fox sat on the hedgehog, who didn't mind, being spiky and philosophical about it.\\n\\nThe food was mostly acorn soup, and a little too salty. Ferdinand apologized four times. The owl raised a wing and said, \"I haven't been invited anywhere in three years. The soup is perfect.\"\\n\\nFerdinand looked around at the crowded, happy mess of his small home and decided it was the biggest room he'd ever been in.`);\nC(\"Pumpkin Man Wraps a Gift\",`Pumpkin Man has one roll of wrapping paper and a gift shaped like a lamp, or possibly a violin. He stares at it. The tape is staring back.\\n\\nDo you tell him to use the whole roll, or tell him to try a bag?`,\"Use the whole roll\",\"Try a bag\",`He wraps the gift in the entire roll. It becomes a paper boulder the size of a loveseat. Margaret rolls it down the hall like a bowling ball and it knocks over a lamp, which was the gift, and which is fine, because the lamp was always going to be that kind of lamp. Everyone cheers. The boulder stays up until February.`,`He finds a bag, a good bag, with handles. The gift fits inside and he feels like a genius. Then he accidentally gives the bag away along with his keys. Margaret finds the keys in the compost. A lesser doll would hold a grudge, but she just says, \"That was a big win, ish.\"`);\nS(\"The Great Gravy Incident\",`Last Tuesday, the gravy boat tipped. Nobody knows why. Margaret blames the ghost, and the ghost blames Margaret, and the ghost does not exist, so the case is stalled.\\n\\nThe gravy slid across the table at a slow, deliberate pace, like a river with a plan. It paused at the napkins. It considered the salt. Then it moved on to the cat's tail, which the cat protested, loudly, in two languages.\\n\\nPumpkin Man grabbed a mop. Margaret grabbed a smaller mop. Together they cleaned the whole kitchen, bumping into each other and laughing so hard that nobody noticed the gravy had gone back in the boat on its own.\\n\\nIt was a very good Tuesday.`);\nS(\"Margaret's Music Box Concert\",`The music box is broken. It's missing one note, the high one, so every song has a little hole in it, like a sock with a hole in the toe.\\n\\nMargaret hums along anyway. She hums the missing note herself, a little flat, a little brave.\\n\\nOne night Pumpkin Man held up his phone and said, \"Do it again, I'm recording.\" Margaret said no. Then she said fine. She hummed the whole song, hole and all, and the porch went quiet in a good way.\\n\\nIt turns out the missing note was never the point. The point was the doll who was humming it. Pumpkin Man has listened to that recording four hundred times and he says it never gets old.`);\nC(\"The Raccoon Union\",`Deep in a suburb, a raccoon named Dolores calls a meeting. Fourteen raccoons attend. Their demands are simple: better bins, shorter nights, and a snack called \"the good kind\".\\n\\nDolores turns to you. Do you volunteer as the negotiator, or do you bring the snacks?`,\"Negotiate\",\"Bring snacks\",`You negotiate. It goes on for six hours. At the end, the humans agree to leave out one nice bin, and the raccoons agree to leave out one good fork. Both sides call it a draw, and Dolores gives you a tiny trophy she found in a gutter. You keep it on your shelf.`,`You bring the good kind of snack. The meeting dissolves into a cheerful feast. Dolores announces the union is \"mostly a book club now.\" Nobody argues. Somebody shares a pickle. It's the best-attended meeting in raccoon history.`);\nS(\"How the Snowman Almost Exists\",`The snowman isn't here yet, because it hasn't snowed, and it isn't cold enough, and honestly he'd rather stay where it's warm.\\n\\nBut he thinks about it. He thinks, what if I did exist? What would I be? A pile of snow with a carrot, mostly. And a hat. And an opinion about trends.\\n\\nHe decides that's not nothing. A pile of snow with a carrot, a hat, and opinions is a whole person. He doesn't have to love the cold to be worth building. He can love the sun and still be somebody's favorite thing in the yard.\\n\\nHe practices smiling. It goes pretty well. He's very round.`);\nS(\"The Bird Who Was Thankful for Nothing\",`A small gray bird once announced, \"I'm thankful for nothing,\" and felt relieved to have said it out loud.\\n\\nA squirrel overheard, and did not argue, which was kind. Instead the squirrel said, \"Fair. Want some of my acorn?\" The bird took it. It was a good acorn.\\n\\nThe next day the bird said, \"I'm thankful for one acorn.\" The day after, \"an acorn and a warm branch.\" By the end of the week the list was three pages long, and nobody had told the bird to write it.\\n\\nGratitude, it turned out, wasn't a rule. It was just what happened when somebody gave you an acorn without a speech.`);\nS(\"Pumpkin Man Learns the Leaf Blower\",`Pumpkin Man bought a leaf blower, because the neighbors had one, and he believes in keeping up with the Joneses at a respectful distance.\\n\\nHe pressed the button. The leaf blower roared. All the leaves left the yard at once and landed, in perfect formation, on the neighbor's porch. The neighbor came out in a robe, looked at his porch, looked at Pumpkin Man, and slowly began to laugh.\\n\\nThey spent the afternoon raking the leaves back, one by one, and talking about nothing. By dusk they were friends. The leaf blower sat in the shed, quietly pleased with itself.`);\nC(\"The Hedgehog's Pie Dilemma\",`A hedgehog named Biscuit has baked two pies at once, because he can't make decisions, and now he's standing in the kitchen with both of them.\\n\\nOne is apple. One is pumpkin. He looks at you with enormous hopeful eyes.`,\"Apple\",\"Pumpkin\",`You pick apple. Biscuit slices it, and it's warm, and it smells like every good fall afternoon at once. He eats his half and gives you the bigger half, which is how hedgehogs say thank you.`,`You pick pumpkin. Biscuit nearly cries, because pumpkin was his grandmother's recipe, and he's been afraid it wouldn't come out right. It did. He keeps the recipe card in his pocket for a month.`);\nS(\"Margaret Takes the Bus\",`Margaret says she took the bus once. Pumpkin Man says she did not, as she is a doll and the bus is very far away. Margaret says that's what the bus wants you to think.\\n\\nIn her account, she sat in the third seat from the back, next to a man holding a potted fern. They did not speak. At the fourth stop, the man handed her the fern to hold while he found his wallet. She held it with great ceremony. When he got off, he said, \"Thank you, miss.\" Nobody had ever called her miss.\\n\\nShe rode to the end of the line, then back, just to be useful. She is still very proud of her service.`);\nS(\"The Moose Who Apologized to a Tree\",`A moose named Gerald once walked into a tree, and without a moment's thought said, \"Oh, I'm so sorry.\"\\n\\nThe tree, being a tree, said nothing. Gerald waited a polite amount of time, then added, \"I really should watch where I'm going.\" The forest, which had been listening, murmured among itself that this was the nicest moose they had ever met.\\n\\nSince then, all the animals around Gerald have been a little gentler with each other. Nobody knows who started it. Gerald certainly doesn't. He just nods at the tree every morning, and the tree, in its own way, nods back.`);\nS(\"The Turkey Who Practiced Being a Cloud\",`A turkey named Dale decided one morning that he would be a cloud, because clouds seem relaxed and nobody asks them for anything.\\n\\nHe lay on the grass and drifted. A sheep walked by and asked what he was doing. \"Drifting,\" Dale said. The sheep considered this and lay down next to him. Then a goat. Then a very confused goose.\\n\\nBy noon, there was a whole sky of animals on the lawn, drifting. Nobody was trying to be anything. It was one of the finest afternoons the farm had ever had, and the actual clouds, passing overhead, gave a small and approving thumbs-up.`);\nC(\"Margaret's Gift Exchange\",`Margaret has organized a gift exchange. The rules are: everyone brings one gift, no one may look at the gift, and she gets to pick first. These are the rules because she wrote them.\\n\\nShe holds up two boxes. One rattles. One hums.`,\"The rattler\",\"The hummer\",`You pick the rattler. Inside is a single button and a note that says, \"For luck.\" You sew it onto your favorite sweater, and honestly, the sweater has never looked better.`,`You pick the hummer. Inside is a tiny music box, broken in exactly one place. It plays a song with a hole in it, and somehow that's the best part. Margaret watches your face and pretends not to care.`);\nS(\"Pumpkin Man and the Last Slice\",`There was one slice of pie left. It was a good slice, with the crust still crisp and a little extra filling on the corner.\\n\\nPumpkin Man looked at it. Margaret looked at it. The snowman, who does not exist yet, also looked at it, in spirit.\\n\\nPumpkin Man cut it in three. Not evenly, because he's a pumpkin and not a surgeon, but close. They ate it standing at the counter, out of their hands, in total silence. It was the best pie any of them has ever had, and none of them could tell you why. Margaret says it's because nobody hoarded it. Pumpkin Man says it's because it was pie.`);\nS(\"The Otters Who Held Hands\",`Otters hold hands when they sleep, so they don't drift apart in the current. This is a real fact, and it's also the whole story.\\n\\nOne evening, a young otter named Pip looked at the river, which was very big and very dark, and said, \"What if I drift?\" Her mother said, \"Then we'll find you.\" Her brother said, \"Then I'll tie you to me with kelp.\" Her grandmother, who had never once been in a hurry, said, \"Take my hand, sweetheart.\"\\n\\nPip took her hand. The river did what rivers do. And nobody drifted anywhere, all night, the whole family floating together under the moon.`);\nS(\"The Squirrel's Retirement Plan\",`A squirrel named Walter announced he was retiring from acorns. His friends asked what he'd do instead. \"Sit,\" said Walter. \"Just sit.\"\\n\\nHe sat for a week. By Wednesday, he'd counted every leaf on the oak. By Friday, he knew the birds by name. By Sunday, he'd discovered that sitting is a skill, and he was becoming quite good at it.\\n\\nOn Monday he went back to acorns, because he missed them, and because a retired squirrel who sits on an acorn pile is the happiest kind of squirrel.`);\nC(\"Margaret Opens a Bakery\",`Margaret has opened a bakery. Everything in it is made of felt. Her first customer is a very serious moth.\\n\\nThe moth points at two items on the shelf.`,\"The felt croissant\",\"The felt cake\",`The moth buys the croissant and carries it away like treasure. He comes back every day. Margaret starts putting a tiny bag aside for him, and calls him \"my regular,\" which is the nicest thing she has ever said.`,`The moth buys the cake and holds a birthday party on the windowsill. Nobody knows whose birthday it is. Everybody attends, and Margaret is paid in lint, which she accepts as legal currency.`);\nS(\"Pumpkin Man Gets Lost in His Own House\",`It was a small house. Pumpkin Man has lived there since Halloween. And yet, on Tuesday, he opened a door and found a closet he did not recognize.\\n\\nHe went in. There were coats. He went further. There were more coats. Margaret later found him in the dark, whispering, \"I think I'm in Narnia, but with fewer lions.\"\\n\\nShe led him out by the sleeve. He wasn't embarrassed, just grateful. And he made a note to get a bigger flashlight, and to clean out the coats, in that order, eventually.`);\nS(\"The Penguin Who Mailed Himself\",`A penguin named Orville got tired of waiting for the ice to move and decided to mail himself to a warmer climate.\\n\\nHe found a box. He wrote the address in careful flipper. He climbed in. The postal worker, who has seen many things, only asked, \"Fragile?\" and Orville said, \"A little.\"\\n\\nThree weeks later he arrived at a beach, slightly dizzy and extremely proud. He sent a postcard home that said, \"Wish you were here.\" Within a month, seven penguins had mailed themselves to join him. The postal service now has a special form.`);\nS(\"Margaret and the Lump in the Couch\",`There was a lump in the couch. It had been there for weeks. Margaret said it was a ghost. Pumpkin Man said it was a spring.\\n\\nOne night, Margaret sat on it on purpose. The lump went, \"mrrp.\" It was a cat. It had been living in the couch the whole time, quietly, paying no rent.\\n\\nPumpkin Man and Margaret held a very short meeting. The cat became a roommate. He's called Lump. He doesn't contribute, but the couch is much warmer, and nobody ever sits alone.`);\nC(\"The Bear Who Couldn't Pick a Cave\",`A bear named Marguerite is looking for a place to hibernate, and every cave has a problem. One is drafty. One is cozy but has a bat who talks in his sleep.\\n\\nShe turns to you and asks what you think.`,\"Drafty cave\",\"Cave with the bat\",`You say drafty. Marguerite brings a quilt, six pillows, and a small heater powered by a hamster wheel. By December it's the coziest cave in the forest, and all the neighbors want one just like it.`,`You say the bat cave. Marguerite sleeps with his mumbling in the background. By January she knows all his dreams. They are mostly about soup. In spring, they part as friends, and he sends her a recipe.`);\nS(\"The Day the Snowman Almost Showed Up\",`It got a little cold on Tuesday. The snowman felt it first, a little shiver in a place he didn't technically have yet.\\n\\n\"Is it time?\" he asked the porch. The porch said nothing. \"I'm not ready,\" he said. \"I'm too warm-hearted for this.\"\\n\\nThen the cold went away and the sun came back. The snowman breathed out and went back to not existing. He was relieved, but also a little sad, because he'd felt, for a second, what it was like to almost be someone.\\n\\nHe decided that was a fine thing to have felt.`);\nS(\"Pumpkin Man's Gratitude Jar\",`Pumpkin Man keeps a jar. Every night, he writes one small thing on a slip of paper and drops it in.\\n\\n\"A warm blanket.\" \"Margaret hummed today.\" \"The mailman waved.\" \"I did not trip.\" \"Somebody said good morning and meant it.\"\\n\\nOn the last night of the month, he empties the jar onto the kitchen table and reads every one out loud. By the end he's a little misty, which is hard to do with a carved face.\\n\\nIt was never about the big things. It was about how many small ones there turned out to be.`);\nS(\"The Capybara Hot Spring Committee\",`The capybaras formed a committee to decide who gets the best spot in the hot spring. The meeting lasted four hours. Nothing was decided. Nobody minded.\\n\\nA duck sat on a capybara's head. A monkey took notes in the steam. The chair of the committee fell asleep and was elected again anyway.\\n\\nIn the end, they all agreed that the best spot was wherever you happened to be, and that the only rule was no splashing before sundown. The minutes were never filed, but everyone remembers the meeting as a triumph.`);\nS(\"Margaret Gets Her Song on the Radio\",`Pumpkin Man finally sent Margaret's music box humming to a very small radio station. They played it at 3 a.m., between a weather report and an ad for a mattress.\\n\\nMargaret was awake. She heard it, her own voice humming that song with the missing note, drifting out of a speaker in the kitchen. She didn't say anything for a long time.\\n\\nThen she said, \"That's a little flat.\" Pumpkin Man said, \"It's perfect.\" She said, \"It's a little flat and it's perfect.\" And they listened to the end, side by side, in the dark.`);\nS(\"The Long Table\",`On Thanksgiving morning the table is already long, and by noon it has grown a second table, and by two o'clock it is a small, friendly runway. Nobody planned this. Chairs simply arrive. A neighbor you have never met shows up carrying a casserole and an apology for being early, and nobody has the heart to tell him he is exactly on time.\\n\\nSomeone passes you the rolls. Someone tells a story about 1998 that is clearly not true, and everyone agrees it is the best one. The dog sits under the table in a state of perfect prosperity.\\n\\nAround four, the light goes gold and falls across forty mismatched plates. Every person here was, at some point this year, a little lost. And every one of them found the table anyway.\\n\\nThere is one seat left. It has your name on it, in gravy, which is the most sincere ink there is.`);\nfunction X(i,t){STORIES[i].n[\"\"].x+=\"\\n\\n\"+t;}\nX(0,`The next morning, the sock drawer held an election. The mittens, who had been left out of the kingdom, formed an opposition party. They said the queen had favored the wool. Margaret listened with great seriousness, then declared that mittens and socks were both warm things for the body, and therefore, in the eyes of the law, cousins.\\n\\nThat settled it. A tiny parade followed. A striped sock carried the banner. A single glove, who had lost its partner years ago, was given a place of honor at the front, and wept openly. Margaret saluted it and said, \"You're not missing a pair. You're a whole glove, doing your best.\"\\n\\nPumpkin Man watched from the doorway with a cup of pretend tea and a large, unguarded smile. He has asked her several times to write down the drawer's constitution. She says it's mostly \"be warm\" and \"no moths\", and she'd rather keep it in her heart.\\n\\nThat night, the drawer was quiet. Margaret curled up in the sock cape, the cousins snug around her. She said, to nobody in particular, \"I think I'll keep being queen. It's small, but it's mine, and it's warm.\" Pumpkin Man turned off the light and said, \"Goodnight, Your Majesty.\" She pretended not to hear. But she smiled all the way through the dark.`);\nX(1,`Halfway through dinner, the fox stood up, which was a mistake in a burrow, and hit his head on the ceiling. Everybody gasped. Then the fox said, \"I'd like to make a toast,\" and kept standing, bent over, like a very proud question mark.\\n\\n\"I've never been to a dinner like this,\" he said. \"Where I'm from, you eat quickly and you watch the door. Tonight I took my time, and I didn't watch the door once.\" The moles sniffled. The hedgehog nodded slowly and said, \"That's the most important thing anyone has said this year, and it's only November.\"\\n\\nThen the owl, who had not spoken much, told a story about a pine tree that grew so tall it learned to hear the moon. It had no moral. Nobody needed one. Everybody simply sat in the warm, salty dark and listened.\\n\\nWhen the night was over, nobody wanted to go home, so they didn't. They lay down in a big, soft pile, fox on hedgehog on mole on mole, and Ferdinand stood watching them with his large spoon.\\n\\n\"The burrow's t t the end of the night, the moth found her at the register and left a single piece of lint on the counter. \"Keep the change,\" he seemed to say. She tucked it carefully into her drawer, among her most valuable things.`);\nX(18,`The following week, Pumpkin Man did clear out the coats. It took three days and a great deal of sighing. He found a hat that wasn't his, a map of somewhere he'd never been, and a mitten that was suspiciously warm. Margaret watched from the stairs, taking notes.\\n\\n\"I'm learning,\" he said. \"I'm becoming a person who knows where his closets are.\" She said, \"That's very brave.\" He said, \"It's very dusty.\" Together, they hung up three of the coats and donated the rest to the porch, where they've become a kind of local landmark.\\n\\nThat night, he kept the bigger flashlight on the nightstand, just in case. He never did get lost again. But he liked knowing the light was there.`);\nX(19,`The postcard reached home in mid-November, and the whole colony crowded around it on the ice. \"Wish you were here,\" read the elder penguin slowly, \"which is, honestly, rude.\" But she smiled. She'd always liked Orville. He'd always done things differently.\\n\\nThe next week, three more penguins arrived at the beach, damp, stunned, and wearing sunglasses someone had mailed them. They stood in the sand, looking out at the water, the long waves rolling in. \"It's so warm,\" one whispered. \"It's so loud,\" said another. Orville nodded. \"You get used to it,\" he said, \"and then you never want to leave.\"\\n\\nThat evening, the whole colony sat in a row on the sand, watching the sun go down, nobody speaking, flippers just touching.`);\nX(20,`Lump, it turned out, had opinions. He preferred the left cushion. He refused to be pet before noon. He had a particular way of looking at Margaret, with half-lidded eyes, as though to say, \"I know exactly what you did, and I forgive you.\"\\n\\nMargaret and Lump developed a rapport. She read him bedtime stories. He  and a turkey and a doll. Nobody knew where she had heard of them. Everybody clapped anyway.\\n\\nBy the end of the night, the candles had burned low and the table was a landscape of crumbs and crumpled napkins. People drifted out in ones and twos, carrying leftovers in foil. The neighbor with the casserole was the last to go. At the door he said, \"I'm glad I was early.\" The host said, \"You were right on time.\"\\n\\nThe table stood alone in the dark, full of the warm outline of everyone who'd been there. And in the quiet, the house sighed, the way a house does when it's been well used.`);\nvar LT=STORIES.length;\nS(\"Black Friday: Where the Name Came From\",`Pumpkin Man would like to set the record straight about Black Friday, because he has heard a story that is not true.\\n\\nThe popular tale says stores earned enough on this day to go from red ink to black ink. It sounds tidy, and it's a myth. The real origin is in Philadelphia, in the 1950s and 60s, where police used the phrase for the day after Thanksgiving, when crowds of shoppers and football fans choked the streets. Officers worked long shifts, and nobody was happy.\\n\\nStores later noticed the name and gave it a sunny spin. So the day is named after a traffic jam. Pumpkin Man finds this very comforting.`);\nS(\"Black Friday: The Cabbage Patch Winter\",`In 1983, before the internet, a doll was the most wanted thing in America. They were called Cabbage Patch Kids, and each one came with its own adoption papers and birth certificate. Every one had a slightly different face.\\n\\nParents lined up before dawn. Stores ran out in hours. People drove across state lines to chase rumors of a shipment. Some stores saw real shoving, and managers hired extra help just to keep the aisles orderly.\\n\\nMargaret was not there, but she has strong opinions about it. She says the dolls are lovely, and that she would have waited in line too, for the papers alone. Pumpkin Man says that's the most Margaret thing he's ever heard.`);\nS(\"Black Friday: Elmo Fever\",`In 1996, there was a toy that giggled when you squeezed it. It was Tickle Me Elmo, and it was supposed to be a nice Christmas present.\\n\\nStores ran out within days. The toy became so scarce that resale prices went far beyond what it cost on the shelf, and news crews covered store openings as if they were weather events. Some shoppers pushed to the front, and there were scuffles in a few stores.\\n\\nIn the end, Elmo got everybody's attention and gave nobody a lasting grudge. The truth is, a lot of kids just wanted something soft that laughed. Pumpkin Man understands. He's been wanting that too.`);\nS(\"Black Friday: The Lawn Chair Line\",`Before websites, there was the newspaper. On Thanksgiving, a thick stack of store ads arrived with the turkey leftovers, and families spread them across the kitchen table with markers.\\n\\nSomeone circled the television. Someone circled the waffle iron. Then, in the dark, people packed thermoses and lawn chairs and drove to the store parking lot before the sun was up. They wore three coats. They traded snacks. Strangers shared blankets.\\n\\nWhen the doors finally opened, the line surged, laughing, a little frantic, a little festive. Pumpkin Man says the best part was never the deal. It was the sleepy, giddy company in the parking lot at 4 a.m. Nobody was alone out there.`);\nX(27,`One more thing, says Pumpkin Man. Philadelphia's police were not the only ones who dreaded the day. Bus drivers, shop owners, and even the football fans themselves complained about the crush. The name started as a grumble, a way of saying \"brace yourself.\" It took decades for a marketing department to look at a grumble and see a banner.\\n\\nThat's the lesson, he says. Nearly everything that starts as a complaint can turn into a tradition, given enough time and a good coat of paint. Even a traffic jam. Even a turkey in a costume.`);\nX(28,`Years later, grown-ups would trade stories about those dolls over coffee. \"I got mine in '83,\" one would say, proudly, as if announcing a medal. \"Mine had red hair and freckles,\" another would say, \"and I named her Constance.\" The dolls, in closets and attics and glass cases, are still out there, quietly holding the memory of a very large winter.\\n\\nMargaret says she understands. She says every doll deserves a name and a home and a set of papers, and she is working on her own. Pumpkin Man says she doesn't need papers. She is, in every way that matters, legitimately adopted.`);\nX(29,`When it was over, the kids who got the Elmo hugged him until he laughed too loudly to hear. The ones who didn't got something else, a puzzle, a pair of socks, a book of riddles, and by New Year's, most of them had forgotten what they'd wanted so badly. What stayed was the feeling of the season, the busy hallways, the mysterious wrapped boxes, the grown-ups whispering in kitchens.\\n\\nPumpkin Man says it's worth remembering. The thing everybody wants is rarely the thing that stays. The thing that stays is the people in the room, laughing at a toy that laughs.`);\nX(30,`And when the doors opened, the line didn't just surge, it flowed, like one long creature, all sleepy and hopeful. Inside, the fluorescent lights hummed, and the aisles smelled of cardboard and new carpet. People grabbed what they came for, but many just stood, blinking, a little stunned by the light.\\n\\nOn the way out, the parking lot was gray with dawn. Folks sat on tailgates sharing the last of the coffee, comparing hauls, laughing at nothing. A man handed a stranger his scarf. A child fell asleep on a stack of bags.\\n\\nPumpkin Man says that's what he remembers best. Not the sales. The morning after, when everyone was tired and warm and strangely proud of having done something silly together.`);\nvar N0=LT-1;\nfunction tgd(){return thanksgiving(new Date().getFullYear()).getDate();}\nfunction dayN(){var m=/[?&]day=(\\d+)/.exec(location.search);if(m)return +m[1];var n=new Date . It's going great. Don't touch the feathers.\",\"Pumpkin Man has been thinking. If the costume comes off, who's under it? ...A pumpkin. It's always a pumpkin. Back to business.\",\"*mutters* Might get a head start on the Christmas costume shopping. Reindeer ears. Maybe a bell. Very reasonable.\",\"How does the Easter Bunny do it? The eggs, for the Cadbury commercials. Pumpkin Man has been planning to ask for years. He has a list of questions and a very small notebook.\",\"I watched too many TikToks. My eyes are bleeding a little. My brain is a puddle. It's a warm puddle, though, so that's something.\",\"This turkey is so glad he is not in a shipping container with ten thousand other turkeys. Porch. Pillow. Five stars.\",\"You still there? Good. Pumpkin Man is just going to keep talking. He finds it helps.\",\"Picture an elephant crossing the highway. Everybody pulls over. Everybody films. That's a nice thought.\",\"If you're listening, thank you for keeping me company. If you're not, thank you for being a good house plant.\"];\nvar MARG=[\"Margaret has the Santa hat on. It covers her whole body. She's navigating by memory.\",\"Margaret is humming into the broken music box again. It's honestly good. Pumpkin Man keeps telling her to record it.\",\"Margaret updated her naughty and nice list. Pumpkin Man is on it twice. Once for each category, she says.\",\"Margaret is wearing an elf hat and a Santa hat. She says it's called layering.\",\"Margaret fell off the couch. She's fine. She says the floor needed company.\"];\nvar SNOW=[\"The snowman isn't here yet. It hasn't snowed. He's okay with that. He prefers warm weather, which makes him a complicated snowman.\",\"Somewhere out in the future yard, a snowman is practicing his smile. It's going well. He's very round.\",\"The snowman would like you to know he hates trends. He'd like that on the record.\"];\nvar pool=[],nextAt=0,la=Date.now();\n['pointerdown','keydown','touchstart'].forEach(function(ev){document.addEventList t. Inside is a spare key and a note: \\\"For next time. Love, the universe.\\\" You laugh for a full minute, tuck it into your pocket, and feel oddly taken care of by a very small, very anonymous box.\",\"You leave it until morning. In the morning, the box is gone, and in its place is a muffin, still warm. You decide not to investigate. Some gifts are better when you only say thank you.\"]});\nBR(5,{a:[\"As you walked home with your tiny trophy, a small voice asked from a hedge, \\\"Excuse me, do you have a minute?\\\"\",\"Listen\",\"Keep walking\",\"It's Gus, the ukulele raccoon. He needs one more verse for the trash can song and can't find the rhyme. You sit with him on the curb until you land on one together. It isn't great. It's perfect. He sings it for the whole street.\",\"You keep walking, politely, and wave. Behind you, the hedge says, \\\"No worries, I'll figure it out!\\\" A minute later you hear a ukulele find a rhyme. You smile the whole way home and feel, strangely, like you helped anyway.\"],b:[\"Before you left, Dolores pressed a small scroll into your hand. It said, in tiny letters, \\\"MEMBERSHIP.\\\"\",\"Join\",\"Politely decline\",\"You join. You're member number fifteen. The benefits include one free pickle, a secret handshake that's mostly sniffing, and a standing invitation to every future meeting. You wear the little badge on your coat for the rest of the season.\",\"You decline, kindly. Dolores nods and says, \\\"Honorary raccoon, then.\\\" She gives you a small salute, and every raccoon in the neighborhood waves when they see you from then on. Nobody ever asks you to pay dues.\"]});\nBR(9,{a:[\"Biscuit glanced at the pumpkin pie, still waiting on the counter, looking a little left out.\",\"Eat it too\",\"Save it for tomorrow\",\"You eat both, slowly, in alternating bites, like a very serious judge. By the end, you and Biscuit are lying on the kitchen floor, full, quiet, and perfectly content. He says, \\\"This is the best Tuesday of my life.\\\" It isn't Tuesday. Neither of you corrects him.\",\"You save it. The next morning, Biscuit leaves a note on the pie that says \\\"Good morning, you're even better cold.\\\" You eat it for breakfast on the porch, in your coat, while the first frost glitters on the grass.\"],b:[\"Biscuit set down his fork and asked, shyly, if you'd like to learn his grandmother's recipe.\",\"Yes, please\",\"Just watch\",\"You learn it. You roll the dough and pinch the crust, and flour ends up in places flour shouldn't. Biscuit narrates every step, laughing. When it comes out, it's lopsided and glorious. You write the recipe on a card, in your own handwriting.\",\"You watch. Biscuit tells stories while he works, about his grandmother's hands, her radio, the way she hummed off-key. By the time the pie is done, you feel like you've known her. He gives you the first slice and a long, grateful look.\"]});\nBR(13,{a:[\"Margaret said you could keep the button if you answered one question: what was the best part of today?\",\"The company\",\"The pie\",\"You say the company. Margaret goes very still, then adjusts her Santa hat and says, \\\"Acceptable.\\\" That's her highest rating. She insists you stay for tea, which is pretend, and which is the best tea you've ever had.\",\"You say the pie. Margaret nods gravely and says, \\\"A person of taste.\\\" She disappears and returns with a tiny plate, which holds a crumb. \\\"The last of it,\\\" she says. You eat the crumb with great ceremony.\"],b:[\"Margaret slid another box across the table, grinning. \\\"There's a third,\\\" she said. \\\"It's for emergencies.\\\"\",\"Open it\",\"Wrap it back up\",\"You open it. Inside is a folded note: \\\"You're doing better than you think.\\\" Margaret pretends to be very busy with her hat. You fold the note carefully and keep it in your wallet, where you'll find it on a day you need it.\",\"You wrap it back up, and Margaret approves. \\\"Emergencies only,\\\" she says. You put it on the shelf, where it sits, quietly reassuring, for the rest of the winter. You never have to open it. Knowing it's there is plenty.\"]});\nBR(17,{a:[\"One morning, the moth didn't show up for his croissant.\",\"Go look for him\",\"Save his croissant\",\"You find him on a windowsill across the street, napping in the sun, a little crumb on his chin. He wakes up, startled, then very embarrassed. You walk him back to the bakery. Margaret gives him a double croissant and doesn't mention it again.\",\"You save his croissant under a little felt dome. At noon, he shows up, breathless, apologizing in flutters. Margaret lifts the dome with a flourish. \\\"Fresh as ever,\\\" she says. It isn't, because it's felt. He cries a little anyway.\"],b:[\"The beetle in the bow tie approached the counter and asked, shyly, if the bakery could make a wedding cake.\",\"Of course\",\"Suggest a small one\",\"You say of course. Margaret sews for three days. The cake has seven layers, a tiny sugar-less bride, and a groom with a very serious mustache. The whole garden comes. The moth cries into his thimble of punch. Margaret is declared the best baker in the county.\",\"You suggest a small one. Margaret makes it the size of a button. The beetle and his bride feed it to each other with great ceremony. Everyone agrees it was the most perfect wedding they've ever attended, and nobody got too full.\"]});\nBR(21,{a:[\"A very cold wind came through the cave in the night, whistling like a tea kettle.\",\"Add another quilt\",\"Invite the neighbors in\",\"You add another quilt. Then another. By midnight, Marguerite is a warm, rumbling hill under six layers, and the wind gives up and goes whistling elsewhere. In the morning, she wakes to find the quilts arranged in a heart, and she has no idea who did it.\",\"You invite the neighbors. A badger, two foxes, and a very damp squirrel shuffle in and curl up around her. Nobody says much. Body heat does the rest. In the morning, the cave smells like pine and wool, and everyone agrees to do it again next year.\"],b:[\"Late in the night, the bat started talking in his sleep, whispering about a door he couldn't find.\",\"Ask about it\",\"Go back to sleep\",\"You ask. The bat, half awake, murmurs that the door is in a field of glowing clover, and the knob is made of a pear. Marguerite writes it down. In the morning, the bat doesn't remember, but he's very pleased to hear he dreamed of pears.\",\"You go back to sleep. In the morning, the bat tells you, vaguely, that he dreamed of a door. He doesn't know where it led. Marguerite pats his head. \\\"Maybe tonight,\\\" she says. You both spend the day wondering, and it's a pleasant, quiet day.\"]});\nvar SE=[\"Then, quite unexpectedly, the KW sneezed, and everyone politely pretended not to notice.\",\"Meanwhile, somewhere nearby, a tiny kettle began whistling a tune about the KW.\",\"It was, everyone agreed later, the most KW-ish day in the history of the neighborhood.\",\"And so the KW did the only sensible thing: it sat down and had a snack.\",\"A very polite breeze arrived just then, carrying the smell of warm bread and the sound of someone humming.\",\"Nobody could say why, but the KW suddenly felt braver than it had all week.\",\"A small, unnamed animal peeked out from behind the KW and gave a thumbs-up, or what passes for one.\"];\nvar SQ=[\"What happens next?\",\"How does that feel for them?\",\"What's the weather doing?\",\"Who else is here?\",\"What do they say out loud?\",\"What do they notice that nobody else does?\"];\nfunction bag(a){var q=[];return function(){if(!q.length)q=shuffle(a);return q.pop();};}\nvar EV=bag([\"Suddenly the {k} developed a very strong opinion about soup and refused to discuss it further.\",\"At that exact moment, forty-one tiny ducks in tiny coats arrived and wept with joy about the {k}.\",\"The {k} cleared its throat, because nobody told it that it was allowed to speak, and said, \\\"I've been meaning to say this for years: I love a sandwich.\\\"\",\"A trapdoor op  carrot? Nice nose. I'm just saying it before the reindeer does.\",\"Why do reindeer wear antlers? Their ears get cold, and their hats wouldn't fit.\",\"Santa's name rearranges into Satan, and Pumpkin Man rearranges into... nothing. He is a pumpkin. He's very stable.\",\"What's a reindeer's favorite kind of music? Anything with a good sleigh-lection.\",\"Why was the snowman so grouchy? He was sick of people getting up in his face, and also it was seventy degrees out.\",\"What do you call a reindeer who's way too happy? Brimble.\",\"Why did the pie go caroling? It heard the neighbors were in a crust.\"];\nvar Fd=[\"Historians generally place Jesus's birth somewhere around 6 to 4 BCE, because Matthew says it happened while Herod the Great was king, and Herod died in 4 BCE. Our calendar was set in the 500s by a monk named Dionysius Exiguus, and he miscounted by a few years.\",\"Only two of the four Gospels, Matthew and Luke, tell a birth story at all. Mark and John begin elsewhere. Luke has the manger and the shepherds. Matthew has the wise men and Herod.\",\"The Bible never gives a date for the birth. December 25th shows up in a Roman calendar from 354 CE. Scholars still debate why: one idea counts nine months from a March 25th date of the Annunciation, and another points to a Roman winter festival of the sun already on that date.\",\"Matthew says 'wise men from the east' brought gold, frankincense and myrrh. It never says there were three. That number was a later tradition drawn from the three gifts.\",\"The real St. Nicholas was a bishop in Myra, in what is now Turkey, around the 300s. He was remembered for giving gifts in secret. Over centuries that story drifted through the Dutch 'Sinterklaas' into Santa Claus.\",\"Christmas was once banned in parts of America. The Massachusetts Bay Colony outlawed celebrating it from 1659 to 1681. The US did not make it a federal holiday until 1870.\",\"In 1843, Charles Dickens published A Christmas Carol, and a man in London named Henry Cole printed the first commercial Christmas cards. Gift giving and Christmas started marrying each other around then.\",\"By the late 1800s, department stores were dressing their windows for Christmas and putting Santas inside. In 1939 a Chicago store, Montgomery Ward, handed out a booklet starring a reindeer with a red nose that its copywriter Robert May made up. That's how Rudolph began, as a retail giveaway.\",\"Santa in red existed long before soda ads, but Coca-Cola's illustrations in the 1930s by Haddon Sundblom helped fix the round, jolly look in everyone's head.\"];\nS(\"Dolphins Have Christmas Too\",\"dolphin dolphins sleigh mermaid underwater ocean\",\"Far under the waves, where the water is the color of blue velvet, it is Christmas Eve too. Eight dolphins in tiny Santa hats line up in front of a sleigh made from a giant sea-glass shell. The lead dolphin, Gerald, has been practicing his 'Ho ho ho' and keeps blowing bubbles instead. The mermaids string lights made of glowing jellyfish along the reef, and an old mermaid hangs one stocking on a sunken lighthouse.\\n\\nAt midnight the sleigh rises through the kelp, delivering smooth shells, lullabies, and exactly one perfect pearl to anyone who is lonely. Nobody sees it. They just wake up feeling a little less alone, and a little rocked.\\n\\nPumpkin Man would like it noted that dolphins in hats are a better idea than reindeer. Do not tell Brimble.\");\nS(\"The Pot With No Name\",\"help helping soup kindness stranger giving\",\"On the coldest morning of the year, an old woman finds a pot of soup on her step, still warm, with a note: 'No need to return the pot.' She never learns who left it.\\n\\nThe next day she knits six scarves and leaves them on the bus stop bench. A boy takes one and leaves a drawing. The bus driver tapes the drawing to his dash and gives his lunch to a stranger.\\n\\nBy the end of the week half the town has given something away and nobody can say who started it. Everyone feels strangely rich. Nobody asks for a thing back, which turns out to be the whole trick.\");\nS(\"The Long Slow Dinner\",\"dinner family slow table human\",\"The turkey is a little dry, one chair wobbles, and Uncle Ray tells the story about the flat tire again. Nobody checks a phone. For once nobody hurries.\\n\\nYou catch yourself thinking you should have cooked better, been further along, been someone different by now. Then a small cousin hands you a dinner roll like it's treasure. You take it. You decide that being here, exactly as you are, is plenty. You don't have to earn the chair.\\n\\nThe candle burns down slow, and so do you, which is allowed.\");\nS(\"White Elephant on the Porch\",\"white elephant gifts snowman margaret exchange\",\"Pumpkin Man announced a white elephant exchange, which is a gift game. Everybody brings one wrapped present. You take turns either opening a new one or stealing one someone else already opened, and the stranger and funnier the gifts, the better. Steal too much and it gets very dramatic.\\n\\nPumpkin Man gave the Snowman a scarf stitched with tiny bats. Haunted, but warm, and machine washable. The Snowman gave Margaret a set of ghost-shaped mittens for her doll army, which only whisper compliments. Margaret gave Pumpkin Man a knitted witch-hat cozy for his stem and a candle that smells like pie.\\n\\nThen Margaret stole the bat scarf. The Snowman stole it back. Pumpkin Man said nobody could steal it a third time, which is a rule he invented right then. Everyone left with something warm and slightly haunted. That's a good gift.\");\nS(\"Brimble\",\"brimble reindeer purple nose\",\"A reindeer named Brimble arrived on the porch with a purple nose, a green scarf, and more joy than anyone had asked for. 'HELLO! I LOVE IT HERE! IS THAT A SNOWMAN? I LOVE HIM!'\\n\\nThe Snowman, who is freezing and grumpy and hates surprises, said, 'Please. Lower the volume.' Brimble lowered it to a stage whisper, which was still a stage. 'OKAY! LOWER! I'M LOWER!'\\n\\nBy the end of the week, the Snowman was secretly saving the last carrot slice for him. He will deny it. Brimble already knows.\");\nS(\"The Snowman's Snow Day\",\"snowman snow beach west coast grumpy\",\"It snowed on a random Tuesday, and the Snowman woke up with an actual working body. Arms, legs, the whole thing. He was freezing, which was ironic, and he complained about it, which was expected.\\n\\nHe walked to the porch rail and stared at the horizon like an old man in a western. 'West coast,' he muttered. 'Beach. Sun. A folding chair.' A hippie wandered up with a flute and offered him a hug. 'Not today, friend,' said the Snowman, squinting. 'Not today.'\\n\\nThen it stopped snowing and he went back to being a rumor with a carrot. But he'd had a good Tuesday.\");\nS(\"Margaret's Pie Army\",\"margaret pie army doll pecan pumpkin haunted villages\",\"Margaret has been knitting elf hats for her imaginary doll army, all four hundred of them. They are, she explains, the finest pie delivery force in America. Their mission: carry fresh, warm pecan and pumpkin pies to every haunted village in the country, in time for Christmas.\\n\\n'Ghosts get lonely in December,' Margaret says. 'Somebody's got to bring the pie.' She stands guard at the porch rail, clipboard in hand, issuing orders to the empty air. Pumpkin Man salutes. The air, as far as anyone can tell, salutes back.\\n\\nSomewhere out there, a very surprised ghost just got a slice of pecan.\");\nS(\"A Door for Every Day\",\"door chocolate advent calendar germany childhood cardboard\",\"A family friend from Germany once gave a household a little cardboard Christmas tree, with a tiny door for every day of the month. Each morning you popped one open and there was a chocolate, a good one, because German chocolate is serious about itself.\\n\\nYou didn't eat them all at once. You'd open one door, hold the chocolate, and let the day get a little softer. By the end of the month the tree was a ring of open doors, each one a small yes.\\n\\nPumpkin Man keeps one of his own. It's cardboard, a little crooked, and very much loved. Say 'door' to open today's.\");\n/* ---- extra December jokes and facts ---- */\nJd.push(\"What do you get when you cross a snowman with a vampire? Frostbite.\",\"Why did the dolphin's sleigh have no brakes? Nobody asked it to stop, it was on a roll.\",\"What's Margaret's doll army's favorite carol? Deck the Halls With Bows of Pie-lly.\",\"Why did the reindeer bring a ladder to the party? He heard the drinks were on the roof.\");\nFd.push(\"The word Christmas comes from the Old English 'Cristes maesse,' meaning Christ's Mass. The X in Xmas isn't a dodge: it's the Greek letter chi, the first letter of Christ's name, and people have used it that way for about a thousand years.\",\"The poem 'A Visit from St. Nicholas,' published anonymously in 1823 and long credited to Clement Clarke Moore, is where Santa got his sleigh and eight named reindeer. Rudolph wasn't one of them yet.\",\"The song 'Rudolph the Red-Nosed Reindeer' was recorded by Gene Autry in 1949 and became a huge hit. The retail giveaway turned into a song, a movie and a whole industry. Christmas and shopping have been holding hands ever since.\");\nS(\"The Snow Shovel\",\"help helping neighbor shovel snow kindness stranger giving\",[\"Every morning after a big snow, somebody's walk is already clear. The old man at number nine figures it's the mailman. The mailman figures it's the teenager. The teenager figures it's the old man.\",\"It's all of them. Nobody ever says. They just keep pushing snow around for each other and tell no one, and the whole street runs on it like a quiet engine.\\n\\nPumpkin Man doesn't have hands, so he cheers from the porch. It counts.\"].join(\"\\n\\n\"));\nS(\"The Laugh That Would Not Quit\",\"joy laugh funny happy human\",[\"At the dinner table, somebody snorted milk. That was all it took. Then Grandma started wheezing, and the dog barked at the wheezing, and a kid fell off a chair, and nobody could breathe.\",\"It went on for ten full minutes, and no one remembers what was funny. What you remember is the feeling in your ribs and a room full of people who were completely, ridiculously okay. That's joy. It doesn't need a reason. It just shows up like a cousin.\"].join(\"\\n\\n\"));\nS(\"Being Human, Mostly\",\"human being human mistakes messy burn cookies\",[\"You burned the cookies. You also forgot a name, sent a text to the wrong person, and wore two different socks to the party. It was a full human day.\",\"Then somebody laughed with you, not at you, and handed you a cookie that wasn't burned. You realize everyone at the party is also winging it. You are not behind. You are a person, which is the whole assignment, and you are doing it.\"].join(\"\\n\\n\"));\nS(\"The Mermaid Market\",\"mermaid market underwater dolphin shells christmas\",[\"On the sea floor there's a Christmas market that opens at midnight. The mermaids sell shell ornaments and kelp wreaths, and a hermit crab runs a cocoa stand that is mostly warm seawater and optimism.\",\"Gerald the dolphin parks the sleigh out front, still in his little Santa hat, and takes two bubble-wrapped pearls to deliver. 'Nobody pays,' says the hermit crab. 'That's how you know it's Christmas.'\"].join(\"\\n\\n\"));\nvar Chat=[\"I've been thinking about dolphins again. Somewhere under the ocean there's a sleigh with eight of them in tiny Santa hats, and a mermaid reading a list. It's a good Christmas. It's very wet.\",\"Margaret has been up all night knitting elf hats for her doll army. All four hundred of them are going to deliver pies to haunted villages. She's got a clipboard.\",\"The snowman isn't here today. It didn't snow. He's a rumor with a carrot again, and he's fine, he says, which means he isn't.\",\"Brimble's out in the yard again, lowering his voice to what he thinks is a whisper. The snowman has asked him twice. It's a stage whisper. It has an audience.\",\"Margaret says the doll army has finished the pecan pies. The pumpkin ones are 'resting.' It's a haunted-village kind of rest.\",\"A snowman, if he had a body, would sit on a beach in California in a folding chair and be grouchy at everyone. I have heard him say this. He has a plan. It's a fine plan.\",\"Under the sea there is a mermaid version of the whole Christmas thing, and it has stockings made of kelp. I cannot prove this. I believe it with my whole stem.\",\"I got a little too excited about the white elephant exchange. I want to steal the bat scarf back. I'm told that's the point.\"];\nvar snow=((E.getMonth()+1)*31+E.getDate())*7%4===0;\nif(DEC){Chat.push(snow?\"It snowed today! The snowman has a working body for the day. He is freezing. He is also very pleased and will say he isn't.\":\"No snow today, so the snowman is just an idea standing by the fence. He's waiting. He's good at it.\");\n if(snow){var st=document.createElement('style');st.textContent='@keyframes pmsn{from{transform:translateY(-8vh)}to{transform:translateY(110vh)}}.pmf{position:fixed;top:0;z-index:2;pointer-events:none;color:#dfe6ee;opacity:.7;animation:pmsn linear infinite}';document.head.appendChild(st);for(var s=0;s\u003c16;s++){var f=document.createElement('span');f.className='pmf';f.textContent='❄';f.style.left=(Math.random()*96)+'vw';f.style.fontSize=(10+Math.random()*10)+'px';f.style.animationDuration=(9+Math.random()*9)+'s';f.style.animationDelay=(-Math.random()*12)+'s';document.body.appendChild(f);}}\n setA(JOKES,Jd);setA(FACTS,Fd);}\nelse{\n STORIES.length=0;\n S(\"The Photo Shoebox\",\"memory remember reminisce photos shoebox memories\",\"In a closet there's a shoebox of old photos, and tonight you take it down. A porch from a summer long ago. A blurry birthday. Someone laughing so hard their eyes are shut. You don't have to feel sad about it. You can just say hello to who you were, and let the warmth leak in.\\n\\nThen you pick up your phone and text one person from the box. 'Remember this?' A reply comes in four minutes. Now there's a new memory, and it's the two of you remembering.\");\n S(\"The Slow Walk\",\"walk exercise move body\",\"You put on your shoes, and that's the whole victory. Ten minutes, around the block, no pace to hit. The cold air reminds your lungs they work. A neighbor's dog trots over to say hi. By the time you get home your head is a little clearer and your heart feels a little more like yours.\\n\\nNobody gave you a medal. You earned something better: a warm kettle and a body that says thank you.\");\n S(\"The Little Notebook\",\"journal journaling write notebook brain\",\"A cheap notebook, a pen that skips. You write three lines: one thing that went okay, one thing that was hard, one thing you hope for. The hard one looks smaller on paper.\\n\\nYou do it again tomorrow. After a while the notebook turns into a quiet friend that remembers everything you forgot to tell yourself. Your brain gets a little space. Your heart gets a little company.\");\n S(\"A Glass of Water\",\"water bath hygiene shower rest relax body\",\"Somewhere between the third email and the fifth chore, you notice you haven't had a sip of water since morning. You fill a glass. It's an act of love with no audience.\\n\\nTonight there's a bath, with the door closed and the phone out of reach. Warm water. Clean towels. Teeth brushed, face washed, hair dried. Nobody grades you. Taking care of the body that carries you around all day is not vanity. It's thanks.\");\n S(\"Spring Is Thinking About You\",\"spring bills faith budget february future hope\",\"Out past the frost, spring is already a rumor in the roots. Under the snow the crocuses are practicing. You have a stack of bills and a short, fast February coming, and none of it is a verdict on you.\\n\\nYou open the budget anyway, one line at a time, with a cup of something warm. You pay what you can and plan for the rest. Sorry doesn't pay bills, but a plan helps, and so does faith that this will come out in the wash. Follow your heart, keep a little foresight, and remember you matter.\");\n S(\"Old Songs\",\"memory song music remember reminisce radio dance kitchen\",[\"A song comes on in the grocery store, and for four minutes you're nineteen in somebody's car with the windows down. You don't fight it. You let the whole memory walk in and sit down.\",\"When you get home, you play it for someone you love and tell them where you were. They tell you where they were. Now it's a shared song, and a new memory is already stacking on the old one.\"].join(\"\\n\\n\"));\n S(\"The Lunch Date\",\"new memories friend lunch people reminisce together\",[\"You finally text the friend you keep meaning to see. 'Lunch? Nothing fancy.' You pick a diner with sticky menus and a waitress who calls you hon.\",\"You laugh about the old days for an hour, then spend another hour making brand new ones. Somewhere in the middle, you both realize you were each hoping the other would text first. Next time, you'll text first. That's the plan.\"].join(\"\\n\\n\"));\n Chat=[\"February is the shortest month. It shows up quick, with its taxes and its bills, so be kind to future you and put a little aside now. Sorry doesn't pay the bills, but a plan does. It'll come out in the wash.\",\"Take a minute with your budget this month. Not to scare yourself, just to see it. Have some faith. Follow your heart and keep a little foresight. You matter more than a spreadsheet does.\",\"Drink some water. Go on, I'll wait. I'm a pumpkin, I have all the time in the world and no hands.\",\"Think warm thoughts. Spring is coming. It's already stretching under the snow.\",\"A bath, clean sheets, fresh teeth. Taking care of the body that carries you around is a kindness. Do it without shame.\",\"Walk a little today if you can. Not a punishment. A hello to your own heart.\",\"Write three lines in a notebook tonight. One okay thing, one hard thing, one hope. Your brain will thank you.\",\"Is there someone you haven't talked to in a while? Say 'remember this?' and see what comes back. That's how new memories get made.\"];\n setA(JOKES,[\"What's a New Year's resolution? A promise you make to the gym that the gym knows you won't keep. It loves you anyway.\",\"Why did the pumpkin make a budget? So it wouldn't be squashed in February.\",\"What did the January calendar say? I've got a lot on my plate, and by the way, February's right behind me.\",\"Why is January so long? It's still carrying all of December's leftovers.\",\"What do you call a snowman in January? Chilly, and thinking about a beach.\",\"Why did the tax form go to therapy? It had too many issues to itemize.\",\"What did one water glass say to the other? You're looking refreshing.\",\"Why was the notebook so happy? It finally got someone to open up.\"]);\n setA(FACTS,[\"January is named for Janus, the Roman god of doorways, who had two faces: one looking back, one looking forward. A fine god for a month about both.\",\"February is the shortest month, with 28 days, or 29 in a leap year. It was the last month added to the old Roman calendar.\",\"Some historians trace New Year's promises back about four thousand years to Babylon, where people made vows to their gods in the spring.\",\"Roman leaders made January 1st the start of the year in 45 BCE, when Julius Caesar introduced the Julian calendar.\",\"Short walks, even ten minutes, are linked in research to better mood and sleep. That's a pretty good return on a stroll.\",\"Water makes up roughly 60 percent of an adult's body. Keeping a glass nearby helps your head, your heart and your energy.\"]);\n}\nwindow.pmChatter=Chat;\n/* ---- the chocolate calendar (December) ---- */\nvar SCN=[[\"⛸️💑\",\"A couple skating hand in hand on a frozen pond, her scarf trailing behind them like a ribbon.\",\"Oh. Oh my. Look at them go. Pumpkin Man has no hands and is somehow holding hands anyway.\"],[\"🏘️❄️\",\"A tiny village under fresh snow, every window glowing gold.\",\"Every window has a family in it. Every single one. I want to wave at them all.\"],[\"🍪🧒\",\"Two kids on a stool frosting cookies, with more frosting on the kids than the cookies.\",\"This is the finest cookie work I have ever seen. 10 out of 10. Frosting everywhere.\"],[\"🕯️🍽️\",\"A long table with mismatched chairs and one candle, everybody leaning in to laugh.\",\"Someone just said something funny and nobody is looking at a phone. That's the whole miracle.\"],[\"🦌🌲\",\"A deer at the edge of a snowy wood, breath curling in the cold, listening.\",\"Hush. Even I'm quiet. Brimble would have yelled hello. Don't tell him.\"],[\"🧤☕\",\"Two mittened hands sharing one cocoa on a cold bench.\",\"One cup, two hands. That's love, in cardboard-calendar form.\"],[\"🐬🎅\",\"A dolphin leaping beside a ship, in a tiny Santa hat that almost stayed on.\",\"It almost stayed on! Gerald is doing his best out there!\"],[\"📮💌\",\"A grandpa mailing a card with great care, tongue poking out in concentration.\",\"Take your time, sir. That card is going to make somebody's whole week.\"],[\"🎶👵\",\"A grandmother humming at the stove while the whole kitchen hums back.\",\"The kitchen is humming back. Even the pots. I heard them.\"],[\"🌙⭐\",\"A quiet street at night, one star above the corner bakery.\",\"Just one star and one bakery, and that's a whole Christmas.\"],[\"🧣⛄\",\"A snowman wearing eleven different scarves at once, looking warm for the first time in his life.\",\"Margaret's work. He says he's fine. He is wearing eleven scarves. He is fine.\"],[\"🎄👧\",\"A little girl asleep under the tree lights, one hand resting on a wrapped box.\",\"Shh. Don't wake her. She's guarding the present even in her sleep.\"],[\"🛷😂\",\"Two siblings on a sled going much faster than anyone planned, mouths wide open.\",\"Nobody is steering. Everybody is thrilled. Honestly a good life philosophy.\"],[\"🔔🕊️\",\"A little church bell ringing in the snow while a dove sits on the roof, unbothered.\",\"The bell is doing its job. The dove is doing nothing. Both are perfect.\"],[\"🧶🪆\",\"Margaret's doll army lined up in a row, each in a tiny elf hat, clipboard at the end.\",\"Four hundred of them. Sharp. Ready. I'd salute, but I have no arm. I'll salute with my eyebrows.\"],[\"🎁👨\",\"A dad wrapping a present with an unreasonable amount of tape, grinning at his work.\",\"That's a lot of tape. That's a lot of love. Same amount, I think.\"],[\"🧜‍♀️🏮\",\"A mermaid hanging kelp stockings on a sunken lighthouse.\",\"Underwater Christmas is real and I will not hear otherwise.\"],[\"🥧👻\",\"A tiny ghost at a window, receiving a warm pie from a small knitted soldier.\",\"The doll army delivered! Somewhere, a ghost is no longer lonely. I'm tearing up. It's squash water.\"],[\"🎻🚉\",\"A busker playing on a train platform while a stranger stops and sways with their eyes closed.\",\"Nobody asked them to stop. That's the best review there is.\"],[\"☃️🏖️\",\"A postcard of a sunny beach taped to a fence, with a very grumpy snowman staring at it.\",\"He looks at it every day. He says it's just a postcard. He is a liar, and I love him.\"],[\"🌲🔦\",\"A family choosing the crookedest tree on the lot, all of them agreeing at once.\",\"The crooked ones always win. They have character. I'm a pumpkin, I would know.\"],[\"🐕🎀\",\"A dog wearing a big red bow, mortified and delighted at the same time.\",\"This is the exact face of a person at a family party. We have all felt it.\"],[\"🥣🏠\",\"Two neighbors passing a pot of soup over a fence with both hands.\",\"Nobody asked for anything back. The soup knows.\"],[\"🐬🛷\",\"A sleigh pulled by dolphins rising through the kelp, lights glowing like small moons.\",\"It's happening. It's actually happening. Pumpkin Man is very quiet and very pleased.\"],[\"🎄🖐️\",\"A tree decorated only with homemade ornaments, with a thumbprint in every one.\",\"Every thumbprint is somebody. The whole tree is a family. It's crooked and it's perfect.\"],[\"🛋️🎬\",\"A family asleep in a happy heap on the couch after dinner, a movie murmuring on.\",\"Nobody made it to the end of the movie. Everybody made it to the end of the day.\"],[\"🦌💜\",\"A reindeer with a glowing purple nose on a hilltop, shouting hello at a valley that shouts back.\",\"BRIMBLE. Okay, fine. That's beautiful. Please use your inside voice. No, don't. Keep going.\"],[\"🕰️🧓\",\"An old couple dancing in a kitchen to the radio, in their socks, in no hurry.\",\"They've been doing this for fifty years. They still lead and follow in turns. That's the trick.\"],[\"📖🕯️\",\"Someone reading aloud by candlelight to a room of very sleepy kids.\",\"One kid is still pretending to be awake. He's fooling no one. Sweet dreams, pal.\"],[\"🥂🎆\",\"A crowd on a cold street, counting down with their breath turning to clouds.\",\"Almost a new year. Hold someone's hand. Even if it's mittened. Even if it's a pumpkin's.\"],[\"🌅❄️\",\"The last sunrise of the year over a snowy field, pink and gold and silver all at once.\",\"Look at that. Nobody had to earn that sunrise. It showed up for you anyway.\"]];\nvar FOR=[\"Something small and good is coming your way. Let it be small.\",\"You don't have to hurry to be loved.\",\"Someone will thank you this week for something you've forgotten you did.\",\"Slow down. The best part of the day is hiding behind the busy part.\",\"You are allowed to rest and still be a good person.\",\"A warm cup of something will fix about half of everything.\",\"Today, be easy on yourself. Tomorrow, too.\",\"Kindness you give away comes back, usually from a direction you weren't watching.\",\"You're doing better than you think you are.\",\"Look up. There's a star out, even if you can't see it yet.\",\"Someone is thinking of you in a good way right now.\",\"The year was long. You're still here. That counts for a lot.\",\"Make room at the table. There's always room.\",\"What you feel today will not be what you feel in a week. Hold on to that.\",\"You don't have to earn your chair.\",\"A small yes today is worth more than a big plan for tomorrow.\",\"The people who love you aren't keeping score. Neither should you.\",\"There's a soft landing waiting around a corner you haven't turned yet.\",\"Being a little slow is not the same as being behind.\",\"Say the kind thing out loud. It lands better than you think.\",\"Rest is a form of work. It counts on the calendar too.\",\"You'll remember this small moment longer than the big ones.\",\"Your presence is the present. Wrap it with whatever you've got.\",\"Warm hands, warm heart, warm socks. Priorities.\",\"You're a better friend to others than you are to yourself. Try swapping.\",\"Joy doesn't need a reason. Let it in the back door.\",\"One good meal, one good laugh, one good night's sleep. That's a good week.\",\"You've survived every hard day so far. That's a pretty great record.\",\"Light a candle for something you're proud of. Even something tiny.\",\"The year ahead is already making room for you.\",\"Whatever is ending is making space. Breathe out. Then breathe in.\"];\nvar CH=[\"hazelnut\",\"dark chocolate\",\"milk chocolate\",\"a little marzipan one\",\"caramel\",\"creamy nougat\",\"a praline\",\"a tiny chocolate star\",\"orange dark chocolate\",\"a chocolate bell\",\"a cookie-butter truffle\",\"a peppermint cream\"];\nfunction door(n){var r=[1,2,3,4,5,6,7,3],k=1,h='\u003cdiv style=\"text-align:center;white-space:normal\">';\n r.forEach(function(c){h+='\u003cdiv style=\"display:flex;justify-content:center;gap:4px;margin:3px 0\">';for(var i=0;i\u003cc&&k\u003c=31;i++,k++){var o=k\u003c=n,t=k===n;h+='\u003cspan style=\"width:26px;height:26px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;'+(o?'background:linear-gradient(145deg,#e6ebf0,#a9b4c0);color:#222;':'background:#17212e;color:#4b5a6c;')+(t?'box-shadow:0 0 10px #f2b84b;outline:2px solid #f2b84b;':'')+'\">'+k+'\u003c/span>';}h+='\u003c/div>';});\n h+='\u003c/div>';var sc=SCN[n%SCN.length],f=FOR[(n*5)%FOR.length],c=CH[n%CH.length];\n var tx=\"Door \"+n+\" is open. Inside: \"+c+\". Also a little folded fortune: \\\"\"+f+\"\\\"\\n\\nOn the back of the door there's a picture: \"+sc[0]+\" \"+sc[1]+\"\\n\\n\"+sc[2]+\"\\n\\nEvery door you've opened stays open. Say 'door' tomorrow for the next one.\";\n var d=document.createElement('div');d.className='m bot';d.style.whiteSpace='pre-wrap';d.innerHTML=h;d.appendChild(document.createTextNode(\"\\n\"+tx));log.appendChild(d);log.scrollTop=log.scrollHeight;speak(tx);}\nvar _rl=reply;reply=function(input){var t=norm(input.trim());\n if(DEC&&!cur&&!(window.pmWM&&pmWM())&&!(window.pmGM&&pmGM())&&/\\b(door|doors|advent|calendar|chocolate)\\b/.test(t)&&nwords(t)\u003c=7){pendingQ=null;return door(Math.min(31,E.getDate()));}\n _rl(input);};\nintro=function(){buildQueue();var n=mem.name?\"Welcome back, \"+mem.name+\". \":\"Hello, traveler. \";\n say(DEC?n+\"I'm Pumpkin Man, reindeer edition. The antlers are courtesy of Margaret. The porch is warm, the lights are on, and today's door on my chocolate calendar is open. Say 'door' to see it.\\n\\n\"+nextQuestionText(true):n+\"Happy new year. I'm Pumpkin Man, and the porch is warm. Take it slow this month. Stories, jokes, and facts are all open, and I'm happy to just keep you company.\\n\\n\"+nextQuestionText(true));};\nsetMicUI=function(){micBtn.classList.toggle('armed',micOn);if(!micOn){micBtn.classList.remove('live');q.placeholder=\"Talk to the Pumpkin Man...\";}};\n})();\n";
