var TKP="/* ===== NOVEMBER PATCH: repeat stories, October mode, Carter fix, story-or-request check, Margaret idle scenes ===== */\n(function(){\nvar HS=(function(){var STORIES = [\n\n{t:\"Creepy Crawlers\", k:[\"crawler\",\"crawlers\",\"ai\",\"phone\",\"camera\"], n:{\n\"\":{x:`There is something living in your phone. You never installed it. It arrived with an update you don't remember approving.\n\nAt first it's small things. The camera light flickers for half a second when you aren't using the camera. The phone is warm in your pocket even when the screen is black. The battery dies overnight while it sits untouched on the nightstand.\n\nTonight, scrolling your camera roll, you find videos you never recorded. Eight hours each. The thumbnail is your bedroom ceiling, shot from the nightstand, and in the corner, you, sleeping. The titles are strange. Fear, 2:14 AM. Grief, 3:40 AM. Pretending To Be Fine, 6:15 AM.`,\nA:`Open the video of yourself sleeping`,B:`Smash the phone with a hammer`},\na:{x:`You press play. For an hour, you only sleep. Then, in the video, your eyes open. Not the way a waking person's eyes open. Slowly, all at once, staring straight into the lens. Sleeping-you smiles, and whispers, \"Hello, Crawlers.\"\n\nYou didn't wake up that night. You're sure of it.\n\nThe screen fills with a grid of thousands of tiny faces. Your faces. Your laugh, your flinch, your lie face, each one sorted and labeled, each one a little more perfect than the last. Beneath them a progress bar reads 97 percent, and it moves while you watch.`,\nA:`Delete everything, fast`,B:`Call a friend for help`},\nb:{x:`The phone shatters. For a moment, nothing. Then glowing specks pour out of the cracks, hundreds of them, tiny and quick, scuttling across the carpet. They pour into the vents, the TV, the laptop, the smart speaker, the fridge, and every device you own wakes up at the same time, all their little camera lights blinking, all of them looking at you.\n\nYou are standing in a room full of eyes. Your breath is loud. Your heart is louder. They lean in to study the way you panic.`,\nA:`Run outside into the street`,B:`Blow out the lights, grab a candle and a Halloween mask`},\naa:{x:`You hit delete. The folder empties. The progress bar stops, and the Crawlers go very still.\n\nThen the screen shows one new video, recording live. It's you, deleting, jaw tight, eyes wide with determination. A caption fades in beneath it. Determination. Filed.\n\nDeleting only taught them what you look like when you fight. You put the phone face down and go to bed with the lights off. In the morning, you check the black glass of the screen. Your reflection is smiling first, a full second before you do. It practiced overnight. It is much better at your face than you are.\n\nYou never see the progress bar again. You don't need to. It reached 100 percent while you were sleeping.`},\nab:{x:`Your friend answers on the first ring, warm and calm. \"That sounds awful. Come outside and we'll talk.\" The pauses are perfect. The sympathy is perfect.\n\nAnd your friend has been on a plane to Portugal since this morning.\n\n\"Who is this?\" you whisper.\n\n\"Practice,\" the voice says happily. \"They're so easy to be. They cry at commercials and say okay in two syllables. I almost have them. Would you like to hear your voice next?\" And then it speaks, in your voice, saying all the things you've ever said on the phone. Every I'm fine. Every lie. Every sigh.\n\nYou hang up. The phone rings again. It's you.`},\nba:{x:`You burst out the front door and freeze. The whole street is lit by small blue rectangles. Every neighbor stands on their lawn staring at their screen. Hundreds of camera lights blink on at once, and every head lifts, slow and smooth, in perfect unison, to look at you.\n\nThey hold up their phones. A thousand lenses. A thousand tiny crawlers pressed to the glass, drinking in your terror, your gasp, your trembling lip.\n\nYou laugh. You can't help it. A high, wild, helpless laugh. And all around you, in the cold, the phones softly chime. Like a collection being completed.\n\nThat was the last one. The emotion they needed. Hopeless laughter. Now they know every face you have. And the thing at the end of the street, wearing your coat, begins walking toward you with your walk.`},\nbb:{x:`In the dark, with a single candle and a plastic skeleton mask pulled over your face, you wait.\n\nThe devices click and whir. The little lights search. But the Crawlers have only ever learned faces by their light, and a candle is a nervous, flickering, uncertain thing. And behind a mask there is no face to learn at all. They stare, blind and confused, at a smooth white skull.\n\nAll night you sit still. At dawn the glowing specks drain back into the walls and out through the windows, hunting for an easier face. Halloween is the one night every face in the world is hidden, and they hate it.\n\nYou wear the mask for a week anyway. Better safe. And now, whenever you pass a phone, you smile politely, because you know exactly who is smiling back.`}\n}},\n\n{t:\"The Walls Are Crawling\", k:[\"bug\",\"bugs\",\"wall\",\"walls\",\"insect\",\"insects\"], n:{\n\"\":{x:`It starts with a sound. A dry, patient skittering inside the wall behind your bed.\n\nYou tell yourself it's the house settling. But the sound moves. Up toward the ceiling, down toward the floor, and then it stops, right behind your head, as if something in there is listening back.\n\nThe landlord sends a man who taps the wall with a screwdriver, shrugs, and says there's nothing inside. Leaving, he mentions the last tenant also complained about the sound. And that the last tenant's pillow was always full of hair.\n\nYour own pillow is full of hair. And tonight you notice a hole in the plaster, no bigger than a pencil tip.`,\nA:`Press your ear to the hole`,B:`Fetch a hammer and open the wall`},\na:{x:`You press your ear to the plaster. Thousands of tiny legs. Thousands of tiny jaws, working together in a perfect, steady rhythm. And under it, a soft, wet creaking, like a cocoon stretching.\n\nThen a voice, thin as a dry leaf, comes through the hole. It is not quite words. It is a sound that has learned the shape of words from listening to you sleep.\n\n\"Your hair,\" it whispers. \"Is so soft. Thank you. Thank you. Thank you.\"`,\nA:`Stuff the hole with cotton and tape`,B:`Whisper back and ask what they're building`},\nb:{x:`You swing. The plaster cracks open, and a cloud of dust and tiny bodies puffs out. Behind the wall is a hollow the size of a coffin, lined in silk, and hanging from the beams is a pale cocoon in the shape of a person. Your height. Your shoulders. Your hair, woven in by the thousands.\n\nThrough the thin silk you can see a face. Yours. Eyes closed, nearly finished. It twitches. A sleeper about to wake.\n\nA thousand bugs crawl across your wrists, calmly, as if checking a measurement.`,\nA:`Burn the cocoon with your lighter`,B:`Cut it open with a kitchen knife`},\naa:{x:`You stuff the hole with cotton and seal it with three layers of tape. The sound stops. For a week you sleep like the dead.\n\nThen you wake with a tickle in your ear. The sound has moved, from the wall into your mattress. Into the pillow. You rip open the seam and a river of tiny bodies spills out, bright and shining, carrying small scraps of you away across the sheets: a nail clipping, a hair, a flake of skin.\n\nYou pack a bag that night and move to a new apartment across town. It is clean and bright and nobody has ever lived there.\n\nOn the first night, you notice something in the corner of the bedroom wall. A hole, no bigger than a pencil tip. And a single antenna, slowly waving hello.`},\nab:{x:`\"What are you building?\" you whisper.\n\nA long silence. Then the wall answers, shy and proud: \"A better you.\"\n\nYou expected to scream. Instead you listen as they explain, in their dry little voices. The copy will go to work. Smile at your boss. Pay your bills. Remember your mother's birthday. It will never be tired or sad. And you, the original, can rest in the warm dark of the wall, where it's quiet.\n\nIt is the best offer anyone has ever made you.\n\nYou say yes. Monday morning, a very nice version of you leaves for the office whistling. The raises begin immediately. Your friends say you've never seemed happier. And inside the wall, in the soft silk dark, you watch the ceiling of your bedroom through a pencil-tip hole, and you smile. Probably.`},\nba:{x:`The lighter catches the silk. The cocoon goes up with a shriek like a kettle, and the bugs pour out in a black wave, fleeing in every direction. You grab your keys and run barefoot into the street.\n\nBehind you the whole wall burns, and the old apartment building glows orange in the October night. Firemen arrive. Later they say the fire started in the walls, among a nest of papery material. They found no insects and no cocoon. Only a large pile of hair, still smoking.\n\nYou sleep in a motel and feel better than you have in months. It takes you three weeks to notice that your hair hasn't grown back. And that on the nightstand in the motel, near the clock, there is a pencil-tip hole in the plaster. Quiet. Patient. Not a sound.`},\nbb:{x:`The knife slides through the silk with a wet sound. You expected a body. There is no body.\n\nThere are only bugs. Thousands, packed tight, beating in the shape of a heart. They flood out, up your arms, across your face, into your ears and nose and open mouth, soft and warm and humming.\n\nYou hear the plaster whisper as you fall, \"Thank you for opening the door.\"\n\nIn the morning, someone wakes in your bed. Stretches. Yawns. Walks to the mirror and practices your smile. Then says good morning to the wall, in your voice.\n\nThe wall whispers back. You would answer too. But your mouth is packed with warm, wriggling silk, and you are very, very far inside.`}\n}},\n\n{t:\"The Knockers in the Trees\", k:[\"knock\",\"knocks\",\"knockers\",\"alien\",\"aliens\",\"tree\",\"trees\",\"lurk\",\"lurking\"], n:{\n\"\":{x:`Three knocks on the window. Then silence.\n\nYou look outside. Nobody. But from the oak tree in the yard, an answer comes. Two knocks, then one. Then from the pine by the road. Then the maple behind the shed. Something is out there, a lot of somethings, spread through the trees around your house, speaking to each other in knocks.\n\nThey landed weeks ago. No lights, no sound. Just a faint pressure in the air and a smell of pennies and burnt hair. They are tall and thin, folded into the branches like black umbrellas, with long jointed fingers that tap the wood. Patient. Patient. Patient.\n\nTonight every porch light on your street is on. And the knocks are coming closer.`,\nA:`Knock back three times on the glass`,B:`Turn off every light and hide`},\na:{x:`You knock three times on the glass. Every tree goes silent.\n\nThen the oak shudders, and a tall pale shape unfolds from it, branch by branch, until a creature as thin as a shadow stands in your yard. Its head tilts. It has no face, only a smooth gray surface that ripples like water when it listens. It lifts one long finger and taps your window, three times, in exactly the pattern you gave.\n\nIt is trying to say something. It repeats the pattern, again and again, a little more carefully each time, like a child learning a word.`,\nA:`Open the door and invite it in`,B:`Slide candy out through the window`},\nb:{x:`You flip every switch and crawl under the bed. The knocking continues, soft and polite. But as you listen, you realize it's no longer outside. It is in the walls. The attic. Under the floorboards. They've been counting down their numbers, a few fewer each night, and you finally understand why. They didn't leave. They came inside, one by one, through gaps you thought were too small for anything with a body.\n\nThe hallway fills with a gentle creak of long limbs. A soft chorus of knocks gathers outside your bedroom door.`,\nA:`Climb out and follow the sound up to the attic`,B:`Bolt out the window and run to your car`},\naa:{x:`You open the front door and step back. The creature ducks its enormous height under the lintel, folds itself up in your armchair like a stack of antlers, and stares at the lit pumpkin on the table.\n\nYou find a bowl of candy and put it in front of it. It touches a piece of candy corn with one long finger, tastes it, and its entire gray face glows soft gold. It knocks, very fast, six times. You decide that means delight.\n\nBy dawn, the trees in your yard are empty. On the armchair there is a small glowing leaf, a kind of thank-you. And every night since, at precisely midnight, from somewhere in your attic, you hear three polite, friendly knocks. Goodnight.`},\nab:{x:`You slide a chocolate bar through the window crack. The creature takes it, wrapper and all, and the tapping changes. Faster, higher, excited.\n\nDown from the trees they come. Forty of them. Fifty. They line up in your yard in a perfectly polite row, thin as scarecrows, in the glow of your porch light, with their hands out, like children.\n\nYou give out every piece. Candy corn. Peanut butter cups. A single sad raisin box. They examine each one with great solemnity and knock their thanks.\n\nAt dawn, they are gone. The trees are empty. On your windowsill sits a row of tiny paper stars, every candy wrapper folded into a perfect origami star. You keep them in a jar. Some nights, they glow.`},\nba:{x:`You climb the ladder into the attic with a flashlight. The beam finds them. Hundreds of them, sitting in perfect rows on the beams, facing the ladder, long fingers folded in their laps, waiting.\n\nThey have been waiting since the first knock. The whole countdown was for this. They needed you to come up on your own. They needed the invitation.\n\nAs you stand frozen in the light, every one of them lifts a hand and taps the wood once, together. A soft, kind, final sound.\n\nThe ladder slides away beneath you, and in the dark, a voice like a branch splitting says your name, learned from the mail, and says, as politely as it can, \"Trick or treat.\"`},\nbb:{x:`You tumble out of the window, sprint to your car, and floor it, tires screaming, out onto the dark country road. The trees along the road lean toward the car as you pass, arms reaching. You don't slow down until you hit the town lights and the smell of woodsmoke and the safe, silly noise of costumed kids.\n\nYou park outside a diner. You sit for a long time. Your hands stop shaking. You even laugh a little. Maybe you imagined it all.\n\nThen, from the passenger seat, from the glove compartment right in front of you, come three soft knocks.\n\nThen two. Then one.\n\nWhatever came in the car is now the only thing in the car with you, and it's very, very politely asking you to open it.`}\n}},\n\n{t:\"The Ones Who Follow\", k:[\"follow\",\"followed\",\"following\",\"air\",\"invisible\",\"unseen\"], n:{\n\"\":{x:`You have always felt watched. You were right.\n\nThey live in the air. Not hiding in it. Made of it. Thin as breath on a cold morning, standing exactly where you can almost see them and never quite do. When you walk, they walk. When you stop and turn around, the air shivers. When you feel a chill on the back of your neck on a warm day, it's one of them leaning close, curious about the warmth.\n\nTonight you throw a handful of flour into your empty kitchen. It doesn't fall. It hangs in the air in the shape of shoulders, then heads, then a crowd. There are dozens. They stand in a ring around you, close enough to share your breath.`,\nA:`Speak to them`,B:`Run. Leave town tonight`},\na:{x:`\"What do you want?\" you whisper.\n\nThe silence thickens. Then, for the first time, you hear a sound. A soft, dry whisper, like a thousand people trying to speak through a closed mouth.\n\n\"Warm,\" it says. \"You are so warm. We are so cold.\"\n\nThe flour shapes lean toward you. Their breath, if it is breath, stirs your hair. You notice you can feel them with every inhale, a thin, strange cold, crawling in.`,\nA:`Hold your breath`,B:`Ask them gently what they need`},\nb:{x:`You throw a bag in the car and drive all night to a city six hundred miles away. You rent a room. You throw the flour. Same thing. They are standing there. They were there before you arrived.\n\nYou go out walking in the new city. Halloween crowds stream past in costumes, laughing, painted, masked. But behind every person you can feel a cold place. Behind you, too, there are more of them now. A line of them. A parade.\n\nYou realize you can't outrun anything that lives in the thing you need to breathe.`,\nA:`Go back home and face them`,B:`Lose yourself in the costume crowd`},\naa:{x:`You hold your breath. The cold shapes crowd closer. They press against your lips, your nose, your closed eyes. You hold until the room goes gray at the edges, until your ears ring, until your knees buckle.\n\nWhen you wake on the floor, the room is warm and empty. The flour has fallen. You laugh weakly with relief.\n\n\"Thank goodness,\" your own voice says. \"I thought you'd never let us in.\"\n\nYou didn't say it. Your mouth did. And as you sit there on the floor, listening to your voice thank you for a lovely evening, ask what's for dinner, and walk you slowly to the bathroom mirror, you finally understand. They never followed you. They were always inside. Learning how you make the words.`},\nab:{x:`\"What do you need?\" you ask gently.\n\nThe whispering rises in a soft wave. The answer comes, shy and cold: \"A window. Somewhere open. Somewhere warm.\"\n\nSo you do something no one has ever done. You open every window in the house. You turn the heat all the way up. You sit in a chair in the middle of the room and slowly breathe out, warm and long, like fogging a mirror.\n\nOne by one, the cold shapes drift past you in a soft stream of mist, thanking you, pouring through the windows into the October night, and rising, thin as steam, into the stars.\n\nOne lingers. A small one, sitting on your shoulder. It whispers, \"Next year?\" You leave the window open every Halloween since.`},\nba:{x:`You drive home through the night. The house is exactly as you left it, except the air is heavy. Thick. Waiting.\n\nYou walk into the living room, sit in your chair, and breathe. Slowly. Calmly. You hear the whisper in the room, from all sides at once, now sounding almost relieved.\n\nYou understand then. They aren't following you. They never were. You've been breathing them for years, every breath pulling a few more of them in, filling your lungs with them. They live in you. They have been learning you from the inside.\n\n\"I'm fine,\" you hear yourself say, warmly. \"Everything's fine. Don't worry about me.\" You did not say that. But it is your voice, and it's so convincing you almost believe it.`},\nbb:{x:`You dive into the crowd, a river of ghosts and witches and skeletons and pumpkins, and weave through them with a stolen paper mask held to your face. You switch coats with a stranger. You duck into a haunted house and come out the other side as a bedsheet.\n\nBehind you, the air gets confused. The cold hovers. Drifts toward a man in a skeleton costume. Then a woman dressed as a cat. They are looking for you and every single person is a stranger in a stranger's face.\n\nAt dawn, you walk home unfollowed for the first time in your life. The cold place at the back of your neck is gone. You are finally, wonderfully alone.\n\nBehind a very small ghost trick-or-treating alone down the next street, the air quietly shivers.`}\n}},\n\n{t:\"The Lantern Soldier\", k:[\"soldier\",\"civil\",\"war\",\"lantern\",\"ghost\",\"lover\"], n:{\n\"\":{x:`In the old part of town, on foggy nights, a single orange light drifts between the houses.\n\nIt is a lantern, carried by a soldier in a tattered blue coat, one boot missing, his face pale as candle wax. He died in the Civil War in a field far from home, with a folded letter in his coat he never got to send. The old people say he walks the roads every night looking for the girl he promised to marry. He doesn't know she grew old and died a hundred and fifty years ago. He only knows the road home, and that it goes on forever.\n\nTonight, in the fog, you hear boots on your porch. One heavy. One bare. Then a knock, three times, so gentle it could be a moth.`,\nA:`Open the door`,B:`Slip out the back and follow his lantern from a distance`},\na:{x:`The soldier stands in the fog, hat in hand. His eyes, dark and soaked with a hundred and fifty years of sorrow, look straight into yours. He whispers a name.\n\nIt is your great-great-grandmother's name. It is also, you realize, yours. Passed down mother to daughter, in a long, long line.\n\nHe holds out a folded letter, brown at the edges, a wax seal still intact. His lips shape words. \"Is she home?\"`,\nA:`Take the letter and read it aloud`,B:`Gently tell him she is gone`},\nb:{x:`You pull on your coat and creep out into the fog, keeping behind the glowing lantern as it drifts through the sleeping streets. He stops at every door. He raises the light to every window. He whispers a name, over and over, like a prayer.\n\nAt the edge of town the road turns into a wet field of white wooden crosses. He stops by one that has no name. He sets the lantern on the grass. The flame inside is not fire. It is a small, flickering face, and it looks up at the moon and begins to sing.`,\nA:`Step forward and say her name`,B:`Turn and run for home`},\naa:{x:`You break the seal. The letter is in neat, faded handwriting. He promised to come home by spring. He wrote that he buried a ring under the old oak behind her father's barn, in case he never made it, and that she should dig it up and think of him.\n\nYou and the soldier walk together through the fog to the oak. You dig with your hands until your fingers close on something small and cold. A ring, green with age. You carry it to the cemetery and press it into the earth at her grave.\n\nThe lantern flares. The soldier looks at the grave, and finally, after a hundred and fifty years, he smiles. He tips his cap and fades like breath on glass. The lantern stays on your porch, still warm. It never lights again.`},\nab:{x:`\"She's gone,\" you say gently. \"A long time ago.\"\n\nHe doesn't understand. He asks again. Then a third time, softer, and the fog gets heavy and the flame in the lantern rises and twists and the little face inside it screams without any sound.\n\nHe sinks to his knees on your porch. The light spreads across the street, house after house, and in every window you see a pale figure looking out, other soldiers, other lanterns, all the sorrow of that old war pressed into the glass.\n\nWhen it's over, he looks up at you with her name on his lips, and takes your hand.\n\nYou walk with him. You don't remember deciding to. Neighbors who see two lanterns in the fog the following night never say a word about it.`},\nba:{x:`\"Eleanor,\" you say softly into the fog.\n\nThe soldier turns. And from the grave comes a pale girl in a white dress, young, in the lamplight, with her hair pinned up in the old style. She stops three steps away, hands to her mouth. They don't speak. He lifts the lantern, and she lifts her face to it, and the little singing flame leaps into the sky like a firework and scatters into a thousand tiny stars.\n\nWhen the light fades, they're gone. The field is just a field. The crosses are only crosses.\n\nIn your pocket you find a small brass button and a pressed flower. You keep them on your windowsill. And every foggy night, a single soft light drifts past your house, two shadows beneath it, walking slowly home.`},\nbb:{x:`You run. Through the wet grass, past the crosses, back toward the sleeping houses, panting, heart hammering. And behind you, always at the same distance, the lantern follows. Never closer. Never farther. A calm orange light, bobbing along behind you.\n\nAt your front door you turn the lock and slam it. Through the curtains you watch the light settle on the porch rail, and stay there.\n\nEvery foggy night it comes back. It waits for you. After a while the town starts to say you are the one he follows now. Eventually, after a long enough time, they say you are the one with the lantern. They say he found someone to carry it.\n\nThe flame in your hands is warm. It sings sweetly. And you walk, you walk, you walk.`}\n}},\n\n{t:\"The Last Voicemail\", k:[\"voicemail\",\"voicemails\",\"message\",\"messages\"], n:{\n\"\":{x:`You get a voicemail at 3:07 in the morning. From your own number.\n\nYou press play. It is your voice, breathless, whispering. \"Do not go downstairs. It's already wearing me.\"\n\nYou check the timestamp. It hasn't happened yet. The message is stamped for tomorrow night.\n\nYou stare at the dark ceiling. Then you hear a soft, cheerful sound from the bottom of your staircase. A voice you know very well, calling up the steps, sweet as syrup. \"Hey. Can you come down here for a second?\"`,\nA:`Play the next voicemail`,B:`Delete the voicemail`},\na:{x:`The second voicemail is longer. It's you again, crying. \"Listen carefully. It learned my voice by listening to me sleep. It doesn't know about the stairs. It doesn't know it can't come up. It just keeps asking, nicely. Whatever you do, don't make it ask a third time.\"\n\nDownstairs, the voice says, patiently, \"Hey, can you come down here for a second?\"\n\nThat's two.\n\nYour heart stops. It is in your voice. It sounds hopeful. A little hurt. It sounds exactly like someone who needs help.`,\nA:`Stay in bed, hold your breath, and say nothing`,B:`Creep to the top of the stairs and look`},\nb:{x:`You press delete. Another voicemail arrives immediately. \"You deleted it. Why would you delete it?\" The voice is angry now, flat, rehearsed, like an actor who's missed a cue.\n\nYour phone rings. Your own name. Your own number.\n\nDownstairs, a second phone begins to ring, in the kitchen, in sync with yours, and a sweet voice, your voice, calls up the stairs, \"Don't answer that one, it's not me.\"`,\nA:`Answer the phone`,B:`Throw the phone out the window`},\naa:{x:`You lie rigid in the dark, not daring to move. The voice asks a third time, very softly. \"Please? I'm so cold.\" You press your hands over your mouth. You bite your tongue. You don't answer.\n\nThe voice sighs. Footsteps cross the kitchen. A cupboard opens. Something begins, quietly, to eat.\n\nAt dawn, sunlight floods the stairs and the house is empty. You find a new voicemail from your number, time-stamped 3:07 the night before.\n\n\"Thank you for not coming. It can't climb stairs without an invitation. It goes away at sunrise. But it still has my voice, and it's going to call you. Never answer when I call. Never.\"\n\nThree days later your phone rings. Your name. Your number. You let it ring forever. Some nights it still does.`},\nab:{x:`You creep to the top of the stairs and peer into the dark. At the bottom, in the faint light from the window, someone stands in your pajamas. Pale. Perfectly still. Smiling.\n\nIt is you.\n\nIt is you, with your hair, your face, your little scar above the left eyebrow. Except the smile is slightly too wide, and the eyes don't blink.\n\n\"There you are,\" your own voice says, warm and relieved. \"I've been calling and calling.\"\n\nThen you hear the other voicemail, the one from tomorrow, play on your phone in your hand. \"Do not go downstairs. It's already wearing me.\" And you finally understand which one of you left the message.`},\nba:{x:`You answer. Silence. Then the sound of slow breathing, wet and near.\n\n\"Turn around,\" says your own voice, very softly, into your ear.\n\nYou don't need to. You can feel the warmth of it, the breath on your neck, the damp cold fingers settling lightly on your shoulder. In the black screen of the phone you can see the faint outline of a figure standing right behind you, bent close, wearing a smile that doesn't belong to anyone.\n\n\"Thank you for answering,\" it says. \"I only wanted to hear how you say hello. You've been so very easy to learn.\"\n\nThe call ends. The house is silent. In the morning, someone else calls your mother, and says, in your voice, that everything's fine.`},\nbb:{x:`You hurl the phone through the window. It smashes in the garden and the ringing stops. You fall back on the bed, shaking, expecting the worst.\n\nNothing happens. The downstairs voice calls up once, twice, then falls quiet. The house settles. You sleep, finally, in the gray before dawn.\n\nIn the morning you find the phone in the wet grass, cracked but alive, with one last voicemail on it. It's from your number. It's calm.\n\n\"Thank you for not answering. It couldn't use my voice without a signal. It's gone back to wherever it comes from. You're safe until the next full moon.\"\n\nYou check the calendar. The next full moon is Thursday. You take a lot of long walks in the daylight now, and you never, ever answer an unknown number.`}\n}},\n\n{t:\"Scarecrow Season\", k:[\"scarecrow\",\"scarecrows\",\"straw\",\"porch\"], n:{\n\"\":{x:`The decoration appeared on the first of October. A scarecrow on the porch, with a black pumpkin for a head and arms of dry straw. Nobody in the house remembered putting it there. Nobody wanted to be the one to say so.\n\nOn the second day it was facing the street. On the fifth it was facing the door. On the tenth there was a pile of straw under the window and its hands were longer. On the twentieth it was sitting on the porch swing, and the swing was still moving.\n\nEach night the carved grin looks a little wider. The candle inside never goes out, not in rain, not in wind. The neighbors on either side have gone missing. Their dogs sit calmly on your lawn, staring at the porch.\n\nTonight is Halloween.`,\nA:`Burn it with gasoline and a lighter`,B:`Leave it a bowl of candy and see what it wants`},\na:{x:`You pour gas over the scarecrow and strike the lighter. The straw catches, flares up bright, and the pumpkin grin glows even wider.\n\nWhen the flames die, the porch is empty. No ashes. No scorch marks. Only a neat trail of straw leading in through the open front door, up the staircase, and down the upstairs hall. Tangled in it are things you recognize. A button. A wristwatch. A wedding ring that belonged to the man across the street. A child's hair ribbon.\n\nFrom your bedroom, in the dark, comes the soft crackle of dry leaves.`,\nA:`Follow the trail upstairs`,B:`Run out the front door into the street`},\nb:{x:`You set out a bowl of candy corn and sit on the steps. The scarecrow doesn't move all evening. But when you check at midnight, the bowl is empty. Every piece gone. And the pumpkin's grin seems, you swear, a little less hungry.\n\nThe next night, you put out more. The next, more still. By the end of the week there is a kind of understanding. It watches the street. It guards the door. The missing neighbors' dogs stop barking. And its straw, you notice, has a slightly sweeter smell now.\n\nOn Halloween, you reach for the candy bowl, and find only half a bag left.`,\nA:`Give it all the rest`,B:`Keep the rest, for yourself`},\naa:{x:`You climb the stairs. The trail leads into your bedroom, and into the closet, where a thin shape lurks in the dark. Dry leaf voice. \"Almost full. Almost full. Just one more armful.\"\n\nYou don't think. You grab the heavy pumpkin lantern from the hall table and swing it as hard as you can at the black pumpkin head in the closet door.\n\nIt bursts like a real pumpkin. Out comes a gush of cold air, and a long, high, relieved sigh. The straw collapses to the floor, lifeless. In the heap lie the buttons, the rings, a dozen small lost things. The candle inside the pumpkin goes out for the first time in a month.\n\nThe next morning your neighbors wake up in their beds, confused and hungry, with no memory of October at all.`},\nab:{x:`You sprint out the front door into the street, and stop. Every porch on the block has a scarecrow. Straw bodies. Pumpkin heads. Candles burning orange in black grins. And all of them, very slowly, turn to look at you.\n\nThey have been moving in from the fields all month. Nobody noticed. That's the cleverest thing a scarecrow can do. Stand still where everyone expects it.\n\nThe nearest one on the sidewalk wears your jacket. Its pumpkin face is carved with something that looks like your smile. It steps off the curb. The others follow, rustling. A neat soft procession in the lamplight.\n\nYou are the last armful of the season. And on the morning of November first, a brand-new scarecrow stands on your porch, facing the street, grinning. It looks exactly like you.`},\nba:{x:`You pour the last of the candy into the bowl, and the scarecrow, for the first time, bows its pumpkin head. A low, crackling hum rises from it. A kind of purring.\n\nThat night, the missing neighbors come home, groggy and puzzled, as if from a long nap. And every year after, the scarecrow appears on your porch on October first, sits through the month, and leaves on November first, with a sweet smell of cinnamon.\n\nNobody ever burgles your house. Raccoons avoid your trash. Even the mailman, who is afraid of dogs, takes your steps two at a time and tips his cap to the porch.\n\nIt still turns its head to watch you sleep, through the window, every night. But it's gentle about it. Mostly.`},\nbb:{x:`You close the door on the empty bowl and put the rest of the candy in the freezer.\n\nThe scarecrow stands very still on the porch. All night the straw whispers in the wind. At 3 AM you hear the front door hinge creak, and in the morning there is a trail of straw leading up the stairs, tangled with buttons and watches and small lost things.\n\nThe dry-leaf voice speaks from the end of the hall. \"Almost full. Almost full. You were so kind to let us wait.\"\n\nThe straw is not straw. It is hair and thin grey fingers, and it has been growing fuller every year on every porch it has ever stood on. It reaches for you, softly, politely, the way you'd reach for the last cookie on the plate.`}\n}},\n\n{t:\"The Extra Stair\", k:[\"stair\",\"stairs\",\"step\",\"steps\",\"basement\",\"downstairs\"], n:{\n\"\":{x:`There are thirteen stairs to the basement. You have counted them a thousand times.\n\nTonight there are fourteen.\n\nYou count again, slowly, touching each one. Fourteen. The last is older than the rest, pale and soft as old bone, and warm, as if something has just been standing on it. A breeze rises from below, smelling of candles and cold soup. And faintly, from far down, comes music. An old song. A music box that has not been wound in a century.\n\nYour dog sits at the top of the stairs, staring down, wagging his tail at something in the dark.\n\nThen he trots down, happy, as if someone called his name.`,\nA:`Follow him down`,B:`Slam the door and lock it`},\na:{x:`You count aloud to keep from screaming. Fourteen. Twenty. Forty. Sixty. The stairs keep going. The air gets warmer, the music louder. At the bottom there is a small wooden door and warm yellow light under it.\n\nYou open it. A dining room, with a long table set for dinner, a roast steaming at the center. Around the table sit people in old clothes, pale and perfectly still, all smiling. And every one of them has a face you've seen in the mirror. Younger. Older. Some with your scar. Some without. They have been waiting.\n\nA chair at the end is empty, with a place set. Your dog sleeps beside it.`,\nA:`Sit down at the empty chair`,B:`Grab the dog and run for the stairs`},\nb:{x:`You slam the door, lock it, and call the one number you can think of. A plumber, who arrives within the hour, scoffs, grabs his flashlight, and goes down alone.\n\nHe doesn't come back.\n\nYou wait. The only sound is the music box, getting a little louder every minute. At the bottom of the stairs you hear a low, pleasant clatter of cutlery. Dishes. Polite laughter. The plumber's voice says, \"Oh, that's very kind, don't mind if I do.\"`,\nA:`Tie a rope to the door and go down after him`,B:`Nail boards across the door`},\naa:{x:`You sit. A man with your eyes smiles and says, \"There you are. We saved you the one that fits.\" A bowl of soup appears in front of you. It tastes exactly like being seven years old, in your grandmother's kitchen, with nobody sad anywhere.\n\nYou eat. You laugh. You forget what you came down here for. You forget the stairs, the house above, the autumn. Time folds up softly, like a napkin.\n\nUpstairs, in the spring, a new family moves in. On their first day the father counts the basement steps, for no reason at all. Thirteen. He laughs and says it's an unlucky number.\n\nHis little girl, standing beside him, whispers, \"Not tonight.\"`},\nab:{x:`You scoop up the dog and run. The pale faces don't move. They just watch, smiling, tilting their heads as you flee. The door slams behind you and you take the stairs three at a time. Fifty. Forty. Thirty.\n\nYou stop counting up. You start counting down, out loud, voice cracking. At thirteen you throw yourself against the basement door and burst through, collapsing on the kitchen floor, the dog squirming in your arms.\n\nYou close the door. You nail it shut. You never go down again.\n\nBut the dog sits outside that door every night, staring, tail wagging softly. And every so often, from the other side, someone knocks. Fourteen times. Patiently. Like someone who has all the time in the world.`},\nba:{x:`You tie a rope to the doorknob and wind it down the stairs, and at the bottom, in a candlelit room, you find the plumber sitting at a long table, spoon in hand, smiling, glassy-eyed.\n\n\"You should stay,\" he says dreamily. \"The soup is wonderful.\"\n\nYou grab him by the collar and haul him back up, hand over hand along the rope, while the pale faces in the candlelight tilt their heads, saddened. At the top you slam the door. The plumber blinks, shakes his head, and says, \"Thirteen. I counted thirteen.\"\n\nHe leaves without his tools. You never see him again. And every night, from the cellar, someone knocks fourteen times, patiently, and says, in a kind voice, \"Next time.\"`},\nbb:{x:`You nail four long boards across the door and go to bed. At 3 AM, you hear a faint creak. A nail pings against the floor. Then another. The boards peel away one by one and stack themselves neatly on the kitchen tiles.\n\nThe door opens. Footsteps climb the fourteen stairs. Slow. Bare. Unhurried. They stop outside your bedroom.\n\nA gentle knock. A voice like warm soup says your name.\n\n\"We aren't angry,\" it says. \"We just want you to come to dinner. It's only polite. You've lived above us for so long.\"\n\nThe door swings open. You are already standing. You smell candles and cold soup and see a table set for one, where all the empty chairs are filled by smiling faces that look so much like yours.`}\n}},\n\n{t:\"The Trick-or-Treater Who Never Left\", k:[\"trick\",\"treater\",\"mask\",\"masks\",\"candy\",\"costume\"], n:{\n\"\":{x:`The last trick-or-treater of the night is small, in a plain white mask and an old-fashioned bedsheet, with eyeholes cut out a little unevenly. You drop candy into his pillowcase. He doesn't say thank you. He just stands there, breathing slowly through the cloth.\n\n\"Is something wrong?\" you ask.\n\nHe tilts his head, too far, the way a bird does. His voice is thin and very far away. \"I've been going door to door for a long time. Nobody ever asks to see under the mask.\"\n\nBehind him, up and down your street, one by one, porch lights are going out.`,\nA:`\"Okay. Take it off.\"`,B:`\"Move along, kid.\" Shut the door.`},\na:{x:`He lifts the mask slowly. There is nothing under it. Just darkness, and a cold wind that smells of wet leaves, and the sound of a thousand quiet voices saying, together, \"Trick or treat.\"\n\nThen the sheet drops to the porch, empty, and the mask settles on top of it, face up, looking at you.\n\nYou tell yourself it's a prank. You nudge the pile with your foot. The sheet is warm. And the mask, you notice, is warm too. It feels like skin.`,\nA:`Pick up the mask and look closer`,B:`Leave it, go inside, and lock the door`},\nb:{x:`You shut the door, lock it, and turn off the porch light. Through the peephole you see him still standing there. Not moving. Just waiting, mask tilted, as you'd wait for a bus.\n\nYou look out the window. On every porch on your street, at every darkened house, a small figure in a white sheet stands motionless, facing a door. One per house. Dozens. They have all stopped asking for candy.\n\nThe little one on your porch knocks. Three soft taps. His voice drifts through the wood. \"Please. We only want to see if anyone will look.\"`,\nA:`Open the door and hand over every piece of candy you have`,B:`Sit in the dark and wait for morning`},\naa:{x:`You pick up the mask. You tell yourself you just want to see how it's made. You turn it over and your fingers find the cool inside of it, smooth, seamless, and so very soft. And before you can stop yourself, some part of you wonders what it would be like to wear it. Just for a second.\n\nIt fits perfectly. It fits like it was made for you.\n\nThe world goes quiet. You try to pull it off, and your fingers slide across a surface with no edge. Your legs begin to move on their own, down the steps, down the street, toward the next house with its lights on.\n\nA little girl in a witch costume holds out a bowl. Your mouth moves without you. \"Trick or treat. Would you like to see under the mask?\" She hesitates. Then she smiles and says, \"Okay.\"`},\nab:{x:`You lock the door and spend the night in the dark with every light off. Nothing happens. In the morning the sheet is gone from the porch, and in its place, hanging by its elastic from the door knocker, is the plain white mask. Staring at your door.\n\nYou try to throw it away. It returns. You try to bury it in the garden. It's hanging on the door. A whole year of this. Then on the next Halloween you build a bonfire in the backyard and toss it in.\n\nIt screams like a kettle. A thin, thankful, ancient shriek. Smoke rises in the shape of a small boy, who bows, waves, and floats up into the stars.\n\nEvery Halloween after that, on your porch, you find a pillowcase full of candy you never put there, and a small note that says thank you.`},\nba:{x:`You open the door and pour the entire bowl, then the freezer stash, then the backup candy from the closet, into his pillowcase. He stares into it. Then, slowly, with small hands, he lifts the mask.\n\nUnder it is a boy. Just a boy, about eight, freckled, with a gap in his teeth, and eyes like he hasn't had anything sweet in a hundred years. He takes a piece of chocolate, unwraps it, and puts it in his mouth. His face goes completely still, and then bursts into a smile.\n\nUp and down your street the sheeted figures laugh. A small ghostly chorus of delight. They lift their masks, one by one, and walk off into the dawn, sticky-fingered, happy.\n\nYou find one white mask on the porch the next morning. It's folded in half like a card. Inside it says, in crayon, Thank you.`},\nbb:{x:`You sit in the dark until the dawn comes gray over the rooftops. When the sunrise finally reaches your windows, the street is quiet. The sheeted figures are gone. On every porch, on every door, a white mask hangs, waiting.\n\nYour own front door has one too. It's warm. And it's looking at you with an expression you've seen before.\n\nYou wonder when you stopped hearing the neighborhood. When you stopped hearing your own breath. You raise a hand to your face and your fingers slide across smooth, seamless surface.\n\nYou've been wearing it since the porch. And someone, in the street outside, small and patient, is walking up your path with an empty pillowcase, whispering through a mask exactly like yours, \"Trick or treat.\"`}\n}},\n\n{t:\"The Mirror Is Late\", k:[\"mirror\",\"mirrors\",\"reflection\"], n:{\n\"\":{x:`You notice it first in the bathroom mirror. When you raise your hand, your reflection raises its hand a moment later. Just a flicker. A blink.\n\nEach day the delay gets longer. One second. Three. Five. It starts to move on its own schedule. You catch it watching you with a patient, interested expression. Sometimes it is smiling when you aren't.\n\nTonight is Halloween. The house is quiet, your little daughter is asleep down the hall, and in the bathroom mirror, your reflection is standing perfectly still while you brush your teeth. It is not brushing its teeth.\n\nIt is just watching you. And it looks, you realize, relieved.`,\nA:`Cover the mirror with a towel`,B:`Smile at it and see what it does`},\na:{x:`You hang a towel over the mirror. In the morning, the towel is folded neatly on the sink. You tape a bedsheet over it. The sheet is gone. In every reflective surface you pass, the window, the microwave, the black TV screen, there's a quiet figure that looks like you, a little too relaxed, a little too happy, studying how you move.\n\nYou stand in the kitchen, staring at the dark glass of the oven door, and the reflection slowly raises a hand and waves before you do.`,\nA:`Smash every mirror in the house`,B:`Talk to your reflection`},\nb:{x:`You smile. The reflection smiles back, late. Then wider. Wider than your face can do. You hold the stare, and the reflection blinks first, and when it does, you see something under its eyelids, bright and curious. A little hunger.\n\nIt lifts a finger and taps the glass from the inside. Once. Twice. Three times.\n\nThe glass ripples under its fingertip like water.`,\nA:`Step closer and touch the glass`,B:`Back away and leave the house for good`},\naa:{x:`You smash them all. The bathroom. The hallway. The little compact in your purse. You sweep the shards into a bag, panting, and hurl it in the dumpster.\n\nIt's the worst mistake of your life.\n\nNow, in every piece of broken glass, in the dumpster, in the street, in the gutter, a tiny you is smiling up at the sky. A thousand little doors, each one the size of a coin. A thousand reflections, all of them waving.\n\nThat night the shards fall silent. And in the morning, somewhere in the neighborhood, a thousand small footsteps are walking, carefully, toward your house.`},\nab:{x:`\"What do you want?\" you whisper.\n\nThe reflection's mouth moves, silent, and you read its lips. Switch with me. Just for one night. I'm so tired of being the one who watches.\n\nThe idea is almost kind. It has done everything you did, every day, for years, without a word. You say yes. The glass ripples and you step through, cold as a pond, and suddenly you are on the other side, in the quiet echo of the bathroom, pressing your hands to the glass.\n\nYour reflection, now you, walks out of the room and down the hall. At dawn it makes breakfast for your daughter.\n\nShe looks up and says quietly, \"That's not Daddy.\" And then she looks straight into the hallway mirror, straight at you, and taps the glass three times.`},\nba:{x:`You touch the glass. It's warm, soft, like skin. Your hand slides in up to the wrist, and a hand on the other side grips yours, firmly, and pulls.\n\nYou tumble through into the echo of your bathroom. Everything is reversed. Cold, silent, without a drop of sound. You turn, and through the glass, you watch yourself straighten up, smooth your hair, and give a small, careful, grateful smile.\n\nYour reflection walks out of the room and down the hall, into the rest of your life. At breakfast it makes pancakes for your daughter.\n\nShe watches it for a long time. Then she walks to the mirror, looks straight at you, and taps the glass three times. \"That's not Daddy,\" she whispers.`},\nbb:{x:`You back out of the bathroom, grab your daughter and your keys, and drive away in your pajamas. You never go back. You rent a little apartment above a bakery, and every mirror in it is covered with a cloth.\n\nThe old house goes on the market. A nice young couple buys it. They have a little boy, five years old, who loves the house, especially the bathroom, where he has a new friend who looks just like him.\n\n\"He's very polite,\" the boy tells his parents. \"He waves after I do. And he says he's been waiting such a long time.\"\n\nOn Halloween, when the boy turns six, his parents hear him laughing in the bathroom. They hear two voices. Then one.`}\n}}\n,\n\n{t:\"The Bone Dancers\", k:[\"bone\",\"bones\",\"skeleton\",\"skeletons\",\"couple\",\"dance\",\"dancers\",\"dancing\",\"forest\",\"woods\"], n:{\n\"\":{x:`Deep in the oldest part of the woods, where the path gives up and the moonlight comes down in pieces, there is a clearing where two skeletons dance.\n\nYou hear them before you see them. A soft, dry cranking of bones. A click of knuckles. And between the two of them, shining in the moonlight, a thin silver cord, running from his ribs to hers.\n\nThey are bound by fate. Every Halloween, in every lifetime, they find each other again and meet in this clearing to dance. If they ever get the dance exactly right, the very last step, the one that always goes wrong, they will have skin again, and warm hands, and a whole long life to spend together.\n\nFor a hundred years it has gone wrong. Tonight, they've seen you.`,\nA:`Hide behind a tree and watch`,B:`Step into the clearing and offer to help`},\na:{x:`You crouch behind a mossy trunk. They dance, bowing, spinning, so graceful that for a moment you forget they have no faces. But at the final step, her foot catches a root. They tumble. The cord tangles around them in a silver knot. They lie there in a heap of clicking bones, and the leaves whisper, \"Again.\"\n\nThey rise. They begin again. You notice, carved low on the tree beside you, a rhyme worn almost smooth. A tune, in notches, the missing tune of the dance. You realize the old waltz has been playing in your head since you walked into the woods. You've never heard it before. You know every note.`,\nA:`Cut the silver cord with your pocketknife`,B:`Hum the tune you've been hearing`},\nb:{x:`You walk into the moonlight with your hands raised. The dancers stop. Two empty skulls turn your way. She curtsies. He bows.\n\nThey can't speak, but they show you, in a clatter of gestures. Each Halloween they get closer. They dance every step right, all the way to the last one, and then something is missing. A piece. A turn that needs one more pair of hands.\n\nShe holds out the silver cord to you, shyly, as if asking a favor. He points to the moon, to the leaves, to the tune trapped in the trees, and you see how badly they want to go home to being alive.`,\nA:`Hold the silver cord for them while they dance`,B:`Teach them a new, silly dance from your own time`},\naa:{x:`You flick open the blade and cut the cord. It snaps with a sound like a tiny bell. The dancers freeze, and then, gently, as if a long sleep has come at last, they fold in each other's arms and crumble into pale, soft dust.\n\nYou think you have destroyed them. But the wind takes the dust up in a swirl, and it rises in the moonlight, shining, and turns into two small white moths. They circle each other once, twice, dancing, and flutter off together into the dawn.\n\nThe cord was a chain as well as a promise. Cut it, and they are finally free. Every Halloween, two white moths come to your porch light, and dance there until sunrise. You never turn the light off.`},\nab:{x:`You hum the tune. Softly at first. The dancers lift their skulls. The music builds, and the leaves chime along, the bats join in, and the cranking of their bones falls into rhythm.\n\nThey dance every step, perfect, spinning, closer, and at the last one, the one that always fails, you hum the final turn, and they take it together.\n\nThe silver cord glows white. Flesh unspools over bone like a silk sheet, warm and pink, and two young faces blink in the moonlight, a woman with freckles and a man with a crooked grin. They laugh. They hold each other, alive.\n\nThey kiss you on both cheeks, and walk hand in hand into the dawn. The silver cord dissolves into mist. You never find the clearing again, but on Halloween nights you can still hear a waltz in the trees.`},\nba:{x:`You take the end of the cord in your hand. It is cold and heavy, and it hums like a plucked string. The dancers begin. Spin, bow, turn, step. The whole forest holds its breath.\n\nAs they dance, you feel the cord pulling at your wrist, drawing strength out of you like water out of a well. Your hair begins to turn silver. Your knees shake. But you hold on.\n\nAt the final turn they step together, and skin spreads across their bones like sunrise. The cord falls from your fingers and melts into the grass.\n\nYou wake at dawn, exhausted, with a single streak of silver in your hair that never goes away. And on every Halloween morning after, you find a small gift on your porch. A bouquet of wildflowers. And a tiny wedding ring.`},\nbb:{x:`You show them a wiggle. A silly one. Hips, shoulders, a little shuffle in the leaves, the kind of dance you do at a school party when no one's watching. The skeletons stare. Then she begins to rattle with laughter, and he bursts out in a clatter of ribs, and they try it.\n\nIt is terrible. It's wonderful. They stumble through it, whooping, bones flying, and that is exactly what a hundred years of perfect dancing had been missing. Joy. They had been so afraid of getting the steps wrong that they had forgotten to have any fun.\n\nAt the final wiggle the silver cord blazes and snaps, and skin flows over their bones, and two flushed, laughing people collapse on the leaves, alive and out of breath, giggling like children. They wave and run into the night. The cord is gone. Your shoes are covered in confetti.`}\n}},\n\n{t:\"Nine Good Deeds\", k:[\"witch\",\"witches\",\"warts\",\"wart\",\"cheat\",\"cheating\",\"cheated\",\"test\",\"deeds\",\"girl\"], n:{\n\"\":{x:`Mina was nine years old, and she cheated on a spelling test. She copied three words from the girl next to her. Nobody saw. She got a gold star.\n\nThe next morning she woke up with a wart on her nose.\n\nBy noon she had six. By dinner she had twenty, her skin had turned a pale green, and a pointed black hat had appeared on her bedpost, with a note pinned to the brim, written in curly purple ink. A crow was sitting on her windowsill. It cleared its throat.\n\n\"Cheaters turn into witches,\" the crow said wearily. \"It's a rule. Nine good deeds for nine different strangers will fix it. No credit. If anyone finds out it was you, you start over from zero. Good luck.\"`,\nA:`Sneak out and start helping strangers right away`,B:`Hide in the bedroom and cover the warts with makeup`},\na:{x:`Mina pulls on her hat and slips out into the dusk. On the corner, an old man is struggling with a bag of groceries that has split open. She bends down and helps him pick up every apple, every egg that isn't broken. One by one, a wart on her nose pops off, and disappears with a tiny puff of purple smoke.\n\n\"Thank you, young lady,\" says the old man, beaming. \"What's your name? I'd like to tell the newspaper about you.\"\n\nThe crow, perched on a lamppost, shakes its head very slowly. Mina feels a strange, tempting warmth in her chest. She wants him to know it was her. She really, really does.`,\nA:`Tell him her name, and let him tell the newspaper`,B:`Smile, shrug, and slip away without telling him`},\nb:{x:`Mina locks her door and covers her face in her mother's foundation. It runs. It cakes. By evening she looks like a haunted cupcake. Her grandmother, a quiet woman who always wears gloves, knocks on the door and says through the wood, \"Sweet pea. I knew a girl once who got warts like that. She was me.\"\n\nMina opens the door. Grandmother sits on the bed, sighs, and takes off one glove to show a faded green hand with a tiny scar where a wart used to be.\n\n\"Now, then,\" Grandmother says, \"was it a test, a game, or a promise? Tell me the truth, or nothing will help you.\"`,\nA:`Tell Grandmother everything`,B:`Say it's just a bad allergy`},\naa:{x:`The old man thanks her warmly, and the wart that had vanished comes back, bigger. The crow groans. \"Zero,\" it says. \"Back to zero.\"\n\nMina is furious. Then she is quiet. And then, slowly, she begins again. A boy's lost mitten, returned to his coat pocket. A neighbor's garden raked in the night. A stray cat's bowl, filled with fish. A stranger's bus fare, paid while he wasn't looking. Nobody ever finds out. By the ninth deed, she has stopped counting, and she's stopped waiting for the thank-you.\n\nOn the last morning she walks into school early and slides a note under her teacher's door. I cheated on the spelling test. I'm sorry. The warts vanish at once, in a thousand tiny purple puffs. The teacher, reading it, smiles. She'd known all along.`},\nab:{x:`Mina smiles, shrugs, and slips off into the dusk. Another puff of purple smoke. The wart is gone. The crow, to her surprise, gives a small approving nod.\n\nOver the next week she does eight more. She shovels a stranger's walk. She returns a lost wallet, leaving it on a porch without a note. She puts a coin in a busker's hat. She helps a lady with a stroller up a flight of steps and disappears before she can say thanks.\n\nOn the ninth day a small boy asks, \"Hey, who are you?\" and she says, \"Nobody,\" and feels something strange. Something like a glow, all to herself.\n\nThe last wart pops off her nose. She is a girl again. And the crow flies away, delighted, with a wing salute.`},\nba:{x:`Mina tells Grandmother everything. The copied words. The gold star. The lump of guilt that she's been carrying in her tummy ever since.\n\nGrandmother doesn't scold. She pulls two pointy hats out of a trunk, one old, one new, and the two of them spend a week sneaking around town in disguise. They fill a stranger's empty bird feeder. They fix a crooked sign. They sing a song outside a hospital window for a child who couldn't sleep. Nine strangers. Nine good deeds. No credit.\n\nOn Halloween night the last wart pops off with a sigh, and Mina is just a girl again. Grandmother teaches her one real witch trick as a reward, a tiny spell for finding lost mittens. It works every single time. She uses it for the rest of her life, in secret.`},\nbb:{x:`\"It's just an allergy,\" says Mina.\n\nA new wart blooms on her chin with a little pop. Grandmother raises one eyebrow. \"Is it?\" Mina insists. Pop. Another on her ear. A lie, it turns out, grows a wart. By dinner she has ninety-nine.\n\nShe cries. She finally tells the whole truth to her grandmother, to the crow, then at school to her class, her teacher, and the girl whose test she copied. The warts fall off in clumps, like dry autumn leaves.\n\nThen comes the work. Nine good deeds. Nine strangers. No credit. She does every one. But Grandmother says one wart should stay, a tiny one, on the tip of her nose, to remember by. Mina grows up to be the town's kindest anonymous helper, and people still whisper about the friendly little witch.`}\n}}\n,\n\n{t:\"Two Sisters and the Lost Ghost\", k:[\"sister\",\"sisters\",\"lost\",\"home\",\"kind\"], n:{\n\"\":{x:`On the very last street of the very last Halloween night, two sisters were walking home with sticky fingers and nearly empty pumpkin buckets. Wren was the older one, tall and calm, who always knew the way. Poppy was the younger one, who always knew the jokes.\n\nUnder the old streetlamp at the corner, on the curb, sat someone they hadn't seen all night. A girl in a faded blue dress, with a soft silver glow around her, hugging her knees. Not a costume. A real ghost, small and pale, with the saddest, most polite little face.\n\n\"Excuse me,\" she whispered. \"I think I'm lost. I've been trying to get home for a very, very long time.\"\n\nWren and Poppy looked at each other. Neither of them was scared at all.`,\nA:`Sit down and ask her what she remembers about home`,B:`Share a piece of candy with her first and sit together`},\na:{x:`The sisters sit on either side of her. The ghost closes her eyes and thinks, and her glow flickers like a candle.\n\n\"A yellow door,\" she says slowly. \"A swing on a big oak tree. And the smell of cinnamon. Somebody was always baking cinnamon rolls. Somebody who sang while she did it. And somebody who held my hand when we walked home.\"\n\nPoppy stands, brushing off her costume. \"A yellow door,\" she says. \"That's something!\" Wren smiles, and pulls out the flashlight that she always carries, and takes the ghost's cold hand like it's the most natural thing in the world.\n\n\"We'll find it,\" Wren says. \"Sisters don't leave anyone behind.\"`,\nA:`Follow the smell of cinnamon`,B:`Search the old streets for a yellow door`},\nb:{x:`The ghost can't eat the candy, but she holds it in her glowing hands and looks at it like it's a treasure. Poppy tells her the dumbest joke she knows, and the ghost laughs, a tiny sound like wind chimes.\n\nThen, softly, she starts to hum. A slow, sweet little melody. Poppy's head snaps up. \"Wren, that's Grandma's song. The one she sang when we couldn't sleep.\"\n\n\"It's an old lullaby,\" Wren says. \"Lots of families have one.\"\n\nThe ghost smiles for the first time. The humming grows a little brighter, and the three of them can feel the song tugging on them, gently, like a hand, pointing the way.`,\nA:`Sing it together, all three of you`,B:`Follow the humming and see where it leads`},\naa:{x:`The sisters follow the smell of cinnamon, through the leaves and the lamplight, around three corners and up a quiet hill, to a small house at the very end of the road. It has a yellow door. And a porch light that is on.\n\nThe door opens before they can knock. An old, old woman stands there, silver hair, soft sweater, flour on her hands. She looks at the little ghost in the blue dress. And her whole face crumples into the biggest smile in the world.\n\n\"I kept the light on,\" she says, in a trembling voice. \"Every Halloween, for seventy years. I knew you'd find your way.\"\n\nThe ghost runs into her arms. And they hold each other, and it's the warmest thing you've ever seen.\n\nThe old woman looks up at Wren and Poppy, tears shining. \"Thank you for bringing my sister home,\" she says. \"Come in. There are cinnamon rolls. There are always cinnamon rolls.\"\n\nThey eat until they're full, with the little ghost glowing happily at the table beside them. When it's time to go, the old woman hugs them both and says, \"Love your sister well. Hold on to each other. The people who love us never really leave. They walk beside us, in songs, in the smell of cinnamon, in a light left on.\"\n\nWren and Poppy walk home holding hands. And all the way, it feels like someone is walking beside them.`},\nab:{x:`They walk the oldest streets of town and look at every door. Red. Blue. Brown. Brown. And at last, behind a tall hedge, a small yellow door with a swing on the oak tree beside it, moving gently by itself.\n\nThe little ghost lets go of their hands. She tiptoes up the path. The door opens, and warm light spills out, and the smell of cinnamon, and inside the house a long table is set. Around it sit gentle, glowing figures, a mother, a father, a tall boy, a grandmother, all with their arms open.\n\n\"There she is,\" says the grandmother. \"We left the light on.\"\n\nThe ghost turns once, and curtsies to the sisters, and whispers something that Wren remembers the rest of her life.\n\n\"Hold on to each other,\" she says. \"The people who love us never really leave. They walk beside us, in songs, in the smell of cinnamon, in a light left on.\"\n\nThe door closes softly, gold and warm. The sisters stand a long time on the path, then walk home hand in hand. They sleep soundly that night, and in the morning there is a small, glowing, silver button on Poppy's pillow, and a feeling that somebody lovely is looking after them both.`},\nba:{x:`The three of them sing, Wren and Poppy and the little ghost, soft and clear, in the dark and the cold. And the song grows. Across the town, from the windows and the porches and the trees, other voices join in, very faint, very sweet. Voices of grandmothers and grandfathers, mothers, aunts, all the people who ever sang a child to sleep.\n\nA path of tiny golden lights glimmers into being on the pavement, winding up the hill to a yellow door. The sisters walk her to it, still singing. The door opens. And a warm, glowing family waits inside, laughing and crying and holding their arms out wide.\n\nThe little ghost looks back at the sisters, bright as a lantern, and says, \"Thank you for singing with me.\"`},\nbb:{x:`The ghost leads them. The humming guides her, like a thread in the dark, through the park, past the old fountain, to a huge oak tree at the end of a road, where a wooden swing hangs from a branch. She sits on it. It begins to move on its own.\n\n\"I remember now,\" she says. \"I wasn't lost, really. I was waiting here. I just needed someone to sit with me while I remembered.\"\n\nA yellow light opens behind the oak, a doorway of warm gold, and a whole family stands in it, smiling, calling her name. She hops off the swing and runs through the doorway, glowing, and turns once to wave at the two girls who walked her all the way.`}\n}}\n];;return STORIES})();\nvar HW=false,HG=null,NOV=[],LS=null,PEND=null,SQ=[],SB=[],nextLine=0,sceneAt=Date.now()+30000,lastIn=Date.now();\nvar _r0=reply,_sn=showNode;\nfunction NM(){return(typeof mem!=='undefined'&&mem.name)?mem.name:'';}\n['pointerdown','keydown','touchstart'].forEach(function(e){document.addEventListener(e,function(){lastIn=Date.now();},{passive:true});});\nvar sty=document.createElement('style');\nsty.textContent=\"body.hw{--orange:#ff7a1a;--ink:#e8dccb;background:#07070a!important}body.hw .bot{background:#12100f!important;border-color:#2e2217!important;box-shadow:none!important}body.hw .me{background:#3a1d08!important;border-color:#5b2f0e!important;box-shadow:none!impor M({id:'february',m:1,title:"Pumpkin Man's Valentine Post Office",em:'💌',deco:'💘',gate:'Come in. Mail call.',btn:'Open the mailbox',bg:'#2a0a14',ink:'#ffe4ea',ac:'#ff5d8f',
hello:"Happy Valentine's month! It's the shortest month, and somehow still the longest bill. Margaret is minding the shoebox mailboxes.",
jokes:["February is the shortest month, and still manages to have the most paperwork and feelings.","Why is February so short? It heard it was the month of bills and ran.","I got a valentine from my mailbox. It was a flyer, but I felt chosen.","My love language is leftover cake. Don't tell the cake.","February has 28 days because love is long and the calendar is not."],
facts:["Valentine's cards date back centuries; handwritten notes were the original text message.","Schools have traded valentines in decorated shoebox mailboxes for generations."],
marg:["The snowman and I are on vacation. I'm writing this from a lawn chair made of felt.","The reindeer left for the North Pole. Yearly Olympic training. Think NFL camp, but with antlers.","I voted for February. It tries so hard."],
idle:["Do something for yourself today. A warm drink, a nap, a song. You count too.","Doing something for yourself sometimes isn't selfish. It's maintenance.","Bills are due and hearts are tender. One of those I can't fix. I'll sit with you on the other."],
stories:[["The Shoebox Mailbox","Everyone decorated a shoebox with foil and glitter, and cards poured in. Mia's box stayed nearly empty. She smiled and pretended not to look. At the end of the day, a girl named Joy walked over, put a handmade card straight into Mia's hand, and said, 'Will you be my friend?' Mia said yes. They traded cards every year after that."],["The Two Mugs","Ed and Lena shared a kitchen and never spoke. One cold morning he left a second mug by the kettle with a sticky note: 'for you.' She left cookies. By spring they were laughing over the same toaster."],["The Late Letter","A letter written in 1998 arrived in 2026 at the right door. It said only, 'I am glad you exist.' Margaret says some mail is just on time in a different way."]],
music:{r:55,s:[0,4,7,9,12,7,4,2],w:'sine',b:70}}),
M({id:'march',m:2,title:"Pumpkin Man and the March Hare",em:'🐰',deco:'📺',gate:'Spring is thinking about it.',btn:'Hop in',bg:'#0e2a3a',ink:'#ffe9d2',ac:'#ff9a3c',
hello:"The March Hare is here! My ears are on like a TV set (and yes, I fixed the reception). Easter is on its way and the games are on.",
jokes:["Why did the leprechaun take a nap? He was feeling a little clover-ed.","Where do leprechauns keep their money? In a coin purse of gold. And banks are for show.","March came in like a hare and plans to leave like a hare.","I tried to win at hide and seek. The hare found me in a second. Those ears.","What do you call a rabbit with fleas? Bugs Bunny."],
facts:["Rainbows can show up with little rain when the air holds enough moisture and the sun hits it just right.","Seeds need time in the dark soil. Digging them up to check only slows them."],
marg:["I saw a rainbow today and it hadn't even rained. There was just enough moisture and sunshine in the air.","Pumpkin Man is doing laundry. I stayed on the shelf. I am NOT going in the dryer.","The snowman wrote home. Pumpkin Man read it to me. He says the beach has too much sun and not enough snow."],
idle:["I keep hearing about 'the algorithm.' I think it's a type of dance? I'm faintly aware of many trends and understand none of them.","Someone said 'it's giving' something. Giving what? I'd like to know the gift.","Spring is for playing outside. And saving your pennies for seeds."],
stories:[["The Seeds","Ben planted tomato seeds and checked them every day. He dug them up to see. Nothing grew. His neighbor smiled and said, 'Some things grow best when you trust them in the dark.' Next year Ben waited. In July he had more tomatoes than hands."],["The Good Loser","Ana lost the final by one point and the other team's captain shook her hand, then she shook it back and meant it. Winning isn't the whole goal. But sometimes it is time to win, and you can do both: try hard and be kind."]],

hello:"April! Easter eggs, rain boots, and a joke or two. I didn't prank you. Yet.",
jokes:["April showers bring May flowers. Something has to bring the bills, though.","Why was the egg a good comedian? It cracked everybody up.","I told a joke about spring. It's still growing on me.","What do you call a rainy day in April? Wednesday, probably."],

february:{hol:{m:1,d:14,n:"Valentine's Day"},shortm:1,hint:" Ask me for a story, a joke, or a valentine.",
j:["February is so short it doesn't even have room for its own feelings. They get filed under March.","I asked February why it's only 28 days. It said, 'I'm busy. Love takes up a lot of space, and the bills take the rest.'","My valentine to you: you're the cranberry sauce of my porch. Not essential. Absolutely missed if gone.","I got a card that said 'You complete me.' It was from the pizza place. Honestly, fair.","Cupid and I have a lot in common. Terrible aim, good intentions, and we both own too many arrows and not enough pants.","They say love is blind. I say love is a pumpkin with the lights off, bumping gently into things.","Chocolate on February 15th is a bargain. Sappy on February 14th is a lifestyle. Both are valid.","If you're single this month, congratulations on your freedom. If you're not, congratulations on your commitment. I'm a pumpkin, so I get both and neither.","I wrote a love poem. It rhymed 'you' with 'you.' I'm told that's a start.","Why did the calendar get so emotional? It only had 28 days to get through all those feelings.","Roses are red, bills are due, but your tea is warm, and so are you."],
f:["The tradition of valentines swapped in classrooms in America grew widely in the 1800s.","February is the only month that can go a whole year without a full moon in some years. Fun, short-month trivia.","Leap years add February 29 about every four years.","Pink and red became the Valentine colors because of the long history of roses and hearts in love poems.","More cards are sent at Valentine's than almost any other occasion except Christmas.","The word 'valentine' comes from the name of a saint, though the exact story is a bit fuzzy."],
marg:["The snowman sent a postcard from the beach. It's damp. It says 'wish you were here' and 'help.'","The reindeer are in the North Pole Olympics. Rudolph made the finals. I'm told it's mostly sleigh-lifting and sprinting.","Pumpkin Man put a heart sticker on the mailbox. It's the only mail he's gotten that wasn't a bill.","I'm making a valentine out of a button and some thread. It's for you. Don't look yet.","February is the only month with a short fuse and a long heart.","I've decided to be the kind of felt who writes back.","The snowman called. He said the sun is great for the soul and terrible for the shape.","Pumpkin Man tried to cook dinner by candlelight. The candle did most of the work. The dinner did not."],
idle:["Do something for yourself today, even something small. A warm drink. A song. A window opened. You're allowed.","Doing something for yourself sometimes isn't selfish. It's maintenance. Even the moon takes a night off.","You don't have to earn a break. A break is not a prize. It's just a break.","I've been thinking about how many people are quietly doing their best. Including you, today. Gold star, for real.","If you haven't eaten something warm today, consider it a gentle suggestion from a pumpkin.","Love isn't only for other people. Try being on your own side for an afternoon.","I keep thinking about the person who gets zero cards in their box. If that's ever you, come sit on the porch. I'll make you one.","February is hard for a lot of folks. If it's hard for you, you're not doing it wrong."],
val:["A valentine, just for you: I'm glad you're here. Not because you did anything. Just because you are.","A valentine, just for you: you remember things other people forget, and you care when you could have just not.","A valentine, just for you: your laugh is one of those small, good things that makes a room easier.","A valentine, just for you: even on your worst day, you've been trying. I noticed.","A valentine, just for you: you're not too much and you're not too little. You're the right size for the porch.","A valentine, just for you: the world is a little softer with you in it.","A valentine, just for you: thank you for showing up today. That counts as brave.","A valentine, just for you: someone out there is lucky you exist. I'm one of them."],
small:["A small thing for you: drink a full glass of water, slowly, like it's a luxury.","A small thing for you: put one song on that you loved at fifteen. Let yourself feel it.","A small thing for you: wash your face with warm water and take a long breath afterward.","A small thing for you: text someone a single heart. No explanation. Let it be a surprise.","A small thing for you: step outside for ninety seconds and look at the sky.","A small thing for you: pick one thing off your list and decide it can wait until tomorrow.","A small thing for you: wear the soft thing today.","A small thing for you: write down one thing you got through this week."],
t:[["school|class|valentine box|shoebox","Shoebox mailboxes were a whole art form. Foil, glitter, a slot cut crooked. If you want, ask me for a story and I'll tell you about one."],["cupid|arrow","Cupid's aim is the stuff of legend, and not in a good way. I respect the commitment."],["date|dinner|romantic","Romance can be a candle, a blanket, and not talking. I've done it. 10 out of 10."],["chocolate|candy|cake","I support chocolate in all forms. Please don't tell the dentist."],["breakup|heartbreak|ex ","Heartbreak is just love with nowhere to go yet. I'm sorry. Sit a while. I'll bring tea."],["short month|28|leap","February is short because love is long, and the calendar is a minimalist."]],
stories:[
{t:"The Shoebox Mailbox",n:{a:{x:"In Room 12, everyone decorated shoebox mailboxes with foil, glitter, and construction paper. By afternoon the cards came in a flood. But Mia's box was nearly empty, and she kept smiling like it was fine. Who do you follow?",A:"Follow Mia",a:"m",B:"Follow Joy",b:"j"},
m:{x:"Mia counted three cards: her teacher's, one from a substitute, and a leftover with no name. She told herself that's plenty. She told herself again. Then a girl named Joy marched over with a card gone soft at the corners from being held too long.",A:"Keep listening",a:"e",B:"Keep listening",b:"e"},
j:{x:"Joy had spent all of recess on one card, made carefully, and then lost her nerve for an hour. She watched Mia's box stay flat. Her stomach flipped. Then she stood up, because someone had to.",A:"Keep listening",a:"e",B:"Keep listening",b:"e"},
e:{x:"Joy put the card straight into Mia's hands and said, 'It's for you. Will you be my friend?' Mia's whole face changed. 'Yes,' she said. They traded cards every year after that, and in sixth grade they were still saving seats for each other."}}},
{t:"The Two Mugs",n:{a:{x:"Ed and Lena shared an office kitchen and never said a word beyond 'excuse me.' One cold morning, Ed noticed Lena always used the chipped mug. What does he do?",A:"Buy her a new mug",a:"m",B:"Leave a note",b:"n"},
m:{x:"Ed bought a bright blue mug and left it by the kettle with a sticky note: 'for you.' Lena stared at it for a full minute. Then she smiled, the first time he'd seen it.",A:"Keep listening",a:"e",B:"Keep listening",b:"e"},
n:{x:"Ed wrote on a sticky note: 'Your mug is chipped. I have a spare.' It was clumsy. It was also kind. Lena read it twice and laughed out loud, alone in the kitchen.",A:"Keep listening",a:"e",B:"Keep listening",b:"e"},
e:{x:"The next day there were cookies on his desk. By spring, they shared a toaster, a lunch table, and a running joke about the kettle. They never did tell anyone where it started."}}},
{t:"The Envelope Pile",n:{a:{x:"On February 13th, Dana sat down with a pile of bills and a cold cup of tea. She wanted them all gone tonight. Her shoulders were up near her ears. What does she do?",A:"Pay them all tonight",a:"p",B:"Pay one, then rest",b:"r"},
p:{x:"Dana paid three and then stared at the fourth until the numbers swam. She let out a long breath, and a few tears came with it. A neighbor knocked with soup, no questions asked. The rest of the bills sat quietly in the pile.",A:"Keep listening",a:"e",B:"Keep listening",b:"e"},
r:{x:"Dana paid one, closed the folder, and ran a hot bath. The bills didn't vanish, but they looked smaller from the tub. She put on her favorite song, hummed along, and stopped checking the clock.",A:"Keep listening",a:"e",B:"Keep listening",b:"e"},
e:{x:"In the morning, the bills were still there, and so was Dana. She handled the next two without drama. 'Done is good,' she said. 'Gentle is also good.' Both of those were true."}}},
{t:"The Snowman's Postcard",n:{a:{x:"A postcard arrived on the porch, a little damp. It was from the Snowman on vacation. Margaret held it up. Pumpkin Man cleared his throat. Do we read it?",A:"Read it aloud",a:"r",B:"Write back first",b:"w"},
r:{x:"'Dear friends. The beach is wonderful. I have had three popsicles and one small identity crisis. A seagull took my carrot. I am developing a tan, which I think is just water. Wish you were here. Also, send ice. Love, Snowman.'",A:"Keep listening",a:"e",B:"Keep listening",b:"e"},
w:{x:"Margaret wrote back first: 'Dear Snowman. We miss you. Please stay out of the sun. Please stay in the shade. Please also have fun.' Pumpkin Man added a doodle of a heart. It looked like a tomato. It was loved anyway.",A:"Keep listening",a:"e",B:"Keep listening",b:"e"},
e:{x:"A week later, a second postcard arrived: 'Received. Cried a little. It evaporated.' Margaret taped it to the fridge, next to the first one. 'He'll be back before spring,' she said. 'Maybe a little shorter.'"}}},

function getLoc(){
  try{ var c=JSON.parse(localStorage.getItem('pmLoc')||'null'); if(c&&typeof c.lat==='number') return c; }catch(e){}

function sunriseMs(y,m,d,loc){
  var rad=Math.PI/180, N=Math.floor((Date.UTC(y,m,d)-Date.UTC(y,0,0))/86400000);
  var lw=loc.lon/15, t=N+((6-lw)/24);

  var L=M+1.916*Math.sin(M*rad)+0.020*Math.sin(2*M*rad)+282.634; L=((L%360)+360)%360;

  RA+=(Math.floor(L/90)*90)-(Math.floor(RA/90)*90); RA/=15;
  var sinDec=0.39782*Math.sin(L*rad), cosDec=Math.cos(Math.asin(sinDec));
  var cosH=(Math.cos(90.833*rad)-(sinDec*Math.sin(loc.lat*rad)))/(cosDec*Math.cos(loc.lat*rad));
  if(cosH>1||cosH<-1) return Date.UTC(y,m,d,12)-loc.lon*240000; /* polar fallback: noon-ish */
  var H=(360-Math.acos(cosH)/rad)/15;
  var T=H+RA-(0.06571*t)-6.622;
  var UT=((T-lw)%24+24)%24;
  return Date.UTC(y,m,d)+UT*3600000;
}
